<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Step Up">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Step Up: SOLO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column (phone first). Top: profile card. Bottom: floating tab bar. Quests are picture cards. Dark, cold, restrained; the artwork carries the colour. */
:root{
  --bg:#04060f; --bg2:#0a1030; --panel:rgba(15,19,42,.78); --panel2:rgba(24,30,62,.7);
  --line:rgba(130,160,255,.16); --line2:rgba(130,160,255,.3);
  --glow:#5ad2ff; --fg:#e6ecff; --dim:#8d99c2; --ok:#4fd6a8; --warn:#ffc34a; --bad:#ff5468; --violet:#9b6bff;
  --f-d:'Barlow Condensed','Oswald','Arial Narrow',system-ui,sans-serif; --f-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-b); font-size:15px; line-height:1.45;
  min-height:100vh;min-height:100dvh;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(104px + env(safe-area-inset-bottom,0px));
  padding-left:max(14px,env(safe-area-inset-left,0px)); padding-right:max(14px,env(safe-area-inset-right,0px));
}
body::before{content:'';position:fixed;left:0;right:0;top:0;bottom:0;z-index:-1;pointer-events:none;background-image:radial-gradient(700px 420px at 50% -8%,#1a2c7a55,transparent 70%),radial-gradient(520px 380px at 105% 105%,#3a1a7a33,transparent 70%)}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

.win{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 14px;box-shadow:0 8px 30px #0006;min-width:0}
.win.bad{border-color:#ff546866;background:linear-gradient(#2a0c1670,var(--panel))}
.win.vio{border-color:#9b6bff55;background:linear-gradient(#1c1250aa,var(--panel))}
.win.gold{border-color:#ffc34a55;background:linear-gradient(#2c200a77,var(--panel))}

.lbl{font-weight:600;font-size:12.5px;letter-spacing:.04em;color:var(--dim)}
.bad .lbl{color:var(--bad)}
h2{margin:0;font-family:var(--f-d);font-weight:700;font-size:23px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
h3{margin:0;font-family:var(--f-d);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums;font-weight:700}
.dim{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
p{margin:0}

/* avatar */
.avatar{--rk:#8aa0c8;position:relative;flex:none;width:96px;height:96px;border-radius:16px;border:2px solid var(--rk);box-shadow:0 0 18px color-mix(in srgb,var(--rk) 55%,transparent);background:#0b1233;overflow:hidden;display:grid;place-items:center}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.08) saturate(.85)}
.avatar::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#04060fcc);pointer-events:none}
.avatar .ph{font-family:var(--f-d);font-size:42px;font-weight:700;color:var(--rk)}
.avatar .rt{position:absolute;right:5px;bottom:2px;z-index:2;font-family:var(--f-d);font-weight:700;font-size:20px;color:var(--rk);text-shadow:0 0 8px var(--rk)}
.avatar.big{width:132px;height:132px;border-radius:20px}
.avatar.sm{width:48px;height:48px;border-radius:12px}.avatar.sm .rt{font-size:13px}.avatar.sm .ph{font-size:22px}
.r-E{--rk:#8aa0c8}.r-D{--rk:#5ad2ff}.r-C{--rk:#4fd6a8}.r-B{--rk:#ffc34a}.r-A{--rk:#ff5468}.r-S{--rk:#9b6bff}

/* rank looks */
@keyframes rkpulse{0%,100%{filter:drop-shadow(0 0 3px var(--rk))}50%{filter:drop-shadow(0 0 11px var(--rk))}}
@keyframes rkshine{to{background-position:0 0,300% 0}}
.avatar.r-D{outline:1px solid var(--rk);outline-offset:3px}
.avatar.r-C{outline:1px solid var(--rk);outline-offset:3px;box-shadow:0 0 26px var(--rk)}
.avatar.r-B,.avatar.r-A,.avatar.r-S{outline:2px solid var(--rk);outline-offset:4px;box-shadow:0 0 28px var(--rk)}
.avatar.r-A,.avatar.r-S{animation:rkpulse 2.6s ease-in-out infinite}
.avatar.r-S{border:3px solid transparent;background:linear-gradient(#0b1233,#0b1233) padding-box,linear-gradient(110deg,#9b6bff,#ffd36b,#ff5468,#4fd6a8,#9b6bff) border-box;background-size:100% 100%,300% 100%;animation:rkpulse 2.6s ease-in-out infinite,rkshine 6s linear infinite}
.avatar.sm.r-D,.avatar.sm.r-C,.avatar.sm.r-B,.avatar.sm.r-A,.avatar.sm.r-S{outline-offset:2px;box-shadow:0 0 12px var(--rk)}
.avatar.au::before{content:"";position:absolute;inset:0;border:3px solid var(--au);box-shadow:inset 0 0 14px var(--au);z-index:1;pointer-events:none;border-radius:inherit}
.avatar.sm.au::before{border-width:2px}
.badge{--rk:#8aa0c8;grid-row:span 2;width:56px;height:56px;display:grid;place-items:center;border:2px solid var(--rk);background:#0b1233;border-radius:14px;text-align:center;box-shadow:0 0 16px color-mix(in srgb,var(--rk) 55%,transparent)}
.badge b{font-family:var(--f-d);font-size:32px;line-height:1;color:var(--rk);text-shadow:0 0 14px var(--rk)}
.badge small{display:none}
.badge.r-A b,.badge.r-S b{animation:rkpulse 2.6s ease-in-out infinite}
.pname.au{color:var(--au);text-shadow:0 0 12px var(--au)}
.pn.au{color:var(--au)}
.stars{color:#ffd36b;letter-spacing:.08em;text-shadow:0 0 8px #ffd36b88;font-size:.85em}
.rankbox .rkrow{display:flex;gap:16px;align-items:center}
.rkbig{flex:none;width:84px;height:84px;display:grid;place-items:center;font-family:var(--f-d);font-weight:700;font-size:54px;color:var(--rk);border:2px solid var(--rk);box-shadow:0 0 22px var(--rk);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:#0b1233;text-shadow:0 0 14px var(--rk)}
.rkinfo{flex:1;min-width:0}
.pres{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:6px}
.pz{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-family:var(--f-d);font-size:15px;color:var(--dim);opacity:.55}
.pz small{display:block;font-size:12px;font-family:var(--f-b)}
.pz{display:flex;align-items:center;gap:8px}.pz .gi{--gs:46px;filter:grayscale(1) brightness(.7)}.pz.on .gi{filter:drop-shadow(0 0 8px #ffd36b88)}.pres{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pz.on{opacity:1;color:#ffd36b;border-color:#ffd36b88;box-shadow:0 0 10px #ffd36b33}
#modal .rankup{font-size:110px;line-height:1;color:var(--rk);text-shadow:0 0 30px var(--rk);animation:rkpulse 2s ease-in-out infinite}
#modal .big.stars{color:#ffd36b;text-shadow:0 0 20px #ffd36b88}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
#modal .pick{justify-content:center}
.pick button{font-family:var(--f-d);letter-spacing:.04em;font-size:16px;padding:6px 12px;background:#0b1233;border:1px solid var(--line2);border-radius:10px;color:var(--fg);cursor:pointer;line-height:1.15}
.pick button.on{border-color:var(--glow);box-shadow:0 0 10px #5ad2ff66;color:#fff;background:#12306b}
.pick button small{display:block;font-size:11.5px;color:var(--dim);font-family:var(--f-b)}
.pick button[disabled]{opacity:.45}
.pick .sw{width:34px;height:34px;padding:0;background:var(--c);border-color:#0006}
.pick .sw.on{outline:2px solid #fff;outline-offset:2px;box-shadow:none}
@media (prefers-reduced-motion:reduce){.avatar,.badge b,#modal .rankup,.mimg.hurt{animation:none!important}}

/* header */
#hdr{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;padding:12px 14px}
#hdr .avatar{grid-row:span 1;width:56px;height:56px;border-radius:14px}
#hdr .avatar .rt{font-size:15px}
#hdr .badge{grid-row:auto}
.hm{min-width:0}
.pname{font-family:var(--f-d);font-size:24px;font-weight:700;letter-spacing:.03em;line-height:1.05;overflow-wrap:anywhere}
.ptitle{color:var(--dim);font-size:13px}
.lvbox{text-align:right;line-height:1}
.lvbox small{display:block;font-size:11.5px;color:var(--dim);font-weight:600}
.lvbox b{font-family:var(--f-d);font-size:36px;color:var(--fg)}
.xpwrap{grid-column:1/-1}
.xl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-bottom:4px;font-weight:600}
.pills{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:#0c1334;border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 8px;font-family:var(--f-d);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px;flex:none}
.pill.g{color:var(--warn)}.pill.s{color:#ff8a4a}.pill.k{color:var(--glow)}
.bar{height:9px;background:#0a1233;border:1px solid var(--line);border-radius:99px;position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#2a5bff,#5ad2ff);box-shadow:0 0 10px #5ad2ff88;transition:width .3s}
.bar.ok>i{background:linear-gradient(90deg,#1fa985,var(--ok));box-shadow:0 0 10px #4fd6a888}
.bar.vio>i{background:linear-gradient(90deg,#6a3bff,var(--violet));box-shadow:0 0 10px #9b6bff88}
.bar.red>i{background:linear-gradient(90deg,#c21d38,var(--bad));box-shadow:0 0 10px #ff546888}
.bar.mp>i{background:linear-gradient(90deg,#2a3cff,#7f8bff)}

#warn{border:1px solid var(--warn);border-radius:12px;background:#3a280a88;color:var(--warn);padding:8px 14px;font-weight:600;font-size:14px;text-align:center}
#warn.hot{border-color:var(--bad);background:#3a0f1888;color:var(--bad)}

/* bottom tab bar */
#tabs{position:fixed;left:10px;right:10px;margin:0 auto;max-width:540px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;background:rgba(10,14,34,.97);border:1px solid var(--line2);border-radius:20px;box-shadow:0 10px 40px #000b}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:0;border-radius:14px;padding:8px 0 6px;color:var(--dim);font-weight:600;font-size:11.5px;min-height:52px}
#tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-selected=true]{color:#fff;background:linear-gradient(#1a3d96aa,#12286a88);box-shadow:inset 0 0 0 1px #5ad2ff66,0 0 18px #5ad2ff33}
#tabs button[aria-selected=true] svg{stroke:var(--glow)}
#tabs button .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}

main{display:flex;flex-direction:column;gap:12px;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:#0a1030;border:1px solid var(--line);border-radius:14px}
.seg button{background:transparent;border:0;border-radius:10px;padding:8px 4px;color:var(--dim);font-family:var(--f-d);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.seg button[aria-selected=true]{background:#14307a;color:#fff;box-shadow:inset 0 0 0 1px #5ad2ff55}
.sub{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cd{font-family:var(--f-d);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;color:var(--warn);letter-spacing:.04em;line-height:1}

/* quests */
.q{display:flex;flex-direction:column;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.q:first-of-type{margin-top:0}
.qt{display:flex;gap:12px;align-items:center}
.pic{--c:#2a5bff;position:relative;flex:none;overflow:hidden;background:radial-gradient(120% 120% at 30% 20%,color-mix(in srgb,var(--c) 55%,#04060f),#04060f)}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.qt .pic{width:78px;height:78px;border-radius:12px;border:1px solid var(--line2)}
.qm{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.qh{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.qn{font-weight:600;font-size:16px;overflow-wrap:anywhere;min-width:0;line-height:1.2}
.q.done .qn{color:var(--ok)}
.q.done .qn::before{content:"✓ "}
.q.done{opacity:.7}
.q.done .pic img{filter:grayscale(.7) brightness(.8)}
.qp{font-family:var(--f-d);font-variant-numeric:tabular-nums;font-size:16px;color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-d);font-size:14px;font-weight:600;letter-spacing:.03em;padding:1px 8px;border:1px solid var(--line2);border-radius:6px;color:var(--dim);background:#0a1030aa}
.chip.xp{color:var(--glow);border-color:#5ad2ff66}
.chip.g{color:var(--warn);border-color:#ffc34a66}
.chip.rk{color:var(--fg);border-color:var(--violet)}
.chip.sys{color:var(--ok);border-color:#4fd6a866}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* featured quest card */
.q.big{padding:0;overflow:hidden;gap:0;border-color:var(--line2);box-shadow:0 12px 36px #0009}
.q.big .pic{width:100%;aspect-ratio:16/9;border-radius:0;border:0}
.q.big .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#04060f00 35%,#04060fe6 100%),linear-gradient(90deg,#04060f66,transparent 40%)}
.q.big .cap{position:absolute;left:14px;right:14px;bottom:12px;z-index:2;display:flex;flex-direction:column;gap:6px}
.q.big .qn{font-family:var(--f-d);font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1;text-shadow:0 2px 14px #000}
.q.big .qp{color:#cbd6ff;font-size:18px}
.q.big .qb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.q{position:relative}
.tools{position:absolute;top:8px;right:8px;z-index:3;display:flex;gap:5px}
.q:not(.big) .qh{padding-right:70px}
.q.big .tools{top:10px;right:12px}
.q.big .tools .btn{background:#04060fb3;backdrop-filter:blur(4px)}
.q.big .tagrow{padding-right:80px}
.q.big .tagrow{position:absolute;top:10px;left:12px;right:12px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
.q.big .chip{background:#04060fb3;backdrop-filter:blur(4px)}

.btn{background:#14307acc;border:1px solid #5ad2ff99;border-radius:10px;padding:7px 15px;font-family:var(--f-d);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:16px;min-height:40px;line-height:1.1}
.btn:hover{background:#1c3f99;box-shadow:0 0 14px #5ad2ff55}
.btn.ok{border-color:var(--ok);color:#06241b;background:linear-gradient(#5ee3b8,#35c394);box-shadow:0 0 16px #4fd6a844}
.btn.warn{border-color:var(--warn);color:var(--warn);background:#3a280a55}
.btn.bad{border-color:var(--bad);color:#ffb3bd;background:#4a0f1c99}
.btn.vio{border-color:var(--violet);color:#d6c3ff;background:#2a1a5acc}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--dim)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:3px 11px;min-height:32px;font-size:14px}
.btn.ic{width:32px;min-width:0;padding:0;font-size:17px;font-family:var(--f-b)}
.q .acts{gap:6px}
.q .btn{font-size:15px;padding:6px 10px;letter-spacing:.03em}
.q .acts input.amt{width:56px;padding:8px 4px;text-align:center}
input[type=text],input[type=number],input[type=password],input[type=time],select,textarea{background:#080d28;border:1px solid var(--line2);border-radius:10px;padding:8px 11px;min-height:40px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px}
input[type=number].amt{width:76px}
input[type=file]{display:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--dim);min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.grid .wide{grid-column:1/-1}
.empty{color:var(--dim);padding:6px 0}

/* stats + skills */
.stat{display:grid;grid-template-columns:150px 1fr 38px auto;gap:10px;align-items:center;padding:6px 0}
.stat .nm{font-family:var(--f-d);font-weight:700;font-size:17px;white-space:nowrap;letter-spacing:.03em;text-transform:uppercase}
.stat .v{font-size:24px;text-align:right;color:var(--glow)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv div{border:1px solid var(--line);border-radius:12px;padding:8px 11px;background:#0a1030aa}
.kv .num{font-size:24px;display:block}
.skill{display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.skill:first-of-type{border-top:0}
.skill.lock{opacity:.5}
.skill .nm{font-family:var(--f-d);font-weight:700;letter-spacing:.04em;font-size:18px}
.char{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.char .info{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:6px}
.lore{color:var(--dim)}
.radar{display:block;width:100%;max-width:300px;margin:0 auto 6px;height:auto;overflow:visible}
.radar .ring{fill:none;stroke:#8da0ff33;stroke-width:1}
.radar .ax{stroke:#8da0ff22}
.radar .shape{fill:#5ad2ff33;stroke:#5ad2ff;stroke-width:2;stroke-linejoin:round;filter:drop-shadow(0 0 6px #5ad2ff88)}
.radar text{font-family:var(--f-d);font-size:13px;font-weight:700;fill:#aebbe8;letter-spacing:.04em;text-anchor:middle}
.radar .dot{fill:#fff}

/* shop */
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-of-type{border-top:0}
.item .nm{font-weight:600;overflow-wrap:anywhere;min-width:0;flex:1 1 90px}
.shadow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #9b6bff33;font-family:var(--f-d);font-size:18px}
.shadow:first-of-type{border-top:0}
.shadow span:first-child{color:#c1a6ff}

/* battle */
.stage{--bc:#2a5bff;position:relative;height:340px;border-radius:18px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 12px 40px #000a;background:
  radial-gradient(60% 50% at 50% 78%,color-mix(in srgb,var(--bc) 60%,transparent),transparent 70%),
  radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--bc) 35%,#04060f),#04060f 75%)}
.stage::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-8%;height:38%;background:radial-gradient(50% 60% at 50% 100%,#000c,transparent 70%),linear-gradient(transparent,#04060f99);pointer-events:none}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(100% 100% at 50% 50%,transparent 55%,#000a);pointer-events:none}
.stage.red{--bc:#d81f3c}
.stage .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;z-index:0}
.stage::before,.stage::after{z-index:1}
.stage .mimg{position:absolute;left:50%;bottom:44px;height:78%;width:auto;transform:translateX(-50%);filter:drop-shadow(0 0 28px color-mix(in srgb,var(--bc) 70%,transparent)) drop-shadow(0 14px 12px #000b);z-index:2}
.stage .mimg.hurt{animation:hurt .32s ease-out}
.stage .mimg.dead{opacity:.25;filter:grayscale(1) blur(1px)}

function migrate(){
  let ch=false;
  if((S.v||0)<3){
  (S.quests||[]).forEach(q=>{
    if(q.type==='system')return;
    if(q.type==='dungeon'){const r=RANKS[Math.min(maxGate(),Math.max(0,RANKS.indexOf(q.rank)))];q.rank=r;q.xp=DUNGEON_REWARD[r][0];q.gold=DUNGEON_REWARD[r][1]}
    else{q.xp=calcXP(q.target,q.unit,'daily');q.gold=calcGold(q.xp)}
  });
  (S.shop||[]).forEach(i=>{i.price=Math.max(Math.round(Number(i.price))||0,TIER_PRICE[shopMinTier(i.name)])});
  if(!S.cap)S.cap={day:null,xp:0,dg:0};
  S.v=3;ch=true}
  if((S.v||0)<4){
    S.aura=null;S.cls='';if(S.profile&&clsOk(S.profile.klasse,S.level||1))S.cls=S.profile.klasse;S.profile=null;
    if(!S.look)S.look=null;normGear();S.v=4;ch=true}
  if((S.v||0)<5){
    if(!S.plan||!Array.isArray(S.plan.d))S.plan=emptyPlan();S.planBonus=null;S.v=5;ch=true}
  if((S.v||0)<6){
    if(!S.pr||typeof S.pr!=='object')S.pr={};
    if(S.rcShare==null)S.rcShare=true;
    if(S.prof===undefined)S.prof=null;
    S.v=6;ch=true}
  if((S.v||0)<7){S.v=7;ch=true}
  if((S.v||0)<8){
    if(!Array.isArray(S.tlog))S.tlog=[];if(!S.exl)S.exl={};if(!S.exb)S.exb={};if(!Array.isArray(S.cx))S.cx=[];
    convertOldPlan();S.ses=null;S.v=8;ch=true}
  if((S.v||0)<9){
    if(!S.ach||typeof S.ach!=='object')S.ach={};
    if(!S.cnt||typeof S.cnt!=='object')S.cnt={};
    if(S.title==null)S.title='';
    const tl=S.tlog||[];
    S.cnt.gym=Math.max(S.cnt.gym||0,tl.length);
    S.cnt.sets=Math.max(S.cnt.sets||0,tl.reduce((a,e)=>a+(e.sets||0),0));
    S.cnt.vol=Math.max(S.cnt.vol||0,tl.reduce((a,e)=>a+(e.vol||0),0));
    if(S.tutOk==null)S.tutOk=false;
    S.v=9;ch=true}
  if((S.v||0)<10){
    S.shop=[];if(!Array.isArray(S.inv))S.inv=[];
    S.items={shield:S.started?1:0,pardon:0,decree:0};S.buy=null;if(!Array.isArray(S.goals))S.goals=[];
    S.v=10;ch=true}
  if((S.v||0)<11){
    S.shadows=(S.shadows||[]).map((x,i)=>x.t?x:Object.assign({},x,{t:STK[i%5],r:({E:0,D:0,C:1,B:1,A:2,S:3})[x.rank]||0,lv:3,xp:0}));
    S.team=S.shadows.slice().sort((a,b)=>sPow(b)-sPow(a)).slice(0,TEAM_MAX).map(x=>x.id);
    if(S.sg===undefined)S.sg=null;if(S.wr==null)S.wr='';if(S.bk==null)S.bk='';
    S.v=11;ch=true}
  if((S.v||0)<12){
    if(!S.sx||typeof S.sx!=='object')S.sx={};
    ['str','vit','agi','int','dis'].forEach(k=>{if(!(S.sx[k]>0))S.sx[k]=Math.max(0,((S.stats&&S.stats[k])||10)-10)*40});
    if(!Array.isArray(S.units))S.units=[];
    S.v=12;ch=true}
  if((S.v||0)<13){
    S.quests=(S.quests||[]).filter(q=>q.type!=='boss');
    if(S.ach&&S.ach.bo1)delete S.ach.bo1;
    if(S.title==='bo1')S.title='';
    S.v=13;ch=true}
  if((S.v||0)<14){S.v=14;ch=true}
  if((S.v||0)<15){
    S.quests=(S.quests||[]).filter(q=>q.type!=='dungeon');
    if(S.en==null)S.en=40;
    if(S.run===undefined)S.run=null;
    if(!S.fx||typeof S.fx!=='object')S.fx={vib:true,snd:false};
    if(!Array.isArray(S.exp))S.exp=[];
    if(!S.stance)S.stance='b';
    S.v=15;ch=true}
  if((S.v||0)<16){
    let g=0;const pr=it=>Math.max(1,Math.round(((it&&it.val)||0)*2));
    ['weapon','armor'].forEach(k=>{if(S.gear&&S.gear[k])g+=pr(S.gear[k])});
    (Array.isArray(S.bag)?S.bag:[]).forEach(it=>{g+=pr(it)});
    if(S.run&&Array.isArray(S.run.items)){S.run.items.forEach(it=>{g+=pr(it)});S.run.items=[]}
    if(S.run){if(S.run.pot==null)S.run.pot=0;if(S.run.key==null)S.run.key=0}
    if(g>0){S.gold=(S.gold||0)+g;S.gearNote=g}
    delete S.gear;delete S.bag;
    S.v=16;ch=true}
  return ch;
}

function pickEx(f,set){

  const N=Math.min(f==='cardio'||f==='mobility'?4:9,({15:3,30:4,45:5,60:6})[set.time]||5);

function convertOldPlan(){

  S.quests=(S.quests||[]).filter(q=>q.type!=='plan');
  if(!Array.isArray(S.cx))S.cx=[];

  const days=[];let n=0;
  for(let i=0;i<7;i++){
    const ex=[];
    (old[i]||[]).forEach(it=>{
      if(!it||it.stat==='int'||it.stat==='dis')return;
      let e=EXM[map[it.name]];
      if(!e){
        const m=/^sek/i.test(it.unit||'')?'sec':/^min/i.test(it.unit||'')?'min':/km/i.test(it.unit||'')?'km':'bw';
        e={id:'c_'+uid(),n:String(it.name||Tx("Übung")).slice(0,40),c:it.stat==='vit'?'ausdauer':it.stat==='agi'?'beweglichkeit':'rumpf',q:'bw',m,s:1,r:Number(it.target)||1,t:'o',x:[],cue:'',cx:1};
        S.cx.push(e);

      if(e.m==='bw'||e.m==='kg'){const s=t>=30?3:t>=12?2:1;ex.push({id:uid(),e:e.id,s,r:Math.max(1,Math.round(t/s))})}

    });
    if(ex.length){days.push({t:1,f:'custom',n:Tx("Training"),ex});n++}else days.push(restDay());
  }
  const set=tpDefaults();set.days=Math.min(6,Math.max(2,n));
  S.tp={v:1,set,days,at:dayKey(),legacy:1};
  S.plan=emptyPlan();
}

function setXp(e,r){
  r=Number(r)||0;
  return e.m==='min'?Math.min(40,Math.round(r/1.2)):e.m==='km'?Math.min(50,Math.round(r*8)):e.m==='sec'?Math.max(3,Math.min(8,Math.round(r/8))):6;
}
function dayMin(d){
  let m=0;
  (d.ex||[]).forEach(x=>{const e=exOf(x.e);if(!e)return;
    if(e.m==='min')m+=x.r;else if(e.m==='km')m+=x.r*6;
    else m+=x.s*((e.m==='sec'?x.r:40)+restOf(e))/60});
  return Math.max(5,Math.round(m/5)*5);
}
function dayStats(d){
  let sets=0,n=0,xp=10;
  (d.ex||[]).forEach(x=>{const e=exOf(x.e);if(!e)return;n++;const c=(e.m==='min'||e.m==='km')?1:x.s;sets+=c;for(let k=0;k<c;k++)xp+=setXp(e,x.r)});
  return {n,sets,min:dayMin(d),xp:Math.max(25,Math.min(150,xp))};
}
function mainCat(d){
  const n={};let best=null,m=0;
  (d.ex||[]).forEach(x=>{const e=exOf(x.e);if(e)n[e.c]=(n[e.c]||0)+1});
  (d.ex||[]).forEach(x=>{const e=exOf(x.e);if(e&&n[e.c]>m){m=n[e.c];best=e.c}});
  return best||'rumpf';
}

function sesCalc(){

}

function sesFinish(direct){

  const q=dfi?null:S.quests.find(x=>x.type==='gym'&&!x.done);
  let xp,vol=0,sets=0,prs=[];
  if(direct){
    const d=S.tp&&S.tp.days[wdToday()];
    if(!q||!isTrain(d))return;
    xp=Math.round(dayStats(d).xp*0.6);
    S.tlog=(S.tlog||[]).concat([{d:dayKey(),n:d.n,f:d.f,sets:0,vol:0,xp,direct:1}]).slice(-120);
  }else{
    const c=sesCalc();xp=c.xp;vol=c.vol;sets=c.sets;prs=c.prs;
    if(!sets){toast(Tx("Hake mindestens einen Satz ab"));return}
    if(!S.exl)S.exl={};if(!S.exb)S.exb={};
    const log=[];
    s.ex.forEach(x=>{
      const e=exOf(x.e);if(!e||x.sk)return;
      const dn=x.sets.filter(t=>t.d);if(!dn.length)return;
      log.push([x.e,dn.map(t=>[Number(t.w)||0,Number(t.r)||0])]);

      S.exl[x.e]={w:e.m==='kg'?mw:0,s:dn.map(t=>[Number(t.w)||0,Number(t.r)||0]),up:(e.m==='kg'&&mw>0&&ok)?1:0,at:dayKey()};
      let best=0,bw=0,br=0;
      dn.forEach(t=>{const w=Number(t.w)||0,r=Number(t.r)||0,sc=e.m==='kg'?(w>0?w*(1+r/30):0):r;if(sc>best){best=sc;bw=w;br=r}});
      const p=S.exb[x.e];if(best>0&&(!p||best>p.b))S.exb[x.e]={b:best,w:bw,r:br,at:dayKey()};
    });

  }

function goalPool(g,place,bar){
  switch(g){
    case 'kraft':return place==='gym'?['gym','pushup','pullup','plank','squat']:bar?['pushup','pullup','squat','plank','situp']:['pushup','squat','situp','plank','lunge'];
    case 'ausdauer':return ['run','walk','stairs','rope'];
    case 'abnehmen':return ['walk','squat','burpee','water','meal'];
    case 'beweglich':return ['stretch','mobility','plank'];
    case 'lernen':return ['focus','read'];
    case 'alltag':return ['wake','water','cold','meal'];
  }
  return [];
}
/* Feste Regeln, keine KI: Ziele, Ort, Erfahrung, Zeit, Einschränkungen und Max-Werte ergeben die täglichen Quests */
function buildPlan(P,rec){
  rec=rec||{};
  const lim=P.limits||[],gym=P.place==='gym',bar=gym||(P.equip||[]).includes('bar');
  const lv=({anf:0,mid:1,adv:2})[P.level]||0;
  const tf=({15:.8,30:1,45:1.1,60:1.2})[P.time]||1;
  const n=Math.min(QUEST_MAX,({15:3,30:4,45:5,60:6})[P.time]||4);
  const goals=P.goals&&P.goals.length?P.goals:['alltag'];
  const pools=goals.map(g=>goalPool(g,P.place,bar).slice());
  const out=[];
  const put=k=>{
    const e=EXL[k];if(!e||out.includes(k))return false;
    if((k==='pullup'&&!bar)||e[4].some(x=>lim.includes(x))){const a=e[5];return a&&a!==k?put(a):false}
    out.push(k);return true;
  };
  for(let guard=0;out.length<n&&pools.some(p=>p.length)&&guard<40;guard++){
    for(const p of pools){if(out.length>=n)break;while(p.length){if(put(p.shift()))break}}
  }
  if((P.role==='schule'||P.role==='uni')&&!out.includes('focus')){if(out.length>=n)out[n-1]='focus';else out.push('focus')}
  ['stretch','walk','wake','water'].forEach(k=>{if(out.length<n)put(k)});
  return out.map(k=>{
    const e=EXL[k],rv=rec[k]&&rec[k].v;
    let t;
    if(k==='gym')t=P.time===60?75:Math.max(30,P.time);
    else if(e[2]==='dis')t=1;
    else if(rv>0&&recOf(k))t=recTarget(k,rv);
    else if(e[1]==='km')t=Math.max(1,Math.round(e[3][lv]*tf*2)/2);
    else t=nice(e[3][lv]*tf);
    return mkQ(e[0],t,e[1],e[2]);
  });
}

function shadowXp(n,stat){
  const tm=teamList();if(!tm.length||!(n>0))return;

    if(s.lv>=SMAXLV)return;

    if(s.lv>l0)ups.push(s.name+' Lv '+s.lv);

function monsterTurn(blk){
  const m=B.mon,p=pStats();
  m.shield=false;
  if(B.stun>0){B.stun--;B.log.push({t:Tx("{0} ist betäubt und setzt aus.",m.name),c:'good'});fl('m',Tx("Betäubt"),'blk');return}
  const key=m.int,it=INT[key];m.last=key;
  if(key==='charge'){m.nextF='smash';B.log.push({t:Tx("{0} sammelt Kraft für einen Vernichtungsschlag!",m.name),c:'took'});fl('m','!','warn');return}
  if(key==='brace'){m.shield=true;B.log.push({t:Tx("{0} geht in Abwehr. Dein nächster Angriff verliert 60 %.",m.name),c:''});fl('m',Tx("Abwehr"),'blk');return}
  if(key==='heal'){const h=Math.round(m.max*.12);m.hp=Math.min(m.max,m.hp+h);B.log.push({t:Tx("{0} erholt sich: +{1} LP.",m.name,h),c:''});fl('m','+'+h,'heal');return}

    if(B.dodge){B.dodge=false;B.log.push({t:Tx("Du weichst {0} aus.",m.name),c:'good'});fl('p',Tx("Ausweichen"),'blk');continue}
    if(!blk&&Math.random()<p.dodge){B.log.push({t:Tx("Du weichst {0} aus.",m.name),c:'good'});fl('p',Tx("Ausweichen"),'blk');continue}
    let dmg=Math.max(1,Math.round(m.atk*it.m*(m.rage?1.2:1)*rnd(.85,1.15)-p.def));
    if(blk)dmg=Math.max(1,Math.round(dmg*(key==='spell'?.6:.35)));
    let note='';
    if(B.ward<1){dmg=Math.max(1,Math.round(dmg*B.ward));B.ward=1;note=Tx(" (Schutz)")}
    B.p.hp=Math.max(0,B.p.hp-dmg);B.pain=true;landed=true;
    const heavy=it.m>=1.8;
    B.log.push({t:m.name+(heavy?Tx(" schlägt hart zu: "):Tx(" trifft dich für "))+dmg+(blk?' (gedeckt)':'')+note+'.',c:'took'});
    fl('p','−'+dmg,heavy?'crit':'');

  }
  if(landed&&B.p.hp>0){
    if(key==='bite'&&!B.pois){B.pois={t:3,d:Math.max(1,Math.round(m.atk*.22))};B.log.push({t:Tx("Du bist vergiftet."),c:'took'})}
    if(key==='steal'){const e=Math.min(S.en||0,10);if(e>0){addEn(-e);B.log.push({t:Tx("{0} raubt dir {1} Energie.",m.name,e),c:'took'})}}

function hitMon(dmg,txt,o){

function shadowAct(id){

  else if(s.t==='beweglichkeit')hitMon(dAtk()*(0.4+0.08*P)*1.8*ra*tm,Tx("{0} sticht zu:{1}",s.name,adv),{sh:1,pierce:1,crit:1});
  else if(s.t==='geist'){
    const h=Math.round(B.p.max*Math.min(.3,.05+.015*P));B.p.hp=Math.min(B.p.max,B.p.hp+h);B.pois=null;
    B.log.push({t:Tx("{0} heilt dich: +{1} LP.",s.name,h),c:'good'});fl('p','+'+h,'heal');vib(14);sfx('heal');

  }else if(s.t==='disziplin'){

  }

function battleAct(a){

  else if(a==='guard'){blk=true;addEn(6);B.log.push({t:Tx("Du gehst in Deckung."),c:'good'});fl('p',Tx("Deckung"),'blk')}

    if(S.potions<1)return;
    S.potions--;const h=Math.round(B.p.max*0.4);B.p.hp=Math.min(B.p.max,B.p.hp+h);B.pois=null;
    B.log.push({t:Tx("Trank getrunken: +{0} Lebenspunkte.",h),c:'good'});fl('p','+'+h,'heal');vib(14);sfx('heal');
  }else if(a.startsWith('sh:')){
    if(!shadowAct(a.slice(3)))return;
  }else if(a==='cls'){
    const sp=cfx().sp;
    if(!sp||B.cc>0||(S.en||0)<sp.mp||(sp.id==='cmd'&&!B.sh.some(u=>u.cd<=0)))return;
    addEn(-sp.mp);B.cc=sp.cd;

    if(sp.id==='cry'){playerHit(2.2,sp.n+':');B.ward=Math.min(B.ward,.7)}
    else if(sp.id==='breath'){heal(.25);addEn(6)}

    else if(sp.id==='arc')playerHit(2.8,sp.n+':',true);
    else if(sp.id==='wall'){B.ward=Math.min(B.ward,.3);heal(.1);playerHit(1,sp.n+':')}
    else if(sp.id==='kill')hitMon(dAtk()*1.7*rnd(.85,1.15)*1.8,sp.n+':',{crit:true,pierce:true});

/* ----- Gefährten: Fusion + Expeditionen ----- */
const FUSE_N=3,EXP_H=[4,8];
function fuseGroups(){
  const busy=new Set((S.exp||[]).map(e=>e.id)),g={};
  S.shadows.forEach(s=>{if(busy.has(s.id)||s.r>=3)return;const k=s.t+'|'+s.r;(g[k]=g[k]||[]).push(s)});
  return Object.keys(g).filter(k=>g[k].length>=FUSE_N).map(k=>({k,t:k.split('|')[0],r:+k.split('|')[1],n:g[k].length,list:g[k]}));
}
function doFuse(k){
  const grp=fuseGroups().find(x=>x.k===k);if(!grp)return null;
  const tm=new Set(S.team||[]);
  const pick=grp.list.slice().sort((a,b)=>(tm.has(a.id)-tm.has(b.id))||a.lv-b.lv||(a.xp||0)-(b.xp||0)).slice(0,FUSE_N);
  const ids=new Set(pick.map(s=>s.id)),best=Math.max(...pick.map(s=>s.lv));
  S.shadows=S.shadows.filter(s=>!ids.has(s.id));
  S.team=(S.team||[]).filter(id=>!ids.has(id));
  const ns=mkShadow(grp.t,0);ns.r=grp.r+1;ns.lv=Math.max(1,Math.floor(best/2));ns.xp=0;
  addShadow(ns);save();
  extractModal(ns,Tx("Verschmelzung"),Tx("Drei {0}-Gefährten ({1}) wurden zu einem {2}-Gefährten.",STYPE[grp.t].n,SRAR[grp.r].n,SRAR[ns.r].n));
  return ns;
}
function fuseSection(){
  const gs=fuseGroups();
  if(!gs.length)return '';
  return Tx("<section id=\"fuse\" class=\"win vio\"><div class=\"sub\"><div><div class=\"lbl\" style=\"color:var(--violet)\">Fusion</div><h2>Verschmelzen</h2></div></div><p class=\"dim\" style=\"font-size:13px;margin-bottom:8px\">Drei Gefährten gleichen Typs und gleicher Seltenheit werden zu einem Gefährten der nächsten Seltenheit. Die schwächsten werden verbraucht.</p>{0}</section>",gs.map(g=>'<div class="item"><span class="nm">'+g.n+' × '+STYPE[g.t].n+' '+SRAR[g.r].n+'</span><span class="chip">→ '+SRAR[g.r+1].n+'</span><button class="btn '+(fuseArm===g.k?'bad':'vio')+' sm" data-act="fuse" data-id="'+g.k+'">'+(fuseArm===g.k?Tx("Sicher?"):Tx("Verschmelzen"))+'</button></div>').join(''));
}
const expSlots=()=>Math.min(3,1+Math.floor((S.shadows||[]).length/6));
const expLeft=e=>Math.max(0,e.t0+e.h*3600e3-Date.now());
const expReady=()=>(S.exp||[]).some(e=>expLeft(e)<=0&&S.shadows.some(s=>s.id===e.id));
const fmtLeft=ms=>{const m=Math.ceil(ms/60000),h=Math.floor(m/60);return Tx("{0} Min.",((h?Tx("{0} Std. ",h):'')+(m%60)))};
function expStart(sid,h){
  if(!Array.isArray(S.exp))S.exp=[];
  if(S.exp.length>=expSlots()||S.exp.some(e=>e.id===sid)||!EXP_H.includes(h))return false;
  if(!S.shadows.some(x=>x.id===sid))return false;
  S.exp.push({id:sid,t0:Date.now(),h});
  S.team=(S.team||[]).filter(id=>id!==sid);
  return true;
}
function expCollect(sid){
  const i=(S.exp||[]).findIndex(e=>e.id===sid);if(i<0)return false;
  const e=S.exp[i];if(expLeft(e)>0)return false;
  S.exp.splice(i,1);
  const s=S.shadows.find(x=>x.id===sid);if(!s)return false;
  const f=e.h/4,g=Math.round((14+s.r*10+s.lv*1.2)*f),xp=Math.round(e.h*12);
  S.gold+=g;
  let t=Tx("+{0} G und {1} Erfahrung für {2}",g,xp,s.name);
  const l0=s.lv;s.xp=(s.xp||0)+xp;
  while(s.lv<SMAXLV&&s.xp>=sNeed(s.lv)){s.xp-=sNeed(s.lv);s.lv++}
  if(s.lv>=SMAXLV)s.xp=0;
  if(s.lv>l0)t+=Tx(" (jetzt Level {0})",s.lv);
  if(Math.random()<0.22*f){S.potions++;t+=Tx(", dazu 1 Trank")}
  if(Math.random()<0.05*f){S.keys++;t+=Tx(", dazu 1 Schlüssel")}
  save();
  modal({title:Tx("Expedition beendet"),body:Tx("<p>{0} ist zurück.</p><p style=\"color:var(--ok)\">{1}.</p>",esc(s.name),esc(t)),btn:Tx("Gut")});
  return true;
}
function expSection(){
  const slots=expSlots(),ex=(S.exp||[]).filter(e=>S.shadows.some(s=>s.id===e.id)),busy=new Set(ex.map(e=>e.id)),tm=new Set(S.team||[]);
  const free=S.shadows.filter(s=>!busy.has(s.id)&&!tm.has(s.id)).sort((a,b)=>b.r-a.r||b.lv-a.lv);
  let h=Tx("<section id=\"exp\" class=\"win\"><div class=\"sub\"><div><div class=\"lbl\">Expeditionen</div><h2>{0} / {1} unterwegs</h2></div></div><p class=\"dim\" style=\"font-size:13px;margin-bottom:8px\">Schicke Gefährten aus der Reserve los. Sie bringen Gold und Erfahrung, manchmal auch einen Trank oder Schlüssel. Weitere Plätze ab 6 und 12 Gefährten.</p>",ex.length,slots);
  h+=ex.map(e=>{const s=S.shadows.find(x=>x.id===e.id),left=expLeft(e);return '<div class="item"><span class="nm">'+esc(s.name)+' <span class="dim">'+STYPE[s.t].n+'</span></span><span class="chip'+(left>0?'':' sys')+'">'+(left>0?Tx("noch {0}",fmtLeft(left)):Tx("zurück"))+'</span>'+(left>0?'':Tx("<button class=\"btn ok sm\" data-act=\"exp-get\" data-id=\"{0}\">Abholen</button>",s.id))+'</div>'}).join('');
  if(ex.length<slots){
    h+=free.length?Tx("<div class=\"acts\" style=\"margin-top:10px\"><select id=\"expSh\" aria-label=\"Gefährten wählen\" style=\"flex:1 1 150px\">{0}</select>{1}</div>",free.map(s=>'<option value="'+s.id+'">'+esc(s.name)+' · '+SRAR[s.r].n+' Lv '+s.lv+'</option>').join(''),EXP_H.map(x=>Tx("<button class=\"btn sm\" data-act=\"exp-go\" data-id=\"{0}\">{1} Std.</button>",x,x)).join(''))
      :Tx("<div class=\"empty\" style=\"margin-top:8px\">Alle Gefährten sind im Team oder unterwegs. Nur Gefährten außerhalb des Teams können losziehen.</div>");
  }
  return h+'</section>';
}
function shBtn(s,ids){
  if((S.exp||[]).some(e=>e.id===s.id))return Tx("<button class=\"btn ghost sm\" disabled>Unterwegs</button>");
  return '<button class="btn '+(ids.has(s.id)?'ghost':'ok')+' sm" data-act="sh-team" data-id="'+s.id+'">'+(ids.has(s.id)?Tx("Im Team"):Tx("Ins Team"))+'</button>';

  dlBars(h1/r.mx1*100,h2/r.mx2*100);
  const a=document.getElementById('dlt1'),b=document.getElementById('dlt2');
  if(a)a.textContent=Math.max(0,Math.round(h1))+' / '+Math.round(r.mx1)+HPL;
  if(b)b.textContent=Math.max(0,Math.round(h2))+' / '+Math.round(r.mx2)+HPL;
}
function dlLog(t,c){
  const l=document.getElementById('dllog');if(!l)return;
  const d=document.createElement('div');d.className=c||'';d.textContent=t;l.appendChild(d);
  while(l.children.length>5)l.removeChild(l.firstChild);
  l.scrollTop=l.scrollHeight;
}
function dlStep(){
  if(!dl||dl.phase!=='play')return;
  const ev=dl.r.ev;
  if(dl.i>=ev.length){dlEnd();return}
  const e=ev[dl.i++];
  const A=e.s,D=e.s===1?2:1;
  const fa=document.getElementById('dlf'+A),fd=document.getElementById('dlf'+D),rr=document.getElementById('dlr');
  const nm=(A===1?dl.me:dl.other).name,dn=(A===1?dl.other:dl.me).name;
  if(rr)rr.textContent=Tx("Runde {0}",e.r);
  [fa,fd].forEach(f=>{if(f)f.classList.remove('atk1','atk2','hit')});
  void document.body.offsetWidth;
  if(fa)fa.classList.add('atk'+A);
  const shs=fa&&fa.querySelectorAll('.dlsh img');if(shs)shs.forEach(x=>{x.classList.add('on');setTimeout(()=>x.classList.remove('on'),350)});
  const fx=document.getElementById('dlfx');
  const num=document.createElement('span');num.className=Tx("flt dlnum d{0}{1}{2}",D,e.c?' crit':'',e.m?' blk':'');
  if(e.m){num.textContent=Tx("Ausgewichen");dlLog(Tx("{0} weicht {1} aus.",dn,nm),'good')}
  else{
    num.textContent='−'+e.d;
    if(fd)fd.classList.add('hit');
    dlLog(Tx("{0} trifft {1} für {2}{3}.",nm,dn,e.d,e.c?Tx(" (kritisch!)"):''),e.s===1?'hit':'took');
    if(e.s===2)vib(e.c?[50,30,50]:30);
    else if(e.c)vib(20);
    sfx(e.c?'crit':'hit');
  }
  if(fx){fx.appendChild(num);setTimeout(()=>num.remove(),900)}
  dlHp(e.h1,e.h2);
  dl.tm=setTimeout(dlStep,dl.dt);
}
function dlSkip(){
  if(!dl||dl.phase!=='play')return;
  clearTimeout(dl.tm);dl.i=dl.r.ev.length;dlEnd();
}
function dlEnd(){
  if(!dl||dl.phase==='end')return;
  clearTimeout(dl.tm);dl.phase='end';
  const r=dl.r,me=dl.me,o=dl.other,info=dl.info;
  dlBars(r.hp1,r.hp2);
  const a=document.getElementById('dlt1'),b=document.getElementById('dlt2');
  if(a)a.textContent=Math.round(r.hp1/100*r.mx1)+' / '+Math.round(r.mx1)+HPL;
  if(b)b.textContent=Math.round(r.hp2/100*r.mx2)+' / '+Math.round(r.mx2)+HPL;
  const sk=document.getElementById('dlskip');if(sk)sk.remove();
  const rr=document.getElementById('dlr');if(rr)rr.textContent=Tx("{0} Runden",r.rounds);

  const el=document.getElementById('dlend');
  if(el)el.innerHTML=Tx("<div class=\"dlres {0}\"><div class=\"dlbig\">{1}</div><p class=\"dim\">Übrige Lebenspunkte: du {2} %, {3} {4} %.</p><p class=\"dim\">Haltung: du {5}, Gegner {6}. {7}</p><p class=\"dim\">Konstanz-Bonus: du x{8} ({9} %), Gegner x{10} ({11} %).</p>{12}<p class=\"dim\" id=\"dlnote\">{13}</p><div class=\"acts\"><button class=\"btn\" data-act=\"dl-share\">Teilen</button><button class=\"btn ghost\" data-act=\"dl-close\">Schließen</button></div></div>",r.win?'w':'l',r.win?Tx("Sieg"):Tx("Niederlage"),r.hp1,esc(o.name),r.hp2,STN[stnOf(me)].n,STN[stnOf(o)].n,bonus,r.m1.toFixed(2),me.cons,r.m2.toFixed(2),o.cons,info.rw?'<p style="color:var(--ok)">'+esc(info.rw)+'</p>':'',esc(info.note||''));
  if(r.win)vib([40,30,40]);
  sfx(r.win?'win':'lose');
  if(info.xp&&!info.paid){info.paid=1;grantXP(info.xp)}
}
function dlClose(){
  if(dl&&dl.phase==='play')dlSkip();
  if(dl)clearTimeout(dl.tm);
  dl=null;
  const e=document.getElementById('dl');if(e)e.remove();
  render();
}

function duelApply(me,other,r){
  const today=dayKey();
  if(S.arena.day!==today){S.arena.day=today;S.arena.n=0;S.arena.dk=[]}
  S.arena.dk=S.arena.dk||[];
  const key=String(hash32(ck(other)));
  let rw='',xp=0;
  if(!S.arena.dk.includes(key)){
    S.arena.dk.push(key);
    if(r.win){S.arena.w++;if(S.arena.n<3){S.arena.n++;S.gold+=15;xp=20;rw=Tx("+15 G und +20 XP (Duell-Belohnung {0}/3 heute)",S.arena.n)}else rw=Tx("Heute keine Belohnung mehr (max. 3 Siege).")}
    else S.arena.l++;
  }else rw=Tx("Gleicher Gegner, gleicher Tag: nicht erneut gezählt.");
  save();
  return {rw,xp,note:'',paid:0};
}
async function duelSend(me,other,r,peerId){
  if(peerId&&online){
    try{
      const did=myId+'_'+peerId+'_'+dayKey();
      const r2=await sb.from('duels').upsert({id:did,from_id:myId,to_id:peerId,data:{fromName:me.name,toName:other.name,fromWin:r.win,rounds:r.rounds,t:Date.now()},updated_at:new Date().toISOString()});
      if(r2.error)throw r2.error;
      return Tx("Dein Freund sieht das Ergebnis in seiner Arena, sobald er die App öffnet.");
    }catch(e){return Tx("An den Freund senden hat nicht geklappt. Schick ihm stattdessen deinen Spieler-Code.")}
  }
  if(!peerId)return Tx("Dein Freund sieht dasselbe Ergebnis, wenn er deinen Spieler-Code bei sich einfügt.");
  return '';
}
async function doDuel(other,peerId,stn){
  const me=Object.assign(myCard(),{stn:STN[stn]?stn:stnOf({stn:S.stance})});
  const r=simulate(me,other);
  const info=duelApply(me,other,r);
  dl={phase:'play',other,peerId,stn:me.stn,me,r,info,i:0,dt:Math.max(240,Math.min(800,Math.round(18000/Math.max(1,r.ev.length)))),tm:null};
  dlRender();
  dl.tm=setTimeout(dlStep,700);
  const my=dl;
  const note=await duelSend(me,other,r,peerId);
  info.note=note;
  if(dl===my){const n=document.getElementById('dlnote');if(n)n.textContent=note}
}

/* ---------- Herausforderungen an Freunde ---------- */
let chal=[],chalLoaded=false,chalErr='',chalSeen=null,chBusy=false;
const CH_DAY=864e5,CH_WIN=3*CH_DAY,CH_REW=25,CH_DRAW=10,CH_STAKES=[0,10,25,50];
const chDone=()=>{if(!S.chDone||typeof S.chDone!=='object')S.chDone={};return S.chDone};
function chParse(k,v){
  const r=recOf(k);if(!r)return null;
  v=Number(String(v).replace(',','.'));if(!(v>0))return null;
  v=r.dec?Math.round(Math.min(r.max,v)*10)/10:Math.min(r.max,Math.round(v));
  return v>0?v:null;
}
/* Zustand einer Herausforderung, aus Sicht des Betrachters */
function chInfo(c){
  const now=Date.now(),cr=Date.parse(c.created_at)||now,ac=c.accepted_at?Date.parse(c.accepted_at):0;
  const me=c.from_id===myId?'from':'to';
  const myV=me==='from'?c.fv:c.tv,oV=me==='from'?c.tv:c.fv;
  let st=c.status,win=null,left=0;
  if(st==='open'){left=cr+CH_WIN-now;if(left<=0)st='expired'}
  if(st==='active'){
    left=ac+CH_WIN-now;
    if(c.fv!=null&&c.tv!=null)st='done';
    else if(left<=0)st=(c.fv!=null||c.tv!=null)?'done':'void';
  }
  if(st==='done'){
    if(c.fv!=null&&c.tv!=null)win=c.fv>c.tv?'from':c.tv>c.fv?'to':'draw';
    else win=c.fv!=null?'from':'to';
  }
  return {st,win,me,myV:myV==null?null:Number(myV),oV:oV==null?null:Number(oV),left,other:me==='from'?c.to_name:c.from_name,forfeit:st==='done'&&(c.fv==null||c.tv==null)};
}
const chClaimed=(c,i)=>!!(chDone()[c.id]||(i.me==='from'?c.fclaim:c.tclaim));
function chNeedsAck(c,i){
  if(chClaimed(c,i))return false;
  if(i.st==='done'||i.st==='void')return true;
  if((i.st==='declined'||i.st==='expired')&&i.me==='from')return true;
  return false;
}
function chAttention(){
  if(!online||!chalLoaded)return false;
  return chal.some(c=>{
    const i=chInfo(c);
    if(i.st==='open')return i.me==='to';
    if(i.st==='active')return i.myV==null;
    return chNeedsAck(c,i);
  });
}
async function loadChal(){
  if(!online||!myId||!sb)return false;
  try{
    const r=await sb.from('friend_challenges').select('*').or('from_id.eq.'+myId+',to_id.eq.'+myId).order('created_at',{ascending:false}).limit(40);
    if(r.error)throw r.error;
    chal=r.data||[];chalLoaded=true;chalErr='';
    return true;
  }catch(e){chalErr=String((e&&(e.message||e.code))||e).slice(0,120);return false}
}
const chLeft=ms=>{const h=Math.max(1,Math.ceil(ms/36e5)),d=Math.floor(h/24);return d?Tx("{0} Tg. {1} Std.",d,h%24):Tx("{0} Std.",h)};

      else row(Tx("Duell mit {0}",nm),Tx("{0} · dein Ergebnis: {1} {2}{3}",what,fmtRec(r,i.myV),esc(r.u),i.oV==null?Tx(". Warte auf {0} (noch {1}).",nm,chLeft(i.left)):''),'');
    }else if(chNeedsAck(c,i)){

        if(i.win==='draw'){t=Tx("Unentschieden gegen {0}",nm);sub=what+' · '+v;btn=Tx("+{0} G holen",CH_DRAW)}
        else if(i.win===i.me){t=Tx("Du hast gegen {0} gewonnen",nm);sub=what+(i.forfeit?Tx(" · kampflos, {0} hat nichts eingetragen",nm):' · '+v);btn=Tx("+{0} G holen",CH_REW+(chOppClaim(c,i)?c.stake:0));cls=' cwin';if(c.stake&&!chOppClaim(c,i))sub+=Tx(" · Einsatz folgt, sobald {0} bezahlt hat",nm)}
        else{t=Tx("Du hast gegen {0} verloren",nm);sub=what+(i.forfeit?Tx(" · du hast nichts eingetragen"):' · '+v)+(c.stake?' · −'+c.stake+' G':'');cls=' closs'}
      }else if(i.st==='void'){t=Tx("Duell mit {0} verfallen",nm);sub=Tx("{0} · niemand hat ein Ergebnis eingetragen",what)}
      else if(i.st==='declined'){t=Tx("{0} hat abgelehnt",nm);sub=what}
      else{t=Tx("{0} hat nicht reagiert",nm);sub=what}
      row(t,sub,'<button class="btn ok sm" data-act="ch-claim" data-id="'+esc(c.id)+'">'+btn+'</button>',cls);
    }
  });
  if(!rows.length)return '';
  return Tx("<section id=\"chal-zone\" class=\"win vio\"><div class=\"sub\"><div><div class=\"lbl\" style=\"color:var(--violet)\">Freunde</div><h2>Herausforderungen</h2></div></div>{0}</section>",rows.join(''));
}

const chOppClaim=(c,i)=>!!(i.me==='from'?c.tclaim:c.fclaim);
function chBonus(){
  const d=dayKey();
  if(!S.chwD||S.chwD.d!==d)S.chwD={d,n:0};
  if(S.chwD.n>=3)return false;
  S.chwD.n++;return true;
}
function chAuto(){
  let ch=false;
  chal.forEach(c=>{
    const i=chInfo(c);
    if(i.st==='done'&&i.win&&i.win!=='draw'&&i.win!==i.me&&!chClaimed(c,i))chClaim(c.id);
  });
  const pe=S.chPend;
  if(pe)Object.keys(pe).forEach(id=>{
    const p=pe[id],c=chal.find(x=>x.id===id);
    if(!p||Date.now()-p.t>14*864e5){delete pe[id];ch=true;return}
    if(!c)return;
    const i=chInfo(c);
    if(chOppClaim(c,i)){S.gold+=p.s;delete pe[id];ch=true;toast(Tx("Einsatz von {0}: +{1} G",i.other||Tx("deinem Gegner"),p.s))}
  });
  if(ch){save();render()}
}
async function chClaim(id){
  const c=chal.find(x=>x.id===id);if(!c)return;
  const i=chInfo(c),cd=chDone();
  if(cd[id]||!chNeedsAck(c,i))return;
  let msg='';

function completeQuest(q){
  if(q.done)return;
  q.done=true;q.cur=q.target;
  const c=capState();let gx=q.xp,gg=q.gold,capWhy=null;
  if(q.type==='dungeon'){if(c.dg>=1){gx=0;gg=0}else c.dg++}
  else if(q.type==='weekly'||q.type==='boss'||q.type==='gym'){}
  else{
    let room=Math.max(0,dayCap()-c.xp);
    if(q.type==='daily'&&q.stat){const us=(c.sx&&c.sx[q.stat])||0,sr=Math.max(0,statCap()-us);if(sr<room){room=sr;capWhy=q.stat}}
    if(gx>room){gg=Math.round(gg*room/Math.max(1,gx));gx=room}
    c.xp+=gx;
    if(q.type==='daily'&&q.stat){if(!c.sx)c.sx={};c.sx[q.stat]=(c.sx[q.stat]||0)+gx}
  }
  if(gx>0){
    S.gold+=gg;S.totalDone++;if(!S.cnt)S.cnt={};S.cnt[q.type]=(S.cnt[q.type]||0)+1;
    const cm=clsXpMul(q.stat);if(cm>1)gx=Math.round(gx*cm);
    skillGain(q.stat,gx,cm);
    const eg=Math.round(6+gx/8);addEn(eg);
    toast(Tx("Quest abgeschlossen: +{0} XP, +{1} G, +{2} Energie{3}",gx,gg,eg,gx<q.xp?Tx(" (Tageslimit)"):''));

function autoDaily(){
  const P=S.prof||{goals:['alltag'],place:'home',equip:[],level:'anf',time:30,limits:[]};
  const lim=P.limits||[],bar=P.place==='gym'||(P.equip||[]).includes('bar');
  const n=Math.min(QUEST_MAX,({15:3,30:4,45:5,60:6})[P.time]||4);
  const gs=(P.goals&&P.goals.length?P.goals:['alltag']).map(g=>GSTAT[g]).filter(Boolean);
  const last=new Set(S.autoLast||[]);
  const ok=SYS_T.filter(t=>!(t.x||[]).some(x=>lim.includes(x))&&(!t.bar||bar));
  const out=[],used=new Set();
  const take=st=>{
    let pool=ok.filter(t=>!used.has(t.n)&&(!st||t.s===st));
    const fresh=pool.filter(t=>!last.has(t.n));if(fresh.length)pool=fresh;
    if(!pool.length)return false;
    const t=pool[Math.floor(Math.random()*pool.length)];used.add(t.n);out.push(t);return true;
  };
  const cyc=gs.length?gs:STATS.map(x=>x[0]);
  for(let i=0;out.length<n-1&&i<n*4;i++)take(cyc[i%cyc.length])||take(null);
  const have=new Set(out.map(t=>t.s)),weak=STATS.map(x=>x[0]).sort((a,b)=>S.stats[a]-S.stats[b]);
  take(weak.find(k=>!have.has(k))||weak[0])||take(null);
  while(out.length<n&&take(null));
  const lm=({anf:.85,mid:1,adv:1.2})[P.level]||1,g=Math.min(1.8,1+S.level*.02);
  const qs=out.map(t=>{
    let tg=1;
    if(t.b>1){
      const r=REC.find(x=>x.re.test(t.n)),rv=r&&S.pr&&S.pr[r.k]&&S.pr[r.k].v;
      tg=rv>0?recTarget(r.k,rv):Math.max(1,nice(t.b*lm*g*rnd(.9,1.12)));
    }
    return mkQ(t.n,tg,t.u,t.s);
  });

  return qs;
}

function rollover(){
  const t=dayKey();
  if(S.lastDay===t)return;
  if(S.lastDay){
    const diff=dayNum(t)-dayNum(S.lastDay);
    const dAll=S.quests.filter(q=>q.type==='daily'),dailies=reqDaily(S.lastDay);
    recordDay(S.lastDay);
    for(let i=1;i<Math.min(diff,8);i++){const kk=addDays(S.lastDay,i),nn=reqDaily(kk).length;if(nn)S.hist[kk]={d:0,t:nn}}
    let failed=0,shielded=0;
    if(dAll.length){
      const miss=[];
      if(dailies.length&&dailies.some(q=>!q.done))miss.push(S.lastDay);
      for(let i=1;i<=Math.min(Math.max(diff-1,0),2);i++){const kk=addDays(S.lastDay,i);if(reqDaily(kk).length)miss.push(kk)}
      failed+=miss.length;
    }
    if(!S.cnt)S.cnt={};
    {
      const w0=addDays(S.lastDay,-wdOf(S.lastDay)),w1=addDays(w0,6);
      if(t>w1&&trainDays()>0&&(S.tlog||[]).filter(e=>e.d>=w0&&e.d<=w1).length>=trainDays())S.cnt.pw=(S.cnt.pw||0)+1;
    }
    let amulet=0;
    if(failed>0&&S.items&&S.items.shield>0){amulet=Math.min(failed,S.items.shield);S.items.shield-=amulet;failed-=amulet}
    if(amulet>0)modal({kind:'vio',title:Tx("Straf-Schild"),body:Tx("<p>Dein Straf-Schild hat {0} abgefangen. Es ist verbraucht.</p><p class=\"dim\">Noch {1} Schild{2} übrig.</p>",amulet>1?Tx("{0} Strafen",amulet):Tx("die Strafe"),S.items.shield,S.items.shield===1?'':PLS('e')),btn:Tx("Weiter")});
    if(failed===0&&(shielded>0||amulet>0)&&diff-1<=2){
      const keepS=S.streak>0;
      S.lastComplete=addDays(t,-1);
      if(keepS&&shielded>0){
        S.cnt.shield=(S.cnt.shield||0)+shielded;
        modal({kind:'vio',title:Tx("Serie geschützt"),body:Tx("<p>Dein Ruhetag war geplant. Deine Serie von <b>{0}</b> Tag{1} bleibt bestehen.</p><p class=\"dim\">Pro Woche schützen höchstens 2 Ruhetage deine Serie.</p>",S.streak,S.streak>1?PLS('en'):''),btn:Tx("Weiter")});
      }
    }
    if(failed>0){
      const pd=dailies.length?dailies:dAll,sx=pd.reduce((a,q)=>a+q.xp,0),sg=pd.reduce((a,q)=>a+q.gold,0);
      const lx=Math.min(S.xp,Math.round(sx*0.75*failed)),lg=Math.min(S.gold,Math.round(sg*0.4*failed));
      S.xp-=lx;S.gold-=lg;S.streak=0;
      const ptx=[];for(let i=0;i<failed;i++){const tx=genPenalty();ptx.push(tx);S.penalties.push({id:uid(),text:tx})}
      modal({kind:'bad',title:Tx("Strafe"),body:Tx("<p>Die täglichen Quests wurden nicht abgeschlossen.</p><p style=\"color:var(--bad);font-family:var(--f-d);font-size:20px\">−{0} XP, −{1} G</p><p>Strafquest{2}:<br>{3}</p><p class=\"dim\">Die Serie ist zurückgesetzt. Leiste die Strafe ab oder streiche sie mit einem Strafen-Erlass aus dem Shop.</p>",lx,lg,failed>1?'s':'',ptx.map(esc).join('<br>')),btn:Tx("Verstanden")});
    }
    const keys=Object.keys(S.hist).sort();
    while(keys.length>150)delete S.hist[keys.shift()];
  }
  if(S.auto)S.quests=autoDaily().concat(S.quests.filter(q=>q.type!=='daily'));
  S.quests=S.quests.filter(q=>q.type!=='system'&&q.type!=='plan'&&q.type!=='gym');
  S.quests.forEach(q=>{if(q.type==='daily'){q.cur=0;q.done=false}});
  if(S.ses&&(S.ses.day!==t||Date.now()-S.ses.t0>10*3600e3)){S.ses=null;sesOn=false;sesRender()}
  syncTraining();
  S.sys={day:t,q:genSys(),st:'open'};
  ensureLive();
  S.lastDay=t;spCheck();save();
}

function hash32(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ck(c){const a=[c.name,c.level,c.rank,STATS.map(([k])=>c.stats[k]),c.cons,c.gw,c.ga,c.sh];if(stnOf(c)!=='b')a.push(stnOf(c));return JSON.stringify(a)}
/* deterministic and symmetric: both sides get the same result from the same two cards */
function simulate(c1,c2){
  const sw=ck(c1)>ck(c2),x=sw?c2:c1,y=sw?c1:c2;
  const rng=mulberry32(hash32(ck(x)+'|'+ck(y)));
  const A=fighter(x,mult(x.cons),y),Bf=fighter(y,mult(y.cons),x);
  const f1=sw?Bf:A,f2=sw?A:Bf,ev=[];
  let rounds=0;
  while(A.hp>0&&Bf.hp>0&&rounds<60){
    rounds++;
    const order=(A.agi+rng()*10>=Bf.agi+rng()*10)?[[A,Bf],[Bf,A]]:[[Bf,A],[A,Bf]];
    for(const [a,d] of order){
      if(a.hp<=0||d.hp<=0)continue;
      const side=((a===A)!==sw)?1:2;
      if(rng()<d.dodge){ev.push({r:rounds,s:side,m:1,h1:Math.round(f1.hp),h2:Math.round(f2.hp)});continue}
      let v=Math.max(1,(a.atk-d.def)*(.85+rng()*.3)),cr=0;if(rng()<a.crit){v*=1.8;cr=1}
      d.hp=Math.max(0,d.hp-v);
      ev.push({r:rounds,s:side,d:Math.round(v),c:cr,h1:Math.round(f1.hp),h2:Math.round(f2.hp)});
    }
  }
  const firstWins=A.hp>Bf.hp||(A.hp===Bf.hp&&rng()<.5);
  const win=sw?!firstWins:firstWins;
  return {win,rounds,hp1:Math.round(f1.hp/f1.max*100),hp2:Math.round(f2.hp/f2.max*100),m1:mult(c1.cons),m2:mult(c2.cons),ev,mx1:f1.max,mx2:f2.max,b1:f1.bo,b2:f2.bo};
}

function viewKalender(){
  const c=consistency(),today=dayKey();
  const dow=(new Date().getDay()+6)%7;
  const start=addDays(today,-(dow+77));
  const live=(()=>{const d=reqDaily();return d.length?{d:d.filter(q=>q.done).length,t:d.length}:null})();
  let cells='';
  for(let i=0;i<84;i++){
    const k=addDays(start,i);
    if(dayNum(k)>dayNum(today)){cells+='<i class="fu"></i>';continue}
    const h=k===today?live:S.hist[k];
    let cl='';
    if(h&&h.t>0){const r=h.d/h.t;cl=r>=1?'c3':r>=0.67?'c2':r>0?'c1':'c0'}
    cells+='<i class="'+cl+(k===today?' today':'')+'" title="'+k+(h?Tx(": {0} von {1}",h.d,h.t):'')+'"></i>';
  }
  const full=Object.values(S.hist).filter(h=>h.t>0&&h.d>=h.t).length;
  return Tx("<section class=\"win\"><div class=\"sub\"><div><div class=\"lbl\">Verlauf</div><h2>Die letzten 12 Wochen</h2></div></div><div class=\"heat\" role=\"img\" aria-label=\"Kalender der letzten 12 Wochen\">{0}</div><div class=\"legend\"><span><i style=\"background:#2a1220;border:1px solid #ff546855\"></i>nichts</span><span><i style=\"background:#16337a\"></i>teilweise</span><span><i style=\"background:#2a6cd6\"></i>fast alles</span><span><i style=\"background:var(--ok)\"></i>alles</span><span>Spalten sind Wochen, Zeilen Mo bis So. Heute ist umrandet.</span></div></section><section class=\"win\"><div class=\"sub\"><div class=\"lbl\">Bilanz</div></div><div class=\"kv\"><div><span class=\"lbl\">Konstanz (30 Tage)</span><span class=\"num\">{1}</span></div><div><span class=\"lbl\">Serie</span><span class=\"num\">{2}</span></div><div><span class=\"lbl\">Beste Serie</span><span class=\"num\">{3}</span></div><div><span class=\"lbl\">Volle Tage</span><span class=\"num\">{4}</span></div><div><span class=\"lbl\">Quests gesamt</span><span class=\"num\">{5}</span></div><div><span class=\"lbl\">Kämpfe gewonnen</span><span class=\"num\">{6}</span></div></div></section>",cells,c.days?c.pct+' %':'–',S.streak,S.bestStreak,full,S.totalDone,S.wins);

      if(!Array.isArray(S.goals))S.goals=[];
      if(S.goals.length>=6){toast(Tx("Höchstens 6 Wunschziele"));return}
      S.goals.push({id:uid(),n,u,s:a,t:b,at:dayKey(),log:[]});gForm=false;save();toast(Tx("Wunschziel angelegt"));break;
    }
    case 'goal-log':{
      const g=(S.goals||[]).find(x=>x.id===id);if(!g)return;
      const v=parseFloat(String((document.getElementById('gv-'+id)||{}).value||'').replace(',','.'));
      if(!isFinite(v)){toast(Tx("Trage eine Zahl ein"));return}
      const was=goalDone(g),t=dayKey();
      g.log=g.log.filter(x=>x[0]!==t);g.log.push([t,Math.round(v*100)/100]);g.log=g.log.slice(-60);
      if(!was&&goalDone(g)&&!g.rew){g.rew=1;S.gold+=100;grantXP(150);modal({pic:'victory',kind:'vio',title:Tx("Wunschziel erreicht"),body:Tx("<p style=\"font-family:var(--f-d);font-size:22px\">{0}</p><div class=\"big\">+150 XP</div><p>+100 G. Setz dir das nächste Ziel.</p>",esc(g.n)),btn:Tx("Weiter")})}
      else toast(Tx("Eingetragen"));
      save();break;
    }
    case 'goal-del':{
      if(gArm!==id){gArm=id;break}
      S.goals=(S.goals||[]).filter(x=>x.id!==id);gArm=null;save();break;
    }
    case 'tp-off':{
      if(tpArm!=='off'){tpArm='off';break}
      S.tp=null;S.tpHide=true;tpArm=null;tpd=null;tpSetOpen=false;tpOpenEx=null;tpFocus=false;
      S.quests=S.quests.filter(q=>q.type!=='gym');S.ses=null;sesOn=false;sesRender();save();toast(Tx("Trainingsplan entfernt"));break;
    }
    case 'tp-on':S.tpHide=false;tab='plan';break;
    case 'sh-team':{
      if(!Array.isArray(S.team))S.team=[];
      if(!S.shadows.some(x=>x.id===id))return;
      if((S.exp||[]).some(e=>e.id===id)){toast(Tx("Dieser Gefährte ist auf Expedition"));return}
      if(S.team.includes(id))S.team=S.team.filter(x=>x!==id);
      else if(teamList().length>=TEAM_MAX){toast(Tx("Dein Team ist voll. Entlasse zuerst einen Gefährten."));return}
      else S.team.push(id);
      save();break;
    }
    case 'bk-save':backupSave();return;
    case 'bk-load':backupApply();break;
    case 'inst':if(instEv){instEv.prompt();instEv=null}break;
    case 'rg-open':rgOpen();return;
    case 'rg-go':rgGo();return;
    case 'rg-next':rgNext();return;
    case 'rg-close':if(rg)clearTimeout(rg.tm);rg=null;rgRender();return;
    case 'wr-ok':S.wr=weekStart();save();break;
    case 'use':{
      const h=S.inv.find(x=>x.name===id);
      if(h){h.n--;if(h.n<=0)S.inv=S.inv.filter(x=>x!==h);save();toast(Tx("Eingelöst: {0}",id))}
      break;
    }
    default:return;
  }
  render();
  doJump();
});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='bkFile'){backupRead(e.target.files[0]);e.target.value=''}});
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('[data-rg=tap]');if(t&&rg){e.preventDefault();rgTap()}});
document.addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.si){sesInput(e.target);return}
  if(e.target.id==='vEx'){vEx=e.target.value;render();return}
  if(e.target.id==='pk-q'&&pk){pk.q=e.target.value;const l=document.getElementById('pk-list');if(l)l.innerHTML=pkRows();return}
  if(form&&e.target.id==='fName'&&!form.statManual){const g=guessStat(e.target.value),sl=document.getElementById('fStat');if(g&&sl)sl.value=g}
  if(!form||(e.target.id!=='fTarget'&&e.target.id!=='fUnit'&&e.target.id!=='fName'))return;
  const p=document.getElementById('fPrev');if(p)p.textContent=prevText(readForm());
});
document.addEventListener('change',e=>{
  if(e.target.id==='avatarIn'){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)setAvatar(f);return}
  if(!form)return;
  const id=e.target.id;
  if(id==='fStat'){form.statManual=true;return}
  if(id==='fUnitSel'){form=readForm();render();return}
  if(id==='fType'||id==='fRank'){
    const old=form,f=readForm();
    if(id==='fType'){f.rank='E'}
    if(f.type==='dungeon'&&old.type!==f.type)f.stat='str';
    form=f;render();
  }
});

if(S.started&&S.sys.st==='none'){S.sys={day:dayKey(),q:genSys(),st:'open'}}
if(S.started){wkRoll();rollover();syncTraining();ensureLive();save()}
if(S.started&&S.seenV!==APP_V&&!navigator.webdriver){
  S.seenV=APP_V;save();
  modal({title:Tx("Neu in {0}",APP_V),btn:Tx("Los geht’s"),body:Tx("<ul style=\"text-align:left;padding-left:18px;margin:6px 0;font-size:15px;line-height:1.5\"><li><b>Englisch:</b> Die App gibt es jetzt auch auf Englisch. Die Sprache stellst du unter Spieler > Status > Konto > Einstellungen um</li><li><b>Daten und Konto:</b> Unter Spieler > Status > Konto kannst du Konto und alle Daten löschen. Neu: Hinweis zu Gesundheit, Datenschutz und Impressum</li><li><b>Begriffe:</b> Aus Hunter wird Spieler, aus Schatten werden Gefährten (Rekrutierung statt Extraktion)</li><li><b>Neuer Name:</b> Die App heißt jetzt Step Up: SOLO. Dein Spielstand bleibt erhalten</li><li><b>Wochenranking</b> in der Arena: Wer holt diese Woche die meisten XP, unter Freunden und in deiner Rang-Klasse. Die Plätze 1 bis 3 bekommen am Montag eine Belohnung. Abschaltbar im Ranking</li><li><b>Neue Bilder</b> für Trainingstage, Ruhetag, Fragebogen, Defizit-Training, Verlauf und alle 58 Übungen und neue Quests (Hautpflege, Zähne putzen, Vitamine, Handy-Pause, Sonnenlicht, Atemübung, Finanzen, Tanzen, Klettern, Kettlebell, Faszienrolle) unter Quest hinzufügen</li><li><b>Kopfbilder</b> für Ziele, Erfolge und Körperdaten</li><li><b>Klassen</b> haben Boni und eine Spezialfähigkeit im Kampf (Spieler > Status)</li><li><b>Quests vom System</b> als Schalter (Spieler > Konto > Einstellungen)</li><li><b>Verlauf > Training</b> zeigt dein Plus pro Übung</li><li><b>Verborgene Ränge S+ und S★</b> für lange Serien, nur ab Rang S</li><li><b>Erfolge</b> als Hex-Abzeichen mit Filter und Details</li><li><b>Körperdaten</b> im Fragebogen und unter Spieler > Status > Konto: BMI, Normbereich, Grundumsatz. Die Angaben bleiben nur auf diesem Gerät</li><li><b>Muskelkarte</b> unter Spieler > Verlauf > Muskeln: zeigt, welche Muskeln du trainiert hast, und schlägt Übungen für die schwachen vor. Mit + Heute kommt eine Übung einmalig ins heutige Training, mit + Defizit in ein eigenes Zusatztraining unter Heute</li><li><b>Ruhetage:</b> Am geplanten Ruhetag entfallen nur die Sport-Quests. Lesen, früh aufstehen und Skincare bleiben Pflicht</li><li><b>Muskelkarte:</b> Männlich oder weiblich stellst du jetzt unter Spieler > Status > Konto ein</li><li><b>Sicherheit:</b> Der Server prüft jetzt Spielstände, Herausforderungen und Duelle. Einsätze werden fairer ausgezahlt: Dein Gewinn kommt, sobald der Verlierer bezahlt hat. Pro Tag gibt es höchstens 3 Sieg-Boni.</li><li><b>Langsamerer Aufstieg:</b> Level brauchen mehr XP, Dungeons geben weniger. Rang S ist ein Ziel für ein Jahr, nicht für ein paar Wochen.</li></ul>")});
}
render();
if(!S.started&&!(SUPABASE_URL&&SUPABASE_KEY))showIntro();
initRemote();
})();
