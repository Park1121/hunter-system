<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hunter">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Hunter System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column (phone first). Top: profile card. Bottom: floating tab bar. Quests are picture cards. Dark, cold, restrained; the artwork carries the colour. */
:root{
  --bg:#04060f; --bg2:#0a1030; --panel:rgba(15,19,42,.78); --panel2:rgba(24,30,62,.7);
  --line:rgba(130,160,255,.16); --line2:rgba(130,160,255,.3);
  --glow:#5ad2ff; --fg:#e6ecff; --dim:#8d99c2; --ok:#4fd6a8; --warn:#ffc34a; --bad:#ff5468; --violet:#9b6bff;
  --f-d:'Barlow Condensed','Oswald','Arial Narrow',system-ui,sans-serif; --f-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-b); font-size:15px; line-height:1.45;
  min-height:100vh;min-height:100dvh;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(104px + env(safe-area-inset-bottom,0px));
  padding-left:max(14px,env(safe-area-inset-left,0px)); padding-right:max(14px,env(safe-area-inset-right,0px));
}
body::before{content:'';position:fixed;left:0;right:0;top:0;bottom:0;z-index:-1;pointer-events:none;background-image:radial-gradient(700px 420px at 50% -8%,#1a2c7a55,transparent 70%),radial-gradient(520px 380px at 105% 105%,#3a1a7a33,transparent 70%)}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

.win{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 14px;box-shadow:0 8px 30px #0006;min-width:0}
.win.bad{border-color:#ff546866;background:linear-gradient(#2a0c1670,var(--panel))}
.win.vio{border-color:#9b6bff55;background:linear-gradient(#1c1250aa,var(--panel))}
.win.gold{border-color:#ffc34a55;background:linear-gradient(#2c200a77,var(--panel))}

.lbl{font-weight:600;font-size:12.5px;letter-spacing:.04em;color:var(--dim)}
.bad .lbl{color:var(--bad)}
h2{margin:0;font-family:var(--f-d);font-weight:700;font-size:23px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
h3{margin:0;font-family:var(--f-d);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums;font-weight:700}
.dim{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
p{margin:0}

/* avatar */
.avatar{--rk:#8aa0c8;position:relative;flex:none;width:96px;height:96px;border-radius:16px;border:2px solid var(--rk);box-shadow:0 0 18px color-mix(in srgb,var(--rk) 55%,transparent);background:#0b1233;overflow:hidden;display:grid;place-items:center}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.08) saturate(.85)}
.avatar::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#04060fcc);pointer-events:none}
.avatar .ph{font-family:var(--f-d);font-size:42px;font-weight:700;color:var(--rk)}
.avatar .rt{position:absolute;right:5px;bottom:2px;z-index:2;font-family:var(--f-d);font-weight:700;font-size:20px;color:var(--rk);text-shadow:0 0 8px var(--rk)}
.avatar.big{width:132px;height:132px;border-radius:20px}
.avatar.sm{width:48px;height:48px;border-radius:12px}.avatar.sm .rt{font-size:13px}.avatar.sm .ph{font-size:22px}
.r-E{--rk:#8aa0c8}.r-D{--rk:#5ad2ff}.r-C{--rk:#4fd6a8}.r-B{--rk:#ffc34a}.r-A{--rk:#ff5468}.r-S{--rk:#9b6bff}

/* rank looks */
@keyframes rkpulse{0%,100%{filter:drop-shadow(0 0 3px var(--rk))}50%{filter:drop-shadow(0 0 11px var(--rk))}}
@keyframes rkshine{to{background-position:0 0,300% 0}}
.avatar.r-D{outline:1px solid var(--rk);outline-offset:3px}
.avatar.r-C{outline:1px solid var(--rk);outline-offset:3px;box-shadow:0 0 26px var(--rk)}
.avatar.r-B,.avatar.r-A,.avatar.r-S{outline:2px solid var(--rk);outline-offset:4px;box-shadow:0 0 28px var(--rk)}
.avatar.r-A,.avatar.r-S{animation:rkpulse 2.6s ease-in-out infinite}
.avatar.r-S{border:3px solid transparent;background:linear-gradient(#0b1233,#0b1233) padding-box,linear-gradient(110deg,#9b6bff,#ffd36b,#ff5468,#4fd6a8,#9b6bff) border-box;background-size:100% 100%,300% 100%;animation:rkpulse 2.6s ease-in-out infinite,rkshine 6s linear infinite}
.avatar.sm.r-D,.avatar.sm.r-C,.avatar.sm.r-B,.avatar.sm.r-A,.avatar.sm.r-S{outline-offset:2px;box-shadow:0 0 12px var(--rk)}
.avatar.au::before{content:"";position:absolute;inset:0;border:3px solid var(--au);box-shadow:inset 0 0 14px var(--au);z-index:1;pointer-events:none;border-radius:inherit}
.avatar.sm.au::before{border-width:2px}
.badge{--rk:#8aa0c8;grid-row:span 2;width:56px;height:56px;display:grid;place-items:center;border:2px solid var(--rk);background:#0b1233;border-radius:14px;text-align:center;box-shadow:0 0 16px color-mix(in srgb,var(--rk) 55%,transparent)}
.badge b{font-family:var(--f-d);font-size:32px;line-height:1;color:var(--rk);text-shadow:0 0 14px var(--rk)}
.badge small{display:none}
.badge.r-A b,.badge.r-S b{animation:rkpulse 2.6s ease-in-out infinite}
.pname.au{color:var(--au);text-shadow:0 0 12px var(--au)}
.pn.au{color:var(--au)}
.stars{color:#ffd36b;letter-spacing:.08em;text-shadow:0 0 8px #ffd36b88;font-size:.85em}
.rankbox .rkrow{display:flex;gap:16px;align-items:center}
.rkbig{flex:none;width:84px;height:84px;display:grid;place-items:center;font-family:var(--f-d);font-weight:700;font-size:54px;color:var(--rk);border:2px solid var(--rk);box-shadow:0 0 22px var(--rk);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:#0b1233;text-shadow:0 0 14px var(--rk)}
.rkinfo{flex:1;min-width:0}
.pres{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:6px}
.pz{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-family:var(--f-d);font-size:15px;color:var(--dim);opacity:.55}
.pz small{display:block;font-size:12px;font-family:var(--f-b)}
.pz{display:flex;align-items:center;gap:8px}.pz .gi{--gs:46px;filter:grayscale(1) brightness(.7)}.pz.on .gi{filter:drop-shadow(0 0 8px #ffd36b88)}.pres{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pz.on{opacity:1;color:#ffd36b;border-color:#ffd36b88;box-shadow:0 0 10px #ffd36b33}
#modal .rankup{font-size:110px;line-height:1;color:var(--rk);text-shadow:0 0 30px var(--rk);animation:rkpulse 2s ease-in-out infinite}
#modal .big.stars{color:#ffd36b;text-shadow:0 0 20px #ffd36b88}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
#modal .pick{justify-content:center}
.pick button{font-family:var(--f-d);letter-spacing:.04em;font-size:16px;padding:6px 12px;background:#0b1233;border:1px solid var(--line2);border-radius:10px;color:var(--fg);cursor:pointer;line-height:1.15}
.pick button.on{border-color:var(--glow);box-shadow:0 0 10px #5ad2ff66;color:#fff;background:#12306b}
.pick button small{display:block;font-size:11.5px;color:var(--dim);font-family:var(--f-b)}
.pick button[disabled]{opacity:.45}
.pick .sw{width:34px;height:34px;padding:0;background:var(--c);border-color:#0006}
.pick .sw.on{outline:2px solid #fff;outline-offset:2px;box-shadow:none}
@media (prefers-reduced-motion:reduce){.avatar,.badge b,#modal .rankup,.mimg.hurt{animation:none!important}}

/* header */
#hdr{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;padding:12px 14px}
#hdr .avatar{grid-row:span 1;width:56px;height:56px;border-radius:14px}
#hdr .avatar .rt{font-size:15px}
#hdr .badge{grid-row:auto}
.hm{min-width:0}
.pname{font-family:var(--f-d);font-size:24px;font-weight:700;letter-spacing:.03em;line-height:1.05;overflow-wrap:anywhere}
.ptitle{color:var(--dim);font-size:13px}
.lvbox{text-align:right;line-height:1}
.lvbox small{display:block;font-size:11.5px;color:var(--dim);font-weight:600}
.lvbox b{font-family:var(--f-d);font-size:36px;color:var(--fg)}
.xpwrap{grid-column:1/-1}
.xl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-bottom:4px;font-weight:600}
.pills{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:#0c1334;border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 8px;font-family:var(--f-d);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px;flex:none}
.pill.g{color:var(--warn)}.pill.s{color:#ff8a4a}.pill.k{color:var(--glow)}
.bar{height:9px;background:#0a1233;border:1px solid var(--line);border-radius:99px;position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#2a5bff,#5ad2ff);box-shadow:0 0 10px #5ad2ff88;transition:width .3s}
.bar.ok>i{background:linear-gradient(90deg,#1fa985,var(--ok));box-shadow:0 0 10px #4fd6a888}
.bar.vio>i{background:linear-gradient(90deg,#6a3bff,var(--violet));box-shadow:0 0 10px #9b6bff88}
.bar.red>i{background:linear-gradient(90deg,#c21d38,var(--bad));box-shadow:0 0 10px #ff546888}
.bar.mp>i{background:linear-gradient(90deg,#2a3cff,#7f8bff)}

#warn{border:1px solid var(--warn);border-radius:12px;background:#3a280a88;color:var(--warn);padding:8px 14px;font-weight:600;font-size:14px;text-align:center}
#warn.hot{border-color:var(--bad);background:#3a0f1888;color:var(--bad)}

/* bottom tab bar */
#tabs{position:fixed;left:10px;right:10px;margin:0 auto;max-width:540px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;background:rgba(10,14,34,.97);border:1px solid var(--line2);border-radius:20px;box-shadow:0 10px 40px #000b}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:0;border-radius:14px;padding:8px 0 6px;color:var(--dim);font-weight:600;font-size:11.5px;min-height:52px}
#tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-selected=true]{color:#fff;background:linear-gradient(#1a3d96aa,#12286a88);box-shadow:inset 0 0 0 1px #5ad2ff66,0 0 18px #5ad2ff33}
#tabs button[aria-selected=true] svg{stroke:var(--glow)}
#tabs button .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}

main{display:flex;flex-direction:column;gap:12px;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:#0a1030;border:1px solid var(--line);border-radius:14px}
.seg button{background:transparent;border:0;border-radius:10px;padding:8px 4px;color:var(--dim);font-family:var(--f-d);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.seg button[aria-selected=true]{background:#14307a;color:#fff;box-shadow:inset 0 0 0 1px #5ad2ff55}
.sub{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cd{font-family:var(--f-d);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;color:var(--warn);letter-spacing:.04em;line-height:1}

/* quests */
.q{display:flex;flex-direction:column;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.q:first-of-type{margin-top:0}
.qt{display:flex;gap:12px;align-items:center}
.pic{--c:#2a5bff;position:relative;flex:none;overflow:hidden;background:radial-gradient(120% 120% at 30% 20%,color-mix(in srgb,var(--c) 55%,#04060f),#04060f)}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.qt .pic{width:78px;height:78px;border-radius:12px;border:1px solid var(--line2)}
.qm{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.qh{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.qn{font-weight:600;font-size:16px;overflow-wrap:anywhere;min-width:0;line-height:1.2}
.q.done .qn{color:var(--ok)}
.q.done .qn::before{content:"✓ "}
.q.done{opacity:.7}
.q.done .pic img{filter:grayscale(.7) brightness(.8)}
.qp{font-family:var(--f-d);font-variant-numeric:tabular-nums;font-size:16px;color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-d);font-size:14px;font-weight:600;letter-spacing:.03em;padding:1px 8px;border:1px solid var(--line2);border-radius:6px;color:var(--dim);background:#0a1030aa}
.chip.xp{color:var(--glow);border-color:#5ad2ff66}
.chip.g{color:var(--warn);border-color:#ffc34a66}
.chip.rk{color:var(--fg);border-color:var(--violet)}
.chip.sys{color:var(--ok);border-color:#4fd6a866}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* featured quest card */
.q.big{padding:0;overflow:hidden;gap:0;border-color:var(--line2);box-shadow:0 12px 36px #0009}
.q.big .pic{width:100%;aspect-ratio:16/9;border-radius:0;border:0}
.q.big .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#04060f00 35%,#04060fe6 100%),linear-gradient(90deg,#04060f66,transparent 40%)}
.q.big .cap{position:absolute;left:14px;right:14px;bottom:12px;z-index:2;display:flex;flex-direction:column;gap:6px}
.q.big .qn{font-family:var(--f-d);font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1;text-shadow:0 2px 14px #000}
.q.big .qp{color:#cbd6ff;font-size:18px}
.q.big .qb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.q{position:relative}
.tools{position:absolute;top:8px;right:8px;z-index:3;display:flex;gap:5px}
.q:not(.big) .qh{padding-right:70px}
.q.big .tools{top:10px;right:12px}
.q.big .tools .btn{background:#04060fb3;backdrop-filter:blur(4px)}
.q.big .tagrow{padding-right:80px}
.q.big .tagrow{position:absolute;top:10px;left:12px;right:12px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
.q.big .chip{background:#04060fb3;backdrop-filter:blur(4px)}

.btn{background:#14307acc;border:1px solid #5ad2ff99;border-radius:10px;padding:7px 15px;font-family:var(--f-d);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:16px;min-height:40px;line-height:1.1}
.btn:hover{background:#1c3f99;box-shadow:0 0 14px #5ad2ff55}
.btn.ok{border-color:var(--ok);color:#06241b;background:linear-gradient(#5ee3b8,#35c394);box-shadow:0 0 16px #4fd6a844}
.btn.warn{border-color:var(--warn);color:var(--warn);background:#3a280a55}
.btn.bad{border-color:var(--bad);color:#ffb3bd;background:#4a0f1c99}
.btn.vio{border-color:var(--violet);color:#d6c3ff;background:#2a1a5acc}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--dim)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:3px 11px;min-height:32px;font-size:14px}
.btn.ic{width:32px;min-width:0;padding:0;font-size:17px;font-family:var(--f-b)}
.q .acts{gap:6px}
.q .btn{font-size:15px;padding:6px 10px;letter-spacing:.03em}
.q .acts input.amt{width:56px;padding:8px 4px;text-align:center}
input[type=text],input[type=number],input[type=password],input[type=time],select,textarea{background:#080d28;border:1px solid var(--line2);border-radius:10px;padding:8px 11px;min-height:40px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px}
input[type=number].amt{width:76px}
input[type=file]{display:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--dim);min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.grid .wide{grid-column:1/-1}
.empty{color:var(--dim);padding:6px 0}

/* stats + skills */
.stat{display:grid;grid-template-columns:150px 1fr 38px auto;gap:10px;align-items:center;padding:6px 0}
.stat .nm{font-family:var(--f-d);font-weight:700;font-size:17px;white-space:nowrap;letter-spacing:.03em;text-transform:uppercase}
.stat .v{font-size:24px;text-align:right;color:var(--glow)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv div{border:1px solid var(--line);border-radius:12px;padding:8px 11px;background:#0a1030aa}
.kv .num{font-size:24px;display:block}
.skill{display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.skill:first-of-type{border-top:0}
.skill.lock{opacity:.5}
.skill .nm{font-family:var(--f-d);font-weight:700;letter-spacing:.04em;font-size:18px}
.char{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.char .info{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:6px}
.lore{color:var(--dim)}
.radar{display:block;width:100%;max-width:300px;margin:0 auto 6px;height:auto;overflow:visible}
.radar .ring{fill:none;stroke:#8da0ff33;stroke-width:1}
.radar .ax{stroke:#8da0ff22}
.radar .shape{fill:#5ad2ff33;stroke:#5ad2ff;stroke-width:2;stroke-linejoin:round;filter:drop-shadow(0 0 6px #5ad2ff88)}
.radar text{font-family:var(--f-d);font-size:13px;font-weight:700;fill:#aebbe8;letter-spacing:.04em;text-anchor:middle}
.radar .dot{fill:#fff}

/* shop */
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-of-type{border-top:0}
.item .nm{font-weight:600;overflow-wrap:anywhere;min-width:0;flex:1 1 90px}
.shadow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #9b6bff33;font-family:var(--f-d);font-size:18px}
.shadow:first-of-type{border-top:0}
.shadow span:first-child{color:#c1a6ff}

/* battle */
.stage{--bc:#2a5bff;position:relative;height:340px;border-radius:18px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 12px 40px #000a;background:
  radial-gradient(60% 50% at 50% 78%,color-mix(in srgb,var(--bc) 60%,transparent),transparent 70%),
  radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--bc) 35%,#04060f),#04060f 75%)}
.stage::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-8%;height:38%;background:radial-gradient(50% 60% at 50% 100%,#000c,transparent 70%),linear-gradient(transparent,#04060f99);pointer-events:none}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(100% 100% at 50% 50%,transparent 55%,#000a);pointer-events:none}
.stage.red{--bc:#d81f3c}
.stage .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;z-index:0}
.stage::before,.stage::after{z-index:1}
.stage .mimg{position:absolute;left:50%;bottom:44px;height:78%;width:auto;transform:translateX(-50%);filter:drop-shadow(0 0 28px color-mix(in srgb,var(--bc) 70%,transparent)) drop-shadow(0 14px 12px #000b);z-index:2}
.stage .mimg.hurt{animation:hurt .32s ease-out}
.stage .mimg.dead{opacity:.25;filter:grayscale(1) blur(1px)}

/* history */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat i{aspect-ratio:1;display:block;background:#0b1233;border:1px solid #8da0ff22;border-radius:4px}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:50;background:#02040bd9;backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px}
#modal .win{width:min(480px,100%);animation:pop .22s ease-out;max-height:90vh;overflow:auto;background:#0d1230;border-color:var(--line2)}
#modal .ttl{font-family:var(--f-d);font-weight:700;font-size:30px;letter-spacing:.06em;text-transform:uppercase;text-align:center;margin:4px 0 10px}

#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(440px,calc(100% - 28px))}
#toast div{background:#0d1638f2;border:1px solid var(--line2);border-radius:12px;padding:9px 15px;font-weight:600;font-size:14.5px;box-shadow:0 8px 30px #000a;animation:pop .2s ease-out;text-align:center}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.55}}

@media (prefers-reduced-motion:reduce){#modal .win,#toast div{animation:none}.think{animation:none}.bar>i{transition:none}}

function convertOldPlan(){

  S.quests=(S.quests||[]).filter(q=>q.type!=='plan');
  if(!Array.isArray(S.cx))S.cx=[];

  const days=[];let n=0;
  for(let i=0;i<7;i++){
    const ex=[];
    (old[i]||[]).forEach(it=>{
      if(!it||it.stat==='int'||it.stat==='dis')return;
      let e=EXM[map[it.name]];
      if(!e){
        const m=/^sek/i.test(it.unit||'')?'sec':/^min/i.test(it.unit||'')?'min':/km/i.test(it.unit||'')?'km':'bw';

      if(e.m==='bw'||e.m==='kg'){const s=t>=30?3:t>=12?2:1;ex.push({id:uid(),e:e.id,s,r:Math.max(1,Math.round(t/s))})}
      else if(e.m==='sec'){const s=Math.min(3,Math.max(1,Math.round(t/45)));ex.push({id:uid(),e:e.id,s,r:Math.max(5,Math.round(t/s))})}

  }
  const set=tpDefaults();set.days=Math.min(6,Math.max(2,n));
  S.tp={v:1,set,days,at:dayKey(),legacy:1};

}
function dayStats(d){

function sesBuild(d){
  return {day:dayKey(),n:d.n,f:d.f,t0:Date.now(),cur:0,rest:null,ex:d.ex.filter(x=>exOf(x.e)).map(x=>{
    const e=exOf(x.e),L=(S.exl||{})[x.e];
    let w='';
    if(e.m==='kg'&&L&&L.w>0){w=L.w+(L.up?(e.q==='db'?(L.w<10?1:2):2.5):0)}
    const n=(e.m==='min'||e.m==='km')?1:x.s;
    return {e:x.e,rs:restOf(e),sk:0,tg:x.r,sets:Array.from({length:n},()=>({w,r:x.r,d:0}))};
  })};
}
function sesOpen(){
  const d=S.tp&&S.tp.days[wdToday()];
  if(!isTrain(d)){toast('Heute ist kein Trainingstag');return}
  const q=S.quests.find(x=>x.type==='gym'&&x.day===dayKey());
  if(q&&q.done){toast('Das Training für heute ist schon erledigt');return}
  if(S.ses&&(S.ses.day!==dayKey()||Date.now()-S.ses.t0>10*3600e3))S.ses=null;
  if(!S.ses){S.ses=sesBuild(d);save()}
  sesOn=true;sesArm=false;sesRender();sesWake();
}
function sesWake(){try{if(navigator.wakeLock&&!wakeL)navigator.wakeLock.request('screen').then(l=>{wakeL=l;l.addEventListener('release',()=>{wakeL=null})}).catch(()=>{})}catch(e){}}
function sesUnwake(){try{if(wakeL){wakeL.release();wakeL=null}}catch(e){}}
function sesCounts(){
  const s=S.ses;let dn=0,tt=0;
  s.ex.forEach(x=>{if(x.sk)return;x.sets.forEach(t=>{tt++;if(t.d)dn++})});
  return {dn,tt};
}
function sesCalc(){
  const s=S.ses;let xp=0,vol=0,sets=0,all=true;const prs=[];
  s.ex.forEach(x=>{
    const e=exOf(x.e);if(!e||x.sk)return;
    let best=0,bw=0,br=0;
    x.sets.forEach(t=>{
      if(!t.d){all=false;return}
      const r=Number(t.r)||0,w=Number(t.w)||0;sets++;xp+=setXp(e,r);

function sesFinish(direct){
  const s=S.ses;

  let xp,vol=0,sets=0,prs=[];
  if(direct){

  }else{
    const c=sesCalc();xp=c.xp;vol=c.vol;sets=c.sets;prs=c.prs;
    if(!sets){toast('Hake mindestens einen Satz ab');return}
    if(!S.exl)S.exl={};if(!S.exb)S.exb={};
    const log=[];
    s.ex.forEach(x=>{
      const e=exOf(x.e);if(!e||x.sk)return;
      const dn=x.sets.filter(t=>t.d);if(!dn.length)return;
      log.push([x.e,dn.map(t=>[Number(t.w)||0,Number(t.r)||0])]);
      const mw=Math.max(0,...dn.map(t=>Number(t.w)||0));
      const ok=dn.length>=x.sets.length&&dn.every(t=>(Number(t.r)||0)>=x.tg);
      S.exl[x.e]={w:e.m==='kg'?mw:0,s:dn.map(t=>[Number(t.w)||0,Number(t.r)||0]),up:(e.m==='kg'&&mw>0&&ok)?1:0,at:dayKey()};
      let best=0,bw=0,br=0;
      dn.forEach(t=>{const w=Number(t.w)||0,r=Number(t.r)||0,sc=e.m==='kg'?(w>0?w*(1+r/30):0):r;if(sc>best){best=sc;bw=w;br=r}});
      const p=S.exb[x.e];if(best>0&&(!p||best>p.b))S.exb[x.e]={b:best,w:bw,r:br,at:dayKey()};
    });
    S.tlog=(S.tlog||[]).concat([{d:dayKey(),n:s.n,f:s.f,ms:Date.now()-s.t0,sets,vol,xp,ex:log}]).slice(-120);

  }
  const ms=s?Date.now()-s.t0:0;

  else{S.gold+=Math.round(xp/2);grantXP(xp);toast('Training: +'+xp+' XP')}
  if(!direct){
    modal({pic:'victory',title:'Training geschafft',body:'<div class="big">+'+xp+' XP</div><div class="kv"><div><span class="lbl">Sätze</span><span class="num">'+sets+'</span></div><div><span class="lbl">Volumen</span><span class="num">'+(vol?vol+' kg':'–')+'</span></div><div><span class="lbl">Dauer</span><span class="num">'+Math.max(1,Math.round(ms/60000))+' Min.</span></div></div>'+
      (prs.length?prs.map(p=>'<p style="color:var(--warn);font-family:var(--f-d);font-size:19px;letter-spacing:.05em">Neuer Bestwert: '+esc(p.e.n)+(p.e.m==='kg'&&p.w?' '+fmtW(p.w)+' kg ×':'')+' '+p.r+(p.e.m==='kg'||p.e.m==='bw'?'':' '+unitOf(p.e))+'</p>').join(''):'')+
      '<p class="dim">Dein Körper baut jetzt auf. Iss gut und schlaf genug.</p>',btn:'Weiter'});
  }

}

function lookOf(c){
  try{
    const k=document.createElement('canvas');k.width=k.height=16;const x=k.getContext('2d');x.drawImage(c,0,0,16,16);
    const d=x.getImageData(0,0,16,16).data;let R=0,G=0,B=0,n=0;
    for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];n++}
    R/=n*255;G/=n*255;B/=n*255;
    const mx=Math.max(R,G,B),mn=Math.min(R,G,B),l=(mx+mn)/2,dl=mx-mn,sat=dl===0?0:dl/(1-Math.abs(2*l-1));
    let h=0;if(dl>0){if(mx===R)h=((G-B)/dl+(G<B?6:0));else if(mx===G)h=(B-R)/dl+2;else h=(R-G)/dl+4;h*=60}
    if(l<0.25)return 'Nacht';
    if(l>0.72&&sat<0.35)return 'Licht';
    if(sat<0.14)return 'Stahl';
    if(h<45||h>=345)return 'Flammen';
    if(h<70)return 'Sonne';
    if(h<170)return 'Wald';
    if(h<250)return 'Frost';
    return 'Schatten';
  }catch(e){return null}
}

function goalPool(g,place,bar){
  switch(g){
    case 'kraft':return place==='gym'?['gym','pushup','pullup','plank','squat']:bar?['pushup','pullup','squat','plank','situp']:['pushup','squat','situp','plank','lunge'];
    case 'ausdauer':return ['run','walk','stairs','rope'];
    case 'abnehmen':return ['walk','squat','burpee','water','meal'];
    case 'beweglich':return ['stretch','mobility','plank'];
    case 'lernen':return ['focus','read'];
    case 'alltag':return ['wake','water','cold','meal'];
  }
  return [];
}
/* Feste Regeln, keine KI: Ziele, Ort, Erfahrung, Zeit, Einschränkungen und Max-Werte ergeben die täglichen Quests */
function buildPlan(P,rec){
  rec=rec||{};
  const lim=P.limits||[],gym=P.place==='gym',bar=gym||(P.equip||[]).includes('bar');
  const lv=({anf:0,mid:1,adv:2})[P.level]||0;
  const tf=({15:.8,30:1,45:1.1,60:1.2})[P.time]||1;
  const n=Math.min(QUEST_MAX,({15:3,30:4,45:5,60:6})[P.time]||4);
  const goals=P.goals&&P.goals.length?P.goals:['alltag'];
  const pools=goals.map(g=>goalPool(g,P.place,bar).slice());
  const out=[];
  const put=k=>{
    const e=EXL[k];if(!e||out.includes(k))return false;
    if((k==='pullup'&&!bar)||e[4].some(x=>lim.includes(x))){const a=e[5];return a&&a!==k?put(a):false}
    out.push(k);return true;
  };
  for(let guard=0;out.length<n&&pools.some(p=>p.length)&&guard<40;guard++){
    for(const p of pools){if(out.length>=n)break;while(p.length){if(put(p.shift()))break}}
  }
  if((P.role==='schule'||P.role==='uni')&&!out.includes('focus')){if(out.length>=n)out[n-1]='focus';else out.push('focus')}
  ['stretch','walk','wake','water'].forEach(k=>{if(out.length<n)put(k)});
  return out.map(k=>{
    const e=EXL[k],rv=rec[k]&&rec[k].v;
    let t;
    if(k==='gym')t=P.time===60?75:Math.max(30,P.time);
    else if(e[2]==='dis')t=1;
    else if(rv>0&&recOf(k))t=recTarget(k,rv);
    else if(e[1]==='km')t=Math.max(1,Math.round(e[3][lv]*tf*2)/2);
    else t=nice(e[3][lv]*tf);
    return mkQ(e[0],t,e[1],e[2]);
  });
}

function spawnGate(force){
  const open=S.quests.filter(q=>q.type==='dungeon'&&!q.done);
  if(open.length>=GATE_MAX)return false;
  const t=dayKey(),since=S.gateAt?dayNum(t)-dayNum(S.gateAt):99;
  if(!force&&!(open.length===0&&since>=2)&&!(since>=3&&Math.random()<0.5))return false;
  const ri=rankIdx(S.level),rk=Math.min(maxGate(),ri+(Math.random()<0.3?1:0)),R=RANKS[rk];
  let ks=keysForGoals();const used=open.map(q=>q.name);
  const fresh=ks.filter(k=>!used.includes('Gate: '+EXL[k][0]));if(fresh.length)ks=fresh;
  const k=ks[Math.floor(Math.random()*ks.length)],e=EXL[k];
  const f=e[1]==='km'?1.5:/^Min/.test(e[1])?2:2.5;
  let tg=tgtFor(k)*f*(1+rk*0.25);
  tg=e[1]==='km'?Math.max(2,Math.round(tg*2)/2):nice(tg);
  S.quests.push({id:uid(),name:'Gate: '+e[0],target:tg,unit:e[1],stat:e[2],xp:DUNGEON_REWARD[R][0],gold:DUNGEON_REWARD[R][1],type:'dungeon',rank:R,cur:0,done:false,exp:addDays(t,7)});

function icsBuild(t){
  const BY=['MO','TU','WE','TH','FR','SA','SU'];
  const on=S.tp?S.tp.days.map((d,i)=>isTrain(d)?i:-1).filter(i=>i>=0):[];
  if(!on.length)return '';
  const p=n=>String(n).padStart(2,'0'),now=new Date();
  let d0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  for(let i=0;i<7&&!on.includes((d0.getDay()+6)%7);i++)d0=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+1);
  const ds=d0.getFullYear()+p(d0.getMonth()+1)+p(d0.getDate()),hm=t.replace(':',''),
    st=now.getUTCFullYear()+p(now.getUTCMonth()+1)+p(now.getUTCDate())+'T'+p(now.getUTCHours())+p(now.getUTCMinutes())+p(now.getUTCSeconds())+'Z';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Hunter System//DE','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:hunter-training@hunter-system','DTSTAMP:'+st,'DTSTART:'+ds+'T'+hm+'00','DURATION:PT1H','RRULE:FREQ=WEEKLY;BYDAY='+on.map(i=>BY[i]).join(','),'SUMMARY:Training (Hunter System)','DESCRIPTION:Öffne die App und starte dein Training.','BEGIN:VALARM','TRIGGER:PT0S','ACTION:DISPLAY','DESCRIPTION:Zeit fürs Training','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function downloadIcs(t){

    a.href=u;a.download='hunter-training.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast('Kalender-Eintrag geladen. Öffne die Datei und speichere ihn.');

}

function weekReview(){

function pickDoors(n,last){
  if(n>=ROOMS-1)return ['boss'];

  const pick=ex=>{const p=pool.filter(x=>!ex.includes(x[0]));let t=p.reduce((a,x)=>a+x[1],0),r=Math.random()*t;for(const x of p){r-=x[1];if(r<=0)return x[0]}return p[0][0]};

  if(n===0){a='fight';b=pick(['fight','rest'])}
  else if(n===ROOMS-2){a='rest';b=pick(['rest'])}
  else{const ex=last==='rest'?['rest']:[];a=pick(ex);b=pick(ex.concat([a]))}

function rollInt(m){
  if(m.nextF){const f=m.nextF;m.nextF=null;return f}
  const w={atk:56,heavy:16,charge:10,brace:8},t=m.tier;
  if(t==='elite'){w.atk=42;w.heavy=20;w.charge=16;w.brace=10}
  if(t==='boss'||t==='mimic'){w.atk=38;w.heavy=22;w.charge=18;w.brace=10}
  if(m.rage){w.atk=30;w.heavy=28;w.charge=24;w.brace=0}
  const tr=m.trait;
  if(tr==='brute')w.heavy*=2;
  if(tr==='shield')w.brace*=3;
  if(tr==='regen'&&m.hp<m.max*.8)w.heal=24;
  if(tr==='swift'){w.flurry=w.atk*.8;w.atk*=.25}
  if(tr==='poison'){w.bite=w.atk*.75;w.atk*=.25}
  if(tr==='thief'){w.steal=w.atk*.7;w.atk*=.3}
  if(tr==='caster'){w.spell=w.atk*.7;w.atk*=.3}
  if(m.last==='brace')w.brace=0;
  if(m.last==='heal')w.heal=0;
  if(m.last==='smash')w.charge=0;
  let tot=0;Object.values(w).forEach(v=>tot+=v);
  let x=Math.random()*tot;
  for(const k in w){x-=w[k];if(x<0)return k}
  return 'atk';
}

function fl(w,t,c){if(B&&B.fl)B.fl.push({w,t,c:c||''})}
function monsterTurn(blk){
  const m=B.mon,p=pStats();
  m.shield=false;
  if(B.stun>0){B.stun--;B.log.push({t:m.name+' ist betäubt und setzt aus.',c:'good'});fl('m','Betäubt','blk');return}
  const key=m.int,it=INT[key];m.last=key;
  if(key==='charge'){m.nextF='smash';B.log.push({t:m.name+' sammelt Kraft für einen Vernichtungsschlag!',c:'took'});fl('m','!','warn');return}
  if(key==='brace'){m.shield=true;B.log.push({t:m.name+' geht in Abwehr. Dein nächster Angriff verliert 60 %.',c:''});fl('m','Abwehr','blk');return}
  if(key==='heal'){const h=Math.round(m.max*.12);m.hp=Math.min(m.max,m.hp+h);B.log.push({t:m.name+' erholt sich: +'+h+' LP.',c:''});fl('m','+'+h,'heal');return}
  const n=it.k||1;let landed=false;
  for(let i=0;i<n&&B.p.hp>0;i++){
    if(B.dodge){B.dodge=false;B.log.push({t:'Du weichst '+m.name+' aus.',c:'good'});fl('p','Ausweichen','blk');continue}
    if(!blk&&Math.random()<p.dodge){B.log.push({t:'Du weichst '+m.name+' aus.',c:'good'});fl('p','Ausweichen','blk');continue}
    let dmg=Math.max(1,Math.round(m.atk*it.m*(m.rage?1.2:1)*rnd(.85,1.15)-p.def));
    if(blk)dmg=Math.max(1,Math.round(dmg*(key==='spell'?.6:.35)));
    let note='';
    if(B.ward<1){dmg=Math.max(1,Math.round(dmg*B.ward));B.ward=1;note=' (Schutz)'}
    B.p.hp=Math.max(0,B.p.hp-dmg);B.pain=true;landed=true;
    const heavy=it.m>=1.8;
    B.log.push({t:m.name+(heavy?' schlägt hart zu: ':' trifft dich für ')+dmg+(blk?' (gedeckt)':'')+note+'.',c:'took'});
    fl('p','−'+dmg,heavy?'crit':'');
    vib(heavy?[70,30,70]:45);sfx('hurt');
  }
  if(landed&&B.p.hp>0){
    if(key==='bite'&&!B.pois){B.pois={t:3,d:Math.max(1,Math.round(m.atk*.22))};B.log.push({t:'Du bist vergiftet.',c:'took'})}
    if(key==='steal'){const e=Math.min(S.en||0,10);if(e>0){addEn(-e);B.log.push({t:m.name+' raubt dir '+e+' Energie.',c:'took'})}}
  }
}

function hitMon(dmg,txt,o){

    if(B.mon.trait==='armor'&&o.armor!==false){f*=.65;tag=' (Panzer)'}

function playerHit(mulT,txt,pierce){

function shadowAct(id){
  const u=B.sh.find(x=>x.id===id),s=S.shadows.find(x=>x.id===id);

  const P=sPow(s),m=B.mon,mt=m.shadow;

  tm*=(1+(cfx().shp||0))*(B.boost||1);
  const ra=rnd(.9,1.1),adv=tm>1?' (Typ-Vorteil!)':'';
  u.cd=shCd(s.t);

  else if(s.t==='beweglichkeit')hitMon(dAtk()*(0.4+0.08*P)*1.8*ra*tm,s.name+' sticht zu:'+adv,{sh:1,pierce:1,crit:1});
  else if(s.t==='geist'){
    const h=Math.round(B.p.max*Math.min(.3,.05+.015*P));B.p.hp=Math.min(B.p.max,B.p.hp+h);B.pois=null;
    B.log.push({t:s.name+' heilt dich: +'+h+' LP.',c:'good'});fl('p','+'+h,'heal');vib(14);sfx('heal');
    hitMon(dAtk()*(0.25+0.05*P)*ra*tm,s.name+' verbrennt:'+adv,{sh:1,pierce:1});
  }else if(s.t==='ausdauer'){
    const red=Math.min(.8,.3+.04*P);B.ward=Math.min(B.ward,1-red);
    B.log.push({t:s.name+' schützt dich: Der nächste Treffer wird um '+Math.round(red*100)+' % gemindert.',c:'good'});fl('p','Schutz','blk');vib(14);sfx('heal');
  }else if(s.t==='disziplin'){
    B.stun=Math.max(B.stun,1);

  }
  return true;

function battleAct(a){

  if(a==='atk'){playerHit(1,'Du schlägst zu:');addEn(4)}
  else if(a==='guard'){blk=true;addEn(6);B.log.push({t:'Du gehst in Deckung.',c:'good'});fl('p','Deckung','blk')}
  else if(a==='potion'){
    if(S.potions<1)return;
    S.potions--;const h=Math.round(B.p.max*0.4);B.p.hp=Math.min(B.p.max,B.p.hp+h);B.pois=null;
    B.log.push({t:'Trank getrunken: +'+h+' Lebenspunkte.',c:'good'});fl('p','+'+h,'heal');vib(14);sfx('heal');
  }else if(a.startsWith('sh:')){
    if(!shadowAct(a.slice(3)))return;
  }else if(a==='cls'){
    const sp=cfx().sp;
    if(!sp||B.cc>0||(S.en||0)<sp.mp||(sp.id==='cmd'&&!B.sh.some(u=>u.cd<=0)))return;
    addEn(-sp.mp);B.cc=sp.cd;
    const heal=f=>{const h=Math.round(B.p.max*f);B.p.hp=Math.min(B.p.max,B.p.hp+h);B.pois=null;B.log.push({t:sp.n+': +'+h+' Lebenspunkte.',c:'good'});fl('p','+'+h,'heal');vib(14);sfx('heal')};
    if(sp.id==='cry'){playerHit(2.2,sp.n+':');B.ward=Math.min(B.ward,.7)}
    else if(sp.id==='breath'){heal(.25);addEn(6)}
    else if(sp.id==='shstep'){playerHit(1.3,sp.n+':',true);B.dodge=true}
    else if(sp.id==='arc')playerHit(2.8,sp.n+':',true);
    else if(sp.id==='wall'){B.ward=Math.min(B.ward,.3);heal(.1);playerHit(1,sp.n+':')}
    else if(sp.id==='kill')hitMon(dAtk()*1.7*rnd(.85,1.15)*1.8,sp.n+':',{crit:true,pierce:true});
    else if(sp.id==='holy'){heal(.25);playerHit(1.2,sp.n+':',true)}
    else if(sp.id==='rage'){playerHit(3.4,sp.n+':');const l=Math.round(B.p.max*.12);B.p.hp=Math.max(1,B.p.hp-l);B.log.push({t:'Die Raserei kostet dich '+l+' LP.',c:'took'});fl('p','−'+l,'sh')}
    else if(sp.id==='cmd'){B.boost=1.5;B.sh.forEach(u=>{if(B.mon.hp>0&&u.cd<=0){shadowAct(u.id);u.cd=Math.max(1,u.cd-1)}});B.boost=1}
  }else if(a.startsWith('skill:')){
    const k=SKILLS.find(x=>x.id===a.slice(6));
    if(!k||S.level<k.lv||(S.en||0)<skMp(k))return;
    addEn(-skMp(k));
    if(k.id==='heavy')playerHit(1.8,k.name+':');
    else if(k.id==='step'){playerHit(1.2,k.name+':');B.dodge=true}
    else if(k.id==='heal'){const h=Math.round(B.p.max*0.3);B.p.hp=Math.min(B.p.max,B.p.hp+h);B.pois=null;B.log.push({t:k.name+': +'+h+' Lebenspunkte.',c:'good'});fl('p','+'+h,'heal');vib(14);sfx('heal')}
    else if(k.id==='blade')playerHit(3,k.name+':',true);
    else if(k.id==='aura'){playerHit(2,k.name+':',true);B.stun=1}
  }else return;
  if(B.mon.hp<=0){endFight(true);return}
  const m=B.mon;
  if(B.k==='boss'&&!m.rage&&m.hp<m.max*.5){m.rage=true;B.log.push({t:m.name+' gerät in Rage! Er schlägt härter zu.',c:'took'});fl('m','Rage','warn');if(m.int!=='smash'&&m.int!=='charge'&&!m.nextF)m.int=rollInt(m)}

/* ----- Schatten: Fusion + Expeditionen ----- */
const FUSE_N=3,EXP_H=[4,8];
function fuseGroups(){
  const busy=new Set((S.exp||[]).map(e=>e.id)),g={};
  S.shadows.forEach(s=>{if(busy.has(s.id)||s.r>=3)return;const k=s.t+'|'+s.r;(g[k]=g[k]||[]).push(s)});
  return Object.keys(g).filter(k=>g[k].length>=FUSE_N).map(k=>({k,t:k.split('|')[0],r:+k.split('|')[1],n:g[k].length,list:g[k]}));
}
function doFuse(k){
  const grp=fuseGroups().find(x=>x.k===k);if(!grp)return null;
  const tm=new Set(S.team||[]);
  const pick=grp.list.slice().sort((a,b)=>(tm.has(a.id)-tm.has(b.id))||a.lv-b.lv||(a.xp||0)-(b.xp||0)).slice(0,FUSE_N);
  const ids=new Set(pick.map(s=>s.id)),best=Math.max(...pick.map(s=>s.lv));
  S.shadows=S.shadows.filter(s=>!ids.has(s.id));
  S.team=(S.team||[]).filter(id=>!ids.has(id));
  const ns=mkShadow(grp.t,0);ns.r=grp.r+1;ns.lv=Math.max(1,Math.floor(best/2));ns.xp=0;
  addShadow(ns);save();
  extractModal(ns,'Verschmelzung','Drei '+STYPE[grp.t].n+'-Schatten ('+SRAR[grp.r].n+') wurden zu einem '+SRAR[ns.r].n+'-Schatten.');
  return ns;
}
function fuseSection(){
  const gs=fuseGroups();
  if(!gs.length)return '';
  return '<section id="fuse" class="win vio"><div class="sub"><div><div class="lbl" style="color:var(--violet)">Fusion</div><h2>Verschmelzen</h2></div></div><p class="dim" style="font-size:13px;margin-bottom:8px">Drei Schatten gleichen Typs und gleicher Seltenheit werden zu einem Schatten der nächsten Seltenheit. Die schwächsten werden verbraucht.</p>'+
   gs.map(g=>'<div class="item"><span class="nm">'+g.n+' × '+STYPE[g.t].n+' '+SRAR[g.r].n+'</span><span class="chip">→ '+SRAR[g.r+1].n+'</span><button class="btn '+(fuseArm===g.k?'bad':'vio')+' sm" data-act="fuse" data-id="'+g.k+'">'+(fuseArm===g.k?'Sicher?':'Verschmelzen')+'</button></div>').join('')+'</section>';
}
const expSlots=()=>Math.min(3,1+Math.floor((S.shadows||[]).length/6));
const expLeft=e=>Math.max(0,e.t0+e.h*3600e3-Date.now());
const expReady=()=>(S.exp||[]).some(e=>expLeft(e)<=0&&S.shadows.some(s=>s.id===e.id));
const fmtLeft=ms=>{const m=Math.ceil(ms/60000),h=Math.floor(m/60);return (h?h+' Std. ':'')+(m%60)+' Min.'};
function expStart(sid,h){
  if(!Array.isArray(S.exp))S.exp=[];
  if(S.exp.length>=expSlots()||S.exp.some(e=>e.id===sid)||!EXP_H.includes(h))return false;
  if(!S.shadows.some(x=>x.id===sid))return false;
  S.exp.push({id:sid,t0:Date.now(),h});
  S.team=(S.team||[]).filter(id=>id!==sid);
  return true;
}
function expCollect(sid){
  const i=(S.exp||[]).findIndex(e=>e.id===sid);if(i<0)return false;
  const e=S.exp[i];if(expLeft(e)>0)return false;
  S.exp.splice(i,1);
  const s=S.shadows.find(x=>x.id===sid);if(!s)return false;
  const f=e.h/4,g=Math.round((14+s.r*10+s.lv*1.2)*f),xp=Math.round(e.h*12);
  S.gold+=g;
  let t='+'+g+' G und '+xp+' Erfahrung für '+s.name;
  const l0=s.lv;s.xp=(s.xp||0)+xp;
  while(s.lv<SMAXLV&&s.xp>=sNeed(s.lv)){s.xp-=sNeed(s.lv);s.lv++}
  if(s.lv>=SMAXLV)s.xp=0;
  if(s.lv>l0)t+=' (jetzt Level '+s.lv+')';
  if(Math.random()<0.22*f){S.potions++;t+=', dazu 1 Trank'}
  if(Math.random()<0.05*f){S.keys++;t+=', dazu 1 Schlüssel'}
  save();
  modal({title:'Expedition beendet',body:'<p>'+esc(s.name)+' ist zurück.</p><p style="color:var(--ok)">'+esc(t)+'.</p>',btn:'Gut'});
  return true;
}
function expSection(){
  const slots=expSlots(),ex=(S.exp||[]).filter(e=>S.shadows.some(s=>s.id===e.id)),busy=new Set(ex.map(e=>e.id)),tm=new Set(S.team||[]);
  const free=S.shadows.filter(s=>!busy.has(s.id)&&!tm.has(s.id)).sort((a,b)=>b.r-a.r||b.lv-a.lv);
  let h='<section id="exp" class="win"><div class="sub"><div><div class="lbl">Expeditionen</div><h2>'+ex.length+' / '+slots+' unterwegs</h2></div></div>'+
   '<p class="dim" style="font-size:13px;margin-bottom:8px">Schicke Schatten aus der Reserve los. Sie bringen Gold und Erfahrung, manchmal auch einen Trank oder Schlüssel. Weitere Plätze ab 6 und 12 Schatten.</p>';
  h+=ex.map(e=>{const s=S.shadows.find(x=>x.id===e.id),left=expLeft(e);return '<div class="item"><span class="nm">'+esc(s.name)+' <span class="dim">'+STYPE[s.t].n+'</span></span><span class="chip'+(left>0?'':' sys')+'">'+(left>0?'noch '+fmtLeft(left):'zurück')+'</span>'+(left>0?'':'<button class="btn ok sm" data-act="exp-get" data-id="'+s.id+'">Abholen</button>')+'</div>'}).join('');
  if(ex.length<slots){
    h+=free.length?'<div class="acts" style="margin-top:10px"><select id="expSh" aria-label="Schatten wählen" style="flex:1 1 150px">'+free.map(s=>'<option value="'+s.id+'">'+esc(s.name)+' · '+SRAR[s.r].n+' Lv '+s.lv+'</option>').join('')+'</select>'+EXP_H.map(x=>'<button class="btn sm" data-act="exp-go" data-id="'+x+'">'+x+' Std.</button>').join('')+'</div>'
      :'<div class="empty" style="margin-top:8px">Alle Schatten sind im Team oder unterwegs. Nur Schatten außerhalb des Teams können losziehen.</div>';
  }
  return h+'</section>';
}
function shBtn(s,ids){
  if((S.exp||[]).some(e=>e.id===s.id))return '<button class="btn ghost sm" disabled>Unterwegs</button>';
  return '<button class="btn '+(ids.has(s.id)?'ghost':'ok')+' sm" data-act="sh-team" data-id="'+s.id+'">'+(ids.has(s.id)?'Im Team':'Ins Team')+'</button>';
}

function dlStep(){

  [fa,fd].forEach(f=>{if(f)f.classList.remove('atk1','atk2','hit')});

  const fx=document.getElementById('dlfx');

  else{

let chal=[],chalLoaded=false,chalErr='',chalSeen=null,chBusy=false;
const CH_DAY=864e5,CH_WIN=3*CH_DAY,CH_REW=25,CH_DRAW=10,CH_STAKES=[0,10,25,50];
const chDone=()=>{if(!S.chDone||typeof S.chDone!=='object')S.chDone={};return S.chDone};
function chParse(k,v){
  const r=recOf(k);if(!r)return null;
  v=Number(String(v).replace(',','.'));if(!(v>0))return null;
  v=r.dec?Math.round(Math.min(r.max,v)*10)/10:Math.min(r.max,Math.round(v));
  return v>0?v:null;
}
/* Zustand einer Herausforderung, aus Sicht des Betrachters */
function chInfo(c){
  const now=Date.now(),cr=Date.parse(c.created_at)||now,ac=c.accepted_at?Date.parse(c.accepted_at):0;
  const me=c.from_id===myId?'from':'to';
  const myV=me==='from'?c.fv:c.tv,oV=me==='from'?c.tv:c.fv;
  let st=c.status,win=null,left=0;
  if(st==='open'){left=cr+CH_WIN-now;if(left<=0)st='expired'}
  if(st==='active'){
    left=ac+CH_WIN-now;
    if(c.fv!=null&&c.tv!=null)st='done';
    else if(left<=0)st=(c.fv!=null||c.tv!=null)?'done':'void';
  }
  if(st==='done'){
    if(c.fv!=null&&c.tv!=null)win=c.fv>c.tv?'from':c.tv>c.fv?'to':'draw';
    else win=c.fv!=null?'from':'to';
  }
  return {st,win,me,myV:myV==null?null:Number(myV),oV:oV==null?null:Number(oV),left,other:me==='from'?c.to_name:c.from_name,forfeit:st==='done'&&(c.fv==null||c.tv==null)};
}
const chClaimed=(c,i)=>!!(chDone()[c.id]||(i.me==='from'?c.fclaim:c.tclaim));
function chNeedsAck(c,i){
  if(chClaimed(c,i))return false;
  if(i.st==='done'||i.st==='void')return true;
  if((i.st==='declined'||i.st==='expired')&&i.me==='from')return true;
  return false;
}
function chAttention(){
  if(!online||!chalLoaded)return false;
  return chal.some(c=>{
    const i=chInfo(c);
    if(i.st==='open')return i.me==='to';
    if(i.st==='active')return i.myV==null;
    return chNeedsAck(c,i);
  });
}

const chLeft=ms=>{const h=Math.max(1,Math.ceil(ms/36e5)),d=Math.floor(h/24);return d?d+' Tg. '+(h%24)+' Std.':h+' Std.'};
function chalHtml(){

    }else if(i.st==='open'){

      else row('Duell mit '+nm,what+' · dein Ergebnis: '+fmtRec(r,i.myV)+' '+esc(r.u)+(i.oV==null?'. Warte auf '+nm+' (noch '+chLeft(i.left)+').':''),'');
    }else if(chNeedsAck(c,i)){
      let t='',sub='',btn='OK',cls='';
      if(i.st==='done'){
        const v=fmtRec(r,i.myV==null?0:i.myV)+' : '+fmtRec(r,i.oV==null?0:i.oV);
        if(i.win==='draw'){t='Unentschieden gegen '+nm;sub=what+' · '+v;btn='+'+CH_DRAW+' G holen'}
        else if(i.win===i.me){t='Du hast gegen '+nm+' gewonnen';sub=what+(i.forfeit?' · kampflos, '+nm+' hat nichts eingetragen':' · '+v);btn='+'+(CH_REW+c.stake)+' G holen';cls=' cwin'}
        else{t='Du hast gegen '+nm+' verloren';sub=what+(i.forfeit?' · du hast nichts eingetragen':' · '+v)+(c.stake?' · −'+c.stake+' G':'');cls=' closs'}
      }else if(i.st==='void'){t='Duell mit '+nm+' verfallen';sub=what+' · niemand hat ein Ergebnis eingetragen'}
      else if(i.st==='declined'){t=nm+' hat abgelehnt';sub=what}
      else{t=nm+' hat nicht reagiert';sub=what}
      row(t,sub,'<button class="btn ok sm" data-act="ch-claim" data-id="'+esc(c.id)+'">'+btn+'</button>',cls);
    }
  });
  if(!rows.length)return '';
  return '<section id="chal-zone" class="win vio"><div class="sub"><div><div class="lbl" style="color:var(--violet)">Freunde</div><h2>Herausforderungen</h2></div></div>'+rows.join('')+'</section>';

function authErr(e){
  const m=String((e&&(e.message||e.code))||e||'');
  if(/Invalid login/i.test(m))return 'E-Mail oder Passwort stimmt nicht.';
  if(/already registered|already been registered/i.test(m))return 'Diese E-Mail hat schon ein Konto. Nutze Anmelden.';
  if(/at least 6|weak/i.test(m))return 'Das Passwort ist zu schwach (mindestens 6 Zeichen).';
  if(/not confirmed/i.test(m))return 'Die E-Mail ist noch nicht bestätigt. Prüfe dein Postfach.';
  if(/rate limit|too many|seconds/i.test(m))return 'Zu viele Versuche. Warte kurz und versuche es erneut.';
  if(/invalid/i.test(m)&&/email/i.test(m))return 'Diese E-Mail-Adresse wird nicht akzeptiert.';
  return m.slice(0,160);
}

async function authAct(kind){

  try{
    if(kind==='local'){authDone(null);return}
    if(kind==='guest'){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;authDone({session:r.data.session,replaceLocal:false});return}
    const email=((document.getElementById('authMail')||{}).value||'').trim(),password=(document.getElementById('authPw')||{}).value||'';
    if(!/^\S+@\S+\.\S+$/.test(email)){msg('Bitte eine gültige E-Mail eintragen.');return}
    if(kind==='reset'){
      msg('Einen Moment ...');
      const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      if(r.error)throw r.error;
      msg('Wir haben dir einen Link geschickt. Öffne ihn auf diesem Gerät, dann kannst du ein neues Passwort wählen.');
      return;
    }
    if(password.length<6){msg('Das Passwort braucht mindestens 6 Zeichen.');return}
    msg('Einen Moment ...');
    if(kind==='login'){
      const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;
      authDone({session:r.data.session,replaceLocal:true});
    }else{
      const r=await sb.auth.signUp({email,password});if(r.error)throw r.error;
      if(r.data&&r.data.session)authDone({session:r.data.session,replaceLocal:false});
      else msg('Bestätigungs-Mail gesendet. Bestätige sie und melde dich dann an.');
    }
  }catch(e){msg(authErr(e))}

  S.xp+=n;
  let bon=0;
  while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;if(S.level%2===0)bon++;ups++}
  if(bon)STATS.forEach(([k])=>{S.stats[k]+=bon});
  if(ups){
    const r1=rankOf(S.level);
    const unlocked=SKILLS.filter(k=>k.lv<=S.level&&k.lv>S.level-ups);

function completeQuest(q){
  if(q.done)return;
  q.done=true;q.cur=q.target;
  const c=capState();let gx=q.xp,gg=q.gold,capWhy=null;
  if(q.type==='dungeon'){if(c.dg>=1){gx=0;gg=0}else c.dg++}
  else if(q.type==='weekly'||q.type==='boss'||q.type==='gym'){}
  else{
    let room=Math.max(0,dayCap()-c.xp);
    if(q.type==='daily'&&q.stat){const us=(c.sx&&c.sx[q.stat])||0,sr=Math.max(0,statCap()-us);if(sr<room){room=sr;capWhy=q.stat}}
    if(gx>room){gg=Math.round(gg*room/Math.max(1,gx));gx=room}
    c.xp+=gx;
    if(q.type==='daily'&&q.stat){if(!c.sx)c.sx={};c.sx[q.stat]=(c.sx[q.stat]||0)+gx}
  }
  if(gx>0){
    S.gold+=gg;S.totalDone++;if(!S.cnt)S.cnt={};S.cnt[q.type]=(S.cnt[q.type]||0)+1;
    const cm=clsXpMul(q.stat);if(cm>1)gx=Math.round(gx*cm);
    skillGain(q.stat,gx,cm);
    const eg=Math.round(6+gx/8);addEn(eg);
    toast('Quest abgeschlossen: +'+gx+' XP, +'+gg+' G, +'+eg+' Energie'+(gx<q.xp?' (Tageslimit)':''));
    grantXP(gx);
    const kc=q.type==='dungeon'||q.type==='weekly'||q.type==='boss'?1:q.type==='gym'?0.35:q.type==='system'?0.4:0.15;
    if(Math.random()<kc)giveKey(q.type==='dungeon'?'Dungeon':'');
    shadowXp(Math.max(1,Math.round(gx/10)),q.stat);
    if(S.totalDone%SHADOW_EVERY===0){
      const ty=STAT2T[q.stat]||STK[Math.floor(Math.random()*5)],sh=mkShadow(ty,rankIdx(S.level));
      addShadow(sh);
      extractModal(sh,'Extraktion','Aus deinen Quests ist ein neuer Schatten entstanden, '+STYPE[ty].n+'-Typ.');
    }
  }else toast(q.type==='dungeon'?'Heute war schon ein Dungeon dran: keine Belohnung mehr.':capWhy?'Tageslimit für '+statName(capWhy)+' erreicht. Trainiere auch andere Fähigkeiten.':'Tageslimit erreicht: Diese Quest bringt heute keine Belohnung mehr.');
  if(q.type==='daily'){
    const d=dailyOn();
    if(d.length&&d.every(x=>x.done)&&S.lastComplete!==dayKey()){
      const y=prevActive();
      S.streak=(S.lastComplete===y)?S.streak+1:1;
      const p0=prestigeOf();S.lastComplete=dayKey();S.bestStreak=Math.max(S.bestStreak,S.streak);if(prestigeOf()>p0){const pz=PRESTIGE[prestigeOf()-1];modal({kind:'vio',title:'Prestige',body:sealFx(prestigeOf())+'<div class="big stars">'+'★'.repeat(prestigeOf())+'</div><p>'+pz.n+'-Siegel: '+pz.d+' Tage Serie am Stück</p><p class="dim">Es steht jetzt neben deinem Namen, auch für deine Freunde.</p>',btn:'Stolz tragen'})}spCheck();
      const bx=Math.min(100,30+S.streak*5),bg=20;
      S.gold+=bg;S.keys++;addEn(20);
      modal({pic:'daily',title:'Tagesquest geschafft',body:'<div class="big">'+S.streak+' 🔥</div><p>Serie: '+S.streak+' Tag'+(S.streak>1?'e':'')+' in Folge</p><p>Bonus: +'+bx+' XP, +'+bg+' G und ein Schlüssel</p>',btn:'Weiter'});
      grantXP(bx);
    }
  }
}

function genSys(){
  const tq=pickTest();if(tq)return tq;
  const lv=S.level,P=S.prof||null,lim=(P&&P.limits)||[],bar=!P||P.place==='gym'||(P.equip||[]).includes('bar');
  const ok=SYS_T.filter(t=>!(t.x||[]).some(x=>lim.includes(x))&&(!t.bar||bar)&&t.n!==S.sysLast);
  const weakest=STATS.map(s=>s[0]).sort((a,b)=>S.stats[a]-S.stats[b])[0];
  const gs=P&&P.goals?P.goals.map(g=>GSTAT[g]).filter(Boolean):[];
  const r=Math.random();
  const st=r<0.4?weakest:(r<0.8&&gs.length?gs[Math.floor(Math.random()*gs.length)]:null);
  let pool=st?ok.filter(t=>t.s===st):ok;
  if(!pool.length)pool=ok;if(!pool.length)pool=SYS_T;
  const t=pool[Math.floor(Math.random()*pool.length)];
  const lm=P?({anf:.85,mid:1,adv:1.2})[P.level]||1:1;
  const target=t.b===1?1:Math.max(1,Math.round(t.b*lm*(1+lv*0.03)));
  S.sysLast=t.n;
  return {n:t.n,u:t.u,s:t.s,target,xp:35+Math.round(lv*1.5),gold:20,weak:t.s===weakest};
}

/* ---------- v23h: Quests vom System ---------- */
function autoDaily(){
  const P=S.prof||{goals:['alltag'],place:'home',equip:[],level:'anf',time:30,limits:[]};
  const lim=P.limits||[],bar=P.place==='gym'||(P.equip||[]).includes('bar');
  const n=Math.min(QUEST_MAX,({15:3,30:4,45:5,60:6})[P.time]||4);
  const gs=(P.goals&&P.goals.length?P.goals:['alltag']).map(g=>GSTAT[g]).filter(Boolean);
  const last=new Set(S.autoLast||[]);
  const ok=SYS_T.filter(t=>!(t.x||[]).some(x=>lim.includes(x))&&(!t.bar||bar));
  const out=[],used=new Set();
  const take=st=>{
    let pool=ok.filter(t=>!used.has(t.n)&&(!st||t.s===st));
    const fresh=pool.filter(t=>!last.has(t.n));if(fresh.length)pool=fresh;
    if(!pool.length)return false;
    const t=pool[Math.floor(Math.random()*pool.length)];used.add(t.n);out.push(t);return true;
  };
  const cyc=gs.length?gs:STATS.map(x=>x[0]);
  for(let i=0;out.length<n-1&&i<n*4;i++)take(cyc[i%cyc.length])||take(null);
  const have=new Set(out.map(t=>t.s)),weak=STATS.map(x=>x[0]).sort((a,b)=>S.stats[a]-S.stats[b]);
  take(weak.find(k=>!have.has(k))||weak[0])||take(null);
  while(out.length<n&&take(null));
  const lm=({anf:.85,mid:1,adv:1.2})[P.level]||1,g=Math.min(1.8,1+S.level*.02);
  const qs=out.map(t=>{
    let tg=1;
    if(t.b>1){
      const r=REC.find(x=>x.re.test(t.n)),rv=r&&S.pr&&S.pr[r.k]&&S.pr[r.k].v;
      tg=rv>0?recTarget(r.k,rv):Math.max(1,nice(t.b*lm*g*rnd(.9,1.12)));
    }
    return mkQ(t.n,tg,t.u,t.s);
  });
  S.autoLast=out.map(t=>t.n);
  return qs;
}

function rollover(){
  const t=dayKey();
  if(S.lastDay===t)return;
  if(S.lastDay){
    const diff=dayNum(t)-dayNum(S.lastDay);
    const dAll=S.quests.filter(q=>q.type==='daily'),dailies=dailyOn(S.lastDay);
    recordDay(S.lastDay);
    for(let i=1;i<Math.min(diff,8);i++){const kk=addDays(S.lastDay,i),nn=dailyOn(kk).length;if(nn)S.hist[kk]={d:0,t:nn}}
    let failed=0,shielded=0;
    if(dAll.length){
      const miss=[];
      if(dailies.length&&dailies.some(q=>!q.done))miss.push(S.lastDay);
      for(let i=1;i<=Math.min(Math.max(diff-1,0),2);i++){const kk=addDays(S.lastDay,i);if(dailyOn(kk).length)miss.push(kk)}
      miss.forEach(k=>{if(protectedMiss(k))shielded++;else failed++});
    }
    if(!S.cnt)S.cnt={};
    {
      const w0=addDays(S.lastDay,-wdOf(S.lastDay)),w1=addDays(w0,6);
      if(t>w1&&trainDays()>0&&(S.tlog||[]).filter(e=>e.d>=w0&&e.d<=w1).length>=trainDays())S.cnt.pw=(S.cnt.pw||0)+1;
    }
    let amulet=0;
    if(failed>0&&S.items&&S.items.shield>0){amulet=Math.min(failed,S.items.shield);S.items.shield-=amulet;failed-=amulet}
    if(amulet>0)modal({kind:'vio',title:'Straf-Schild',body:'<p>Dein Straf-Schild hat '+(amulet>1?amulet+' Strafen':'die Strafe')+' abgefangen. Es ist verbraucht.</p><p class="dim">Noch '+S.items.shield+' Schild'+(S.items.shield===1?'':'e')+' übrig.</p>',btn:'Weiter'});
    if(failed===0&&(shielded>0||amulet>0)&&diff-1<=2){
      const keepS=S.streak>0;
      S.lastComplete=addDays(t,-1);
      if(keepS&&shielded>0){
        S.cnt.shield=(S.cnt.shield||0)+shielded;
        modal({kind:'vio',title:'Serie geschützt',body:'<p>Dein Ruhetag war geplant. Deine Serie von <b>'+S.streak+'</b> Tag'+(S.streak>1?'en':'')+' bleibt bestehen.</p><p class="dim">Pro Woche schützen höchstens 2 Ruhetage deine Serie.</p>',btn:'Weiter'});
      }
    }
    if(failed>0){
      const pd=dailies.length?dailies:dAll,sx=pd.reduce((a,q)=>a+q.xp,0),sg=pd.reduce((a,q)=>a+q.gold,0);
      const lx=Math.min(S.xp,Math.round(sx*0.75*failed)),lg=Math.min(S.gold,Math.round(sg*0.4*failed));
      S.xp-=lx;S.gold-=lg;S.streak=0;
      const ptx=[];for(let i=0;i<failed;i++){const tx=genPenalty();ptx.push(tx);S.penalties.push({id:uid(),text:tx})}
      modal({kind:'bad',title:'Strafe',body:'<p>Die täglichen Quests wurden nicht abgeschlossen.</p><p style="color:var(--bad);font-family:var(--f-d);font-size:20px">−'+lx+' XP, −'+lg+' G</p><p>Strafquest'+(failed>1?'s':'')+':<br>'+ptx.map(esc).join('<br>')+'</p><p class="dim">Die Serie ist zurückgesetzt. Leiste die Strafe ab oder streiche sie mit einem Strafen-Erlass aus dem Shop.</p>',btn:'Verstanden'});
    }
    const keys=Object.keys(S.hist).sort();
    while(keys.length>150)delete S.hist[keys.shift()];
  }
  if(S.auto)S.quests=autoDaily().concat(S.quests.filter(q=>q.type!=='daily'));
  S.quests=S.quests.filter(q=>q.type!=='system'&&q.type!=='plan'&&q.type!=='gym');
  S.quests.forEach(q=>{if(q.type==='daily'){q.cur=0;q.done=false}});
  if(S.ses&&(S.ses.day!==t||Date.now()-S.ses.t0>10*3600e3)){S.ses=null;sesOn=false;sesRender()}
  syncTraining();
  S.sys={day:t,q:genSys(),st:'open'};
  ensureLive();
  S.lastDay=t;spCheck();save();
}

function fighter(c,m,opp){

  return {name:c.name,max:hp,hp:hp,atk:(4+st.str*0.9+c.gw+c.sh*1.5)*m*sn.atk*bo,def:(st.vit*0.25+c.ga)*sn.def,dodge:Math.min(.35,st.agi*.004),crit:Math.min(.4,st.dis*.005),agi:st.agi,bo};
}
function cleanCard(c){

  return {name:String(c.name||'Hunter').slice(0,30),level:clampN(c.level,1,999,1),rank:RANKS.includes(c.rank)?c.rank:'E',stats:st,cons:clampN(c.cons,0,100,50),days:clampN(c.days,0,30,0),
    gw:0,ga:0,sh:clampN(c.sh,0,999,0),thumb:typeof c.thumb==='string'&&c.thumb.startsWith('data:image/')&&c.thumb.length<20000?c.thumb:null,cls:String(c.cls||'').slice(0,40),ti:(ACH.some(a=>a[4]===c.ti)?String(c.ti):''),au:null,sp:clampN(c.sp,0,2,0),pr:clampN(c.pr,0,PRESTIGE.length,0),fc:String(c.fc||'').replace(/[^A-Za-z0-9]/g,'').slice(0,8),fl:Array.isArray(c.fl)?c.fl.slice(0,100).map(x=>String(x).slice(0,40)):[],
    stn:STN[c.stn]?c.stn:'b',
    ac:Array.isArray(c.ac)?c.ac.filter(id=>ACH.some(a=>a[0]===id)).slice(0,60):[],
    tm:Array.isArray(c.tm)?c.tm.slice(0,3).map(x=>({n:String(x&&x.n||'Schatten').slice(0,20),t:STK.includes(x&&x.t)?x.t:'kraft',r:clampN(x&&x.r,0,3,0),l:clampN(x&&x.l,1,SMAXLV,1)})):[],
    rc:(()=>{const o={};if(c.rc&&typeof c.rc==='object')REC.forEach(r=>{const v=Number(c.rc[r.k]);if(v>0&&v<=r.max)o[r.k]=r.dec?Math.round(v*10)/10:Math.round(v)});return o})()};
}

function hash32(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ck(c){const a=[c.name,c.level,c.rank,STATS.map(([k])=>c.stats[k]),c.cons,c.gw,c.ga,c.sh];if(stnOf(c)!=='b')a.push(stnOf(c));return JSON.stringify(a)}
/* deterministic and symmetric: both sides get the same result from the same two cards */
function simulate(c1,c2){
  const sw=ck(c1)>ck(c2),x=sw?c2:c1,y=sw?c1:c2;
  const rng=mulberry32(hash32(ck(x)+'|'+ck(y)));
  const A=fighter(x,mult(x.cons),y),Bf=fighter(y,mult(y.cons),x);
  const f1=sw?Bf:A,f2=sw?A:Bf,ev=[];
  let rounds=0;
  while(A.hp>0&&Bf.hp>0&&rounds<60){
    rounds++;
    const order=(A.agi+rng()*10>=Bf.agi+rng()*10)?[[A,Bf],[Bf,A]]:[[Bf,A],[A,Bf]];
    for(const [a,d] of order){
      if(a.hp<=0||d.hp<=0)continue;
      const side=((a===A)!==sw)?1:2;
      if(rng()<d.dodge){ev.push({r:rounds,s:side,m:1,h1:Math.round(f1.hp),h2:Math.round(f2.hp)});continue}
      let v=Math.max(1,(a.atk-d.def)*(.85+rng()*.3)),cr=0;if(rng()<a.crit){v*=1.8;cr=1}
      d.hp=Math.max(0,d.hp-v);
      ev.push({r:rounds,s:side,d:Math.round(v),c:cr,h1:Math.round(f1.hp),h2:Math.round(f2.hp)});
    }
  }
  const firstWins=A.hp>Bf.hp||(A.hp===Bf.hp&&rng()<.5);
  const win=sw?!firstWins:firstWins;
  return {win,rounds,hp1:Math.round(f1.hp/f1.max*100),hp2:Math.round(f2.hp/f2.max*100),m1:mult(c1.cons),m2:mult(c2.cons),ev,mx1:f1.max,mx2:f2.max,b1:f1.bo,b2:f2.bo};
}
function encodeCode(c){
  const o={n:c.name,l:c.level,r:c.rank,s:STATS.map(([k])=>c.stats[k]),c:c.cons,d:c.days,w:c.gw,a:c.ga,h:c.sh,z:stnOf(c)==='b'?undefined:stnOf(c)};
  return 'HUNTER1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function decodeCode(t){
  try{
    t=String(t).trim();if(!t.startsWith('HUNTER1:'))return null;
    const o=JSON.parse(decodeURIComponent(escape(atob(t.slice(8)))));
    const st={};STATS.forEach(([k],i)=>{st[k]=o.s[i]});
    return cleanCard({name:o.n,level:o.l,rank:o.r,stats:st,cons:o.c,days:o.d,gw:o.w,ga:o.a,sh:o.h,stn:o.z});
  }catch(e){return null}
}

function radar(){
  const vals=STATS.map(([k])=>S.stats[k]),mx=Math.max(30,...vals)*1.1,cx=150,cy=118,R=88;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/5;return [cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v]};
  const poly=f=>STATS.map((_,i)=>pt(i,f).map(x=>x.toFixed(1)).join(',')).join(' ');
  let g=[.34,.67,1].map(f=>'<polygon class="ring" points="'+poly(f)+'"/>').join('');
  g+=STATS.map((_,i)=>{const p=pt(i,1);return '<line class="ax" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>'}).join('');
  const shape=STATS.map(([k],i)=>pt(i,S.stats[k]/mx).map(x=>x.toFixed(1)).join(',')).join(' ');
  const lab=STATS.map(([k,l],i)=>{const p=pt(i,1.3);return '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'">'+l+' '+S.stats[k]+'</text>'}).join('');
  return '<svg class="radar" viewBox="0 0 300 236" role="img" aria-label="Werte-Diagramm">'+g+'<polygon class="shape" points="'+shape+'"/>'+lab+'</svg>';
}

function viewKalender(){
  const c=consistency(),today=dayKey();
  const dow=(new Date().getDay()+6)%7;
  const start=addDays(today,-(dow+77));
  const live=(()=>{const d=dailyOn();return d.length?{d:d.filter(q=>q.done).length,t:d.length}:null})();
  let cells='';
  for(let i=0;i<84;i++){
    const k=addDays(start,i);
    if(dayNum(k)>dayNum(today)){cells+='<i class="fu"></i>';continue}
    const h=k===today?live:S.hist[k];
    let cl='';
    if(h&&h.t>0){const r=h.d/h.t;cl=r>=1?'c3':r>=0.67?'c2':r>0?'c1':'c0'}
    cells+='<i class="'+cl+(k===today?' today':'')+'" title="'+k+(h?': '+h.d+' von '+h.t:'')+'"></i>';
  }
  const full=Object.values(S.hist).filter(h=>h.t>0&&h.d>=h.t).length;
  return '<section class="win"><div class="sub"><div><div class="lbl">Verlauf</div><h2>Die letzten 12 Wochen</h2></div></div>'+
   '<div class="heat" role="img" aria-label="Kalender der letzten 12 Wochen">'+cells+'</div>'+
   '<div class="legend"><span><i style="background:#2a1220;border:1px solid #ff546855"></i>nichts</span><span><i style="background:#16337a"></i>teilweise</span><span><i style="background:#2a6cd6"></i>fast alles</span><span><i style="background:var(--ok)"></i>alles</span><span>Spalten sind Wochen, Zeilen Mo bis So. Heute ist umrandet.</span></div></section>'+
   '<section class="win"><div class="sub"><div class="lbl">Bilanz</div></div><div class="kv"><div><span class="lbl">Konstanz (30 Tage)</span><span class="num">'+(c.days?c.pct+' %':'–')+'</span></div><div><span class="lbl">Serie</span><span class="num">'+S.streak+'</span></div><div><span class="lbl">Beste Serie</span><span class="num">'+S.bestStreak+'</span></div><div><span class="lbl">Volle Tage</span><span class="num">'+full+'</span></div><div><span class="lbl">Quests gesamt</span><span class="num">'+S.totalDone+'</span></div><div><span class="lbl">Kämpfe gewonnen</span><span class="num">'+S.wins+'</span></div></div></section>';
}

    case 'tp-ex':tpOpenEx=tpOpenEx===id?null:id;break;
    case 'tp-step':{
      const [xid,f,dl]=String(id).split('|'),d=S.tp&&S.tp.days[tpDay],x=d&&d.ex.find(y=>y.id===xid);
      if(!x)break;
      const e=exOf(x.e),dv=Number(dl)||0;
      if(f==='s')x.s=Math.max(1,Math.min(8,x.s+dv));
      else x.r=Math.max(1,Math.min(e.m==='km'?200:(e.m==='min'||e.m==='sec')?600:100,Math.round((x.r+dv)*10)/10));
      syncTraining();save();break;
    }
    case 'tp-mv':{
      const [xid,dl]=String(id).split('|'),d=S.tp&&S.tp.days[tpDay];
      if(!d)break;
      const i=d.ex.findIndex(y=>y.id===xid),j=i+(Number(dl)||0);
      if(i<0||j<0||j>=d.ex.length)break;
      const t=d.ex[i];d.ex[i]=d.ex[j];d.ex[j]=t;save();break;
    }
    case 'tp-del':{
      const d=S.tp&&S.tp.days[tpDay];
      if(!d)break;
      d.ex=d.ex.filter(y=>y.id!==id);if(tpOpenEx===id)tpOpenEx=null;syncTraining();save();break;
    }
    case 'tp-add':pk={mode:'add',id:null,cat:'all',mine:true,q:'',nw:false};pkRender();break;
    case 'tp-rep':{
      const d=S.tp&&S.tp.days[tpDay],x=d&&d.ex.find(y=>y.id===id),e=x&&exOf(x.e);
      pk={mode:'rep',id,cat:e?e.c:'all',mine:true,q:'',nw:false};pkRender();break;
    }
    case 'pk-close':pk=null;pkRender();break;
    case 'pk-cat':if(!pk)return;pk.cat=id;pkRender();return;
    case 'pk-eq':if(!pk)return;pk.mine=!pk.mine;pkRender();return;
    case 'pk-new':if(!pk)return;pk.nw=!pk.nw;pkRender();return;
    case 'pk-pick':if(!pkPick(id))return;break;
    case 'pk-save':{
      if(!pk)return;
      const n=((document.getElementById('pkn')||{}).value||'').trim().slice(0,40);
      if(!n){toast('Gib der Übung einen Namen');return}
      if((S.cx||[]).length>=40){toast('Höchstens 40 eigene Übungen');return}
      const c=(document.getElementById('pkc')||{}).value,m=(document.getElementById('pkm')||{}).value;
      if(!CATN[c]||!MODE[m])return;
      const e={id:'c_'+uid(),n,c,q:'bw',m,s:(m==='kg'||m==='bw'||m==='sec')?3:1,r:({kg:10,bw:12,sec:30,min:10,km:3})[m],t:'i',x:[],cue:'',cx:1};
      if(!Array.isArray(S.cx))S.cx=[];
      S.cx.push(e);
      if(!pkPick(e.id))return;
      break;
    }
    case 'tps-place':{const d=tpDraft();d.place=id;d.split=recSplit(d);break}
    case 'tps-eq':tog(tpDraft().eq,id);break;
    case 'tps-days':{const d=tpDraft();d.days=Number(id);d.split=recSplit(d);break}
    case 'tps-time':tpDraft().time=Number(id);break;
    case 'tps-lvl':{const d=tpDraft();d.level=id;d.split=recSplit(d);break}
    case 'tps-split':tpDraft().split=id;break;
    case 'tp-setopen':tpSetOpen=!tpSetOpen;tpd=null;break;
    case 'tp-gen':{
      if(S.tp&&tpArm!=='gen'){tpArm='gen';break}
      S.tp=genPlan(tpDraft());tpd=null;tpArm=null;tpSetOpen=false;tpOpenEx=null;tpFocus=false;tpDay=wdToday();
      syncTraining();save();toast('Plan erstellt');break;
    }
    case 'help':{const hp=HELP[id];if(hp)modal({title:hp[0],body:'<p>'+esc(hp[1])+'</p>',btn:'Verstanden'});return}
    case 'wk-toggle':wkOpen=!wkOpen;break;
    case 'go-konto':tab='status';stSub='konto';form=null;profId=null;break;
    case 'tp-quick':{S.tp=genPlan(tpDefaults());S.tpHide=false;tpd=null;tpArm=null;tpSetOpen=false;tpOpenEx=null;tpFocus=false;tpDay=wdToday();syncTraining();save();toast('Plan erstellt. Du kannst ihn im Tab Training ändern.');break}
    case 'ses-open':sesOpen();return;
    case 'ses-min':sesOn=false;sesRender();render();return;
    case 'ses-cur':{if(!S.ses)return;const i=Number(id);S.ses.cur=S.ses.cur===i?-1:i;sesRender();return}
    case 'ses-set':{if(!S.ses)return;const p=String(id).split(':').map(Number);sesToggle(p[0],p[1]);return}
    case 'ses-add':{
      const x=S.ses&&S.ses.ex[Number(id)];
      if(x&&x.sets.length<10){const l=x.sets[x.sets.length-1];x.sets.push({w:l?l.w:'',r:l?l.r:x.tg,d:0});save();sesRender()}
      return;
    }
    case 'ses-skip':{
      const i=Number(id),x=S.ses&&S.ses.ex[i];
      if(x){
        x.sk=x.sk?0:1;
        if(x.sk){const nx=S.ses.ex.findIndex((y,k)=>k!==i&&!y.sk&&y.sets.some(a=>!a.d));if(nx>=0)S.ses.cur=nx}
        else S.ses.cur=i;
        save();sesRender();
      }
      return;
    }
    case 'ses-rest':{
      const r=S.ses&&S.ses.rest;
      if(r){
        if(id==='skip')S.ses.rest=null;
        else{r.end=Math.max(Date.now(),r.end+Number(id)*1000);r.fired=r.end<=Date.now()?1:0}
        save();sesRender();
      }
      return;
    }
    case 'ses-end':{
      if(!S.ses)return;
      const c=sesCounts();
      if(!c.dn)return;
      if(c.dn<c.tt&&sesArm!=='end'){sesArm='end';sesRender();return}
      sesFinish(false);return;
    }
    case 'ses-cancel':{
      if(sesArm!=='cancel'){sesArm='cancel';sesRender();return}
      S.ses=null;sesOn=false;sesArm=false;sesRender();save();render();toast('Training verworfen');return;
    }
    case 'gym-check':sesFinish(true);return;
    case 'stat':if(S.free>0&&S.stats[id]!=null){S.free--;S.stats[id]++;save()}break;
    case 'settings':{
      S.name=(document.getElementById('setName').value.trim()||'Spieler');
      save();toast('Gespeichert');break;
    }
    case 'reset':
      if(penArmed){S=defaults();S.started=true;S.lastDay=dayKey();S.sys={day:S.lastDay,q:genSys(),st:'open'};ensureLive();penArmed=false;tab='quests';B=null;save();toast('Neu gestartet')}else penArmed=true;break;
    case 'buy':if(!buyItem(id))return;save();break;
    case 'pen-erlass':if(!usePardon(id))return;save();break;
    case 'decree':if(!useDecree())return;save();break;
    case 'sug-toggle':if(S.auto)return;sugOpen=!sugOpen;break;
    case 'auto-ask':
      if(S.auto)modal({title:'Selbst wählen?',nobtn:true,body:'<p>Deine früheren eigenen Quests kommen zurück. Die Quests von heute werden ersetzt.</p><div class="btnrow"><button class="btn ok" data-act="auto-off">Selbst wählen</button><button class="btn ghost" data-act="modal-ok">Abbrechen</button></div>'});
      else modal({title:'Quests vom System',nobtn:true,body:'<p>Das System wählt jeden Tag neue Tagesquests passend zu deinem Fragebogen. „Eigene Quest“ und „Vorschläge“ sind dann aus.</p><p class="dim">Deine eigenen Tagesquests werden pausiert und kommen zurück, wenn du wieder selbst wählst. Die Quests von heute werden ersetzt.</p><div class="btnrow"><button class="btn ok" data-act="auto-on">Einschalten</button><button class="btn ghost" data-act="modal-ok">Abbrechen</button></div>'});
      break;
    case 'auto-on':nextModal();autoOn();save();toast('Das System wählt jetzt deine Quests');break;
    case 'auto-off':nextModal();autoOff();save();toast('Du wählst wieder selbst');break;
    case 'sug-add':{
      const t=sugItems().find(x=>x.n===id);
      if(!t)return;
      if(S.quests.filter(y=>y.type==='daily').length>=QUEST_MAX){toast('Höchstens '+QUEST_MAX+' tägliche Quests');return}
      S.quests.push(mkQ(t.n,t.b,t.u,t.s));save();toast('Hinzugefügt: '+t.n);break;
    }
    case 'st-sub':stSub=id;break;
    case 'v-sub':vSub=id;gForm=false;gArm=null;break;
    case 'v-ex':vEx=id;jump='v-det';break;
    case 'v-all':vAll=!vAll;break;
    case 'goal-new':gForm=!gForm;break;
    case 'goal-save':{
      const v=i=>(document.getElementById(i)||{}).value;
      const n=String(v('gn')||'').trim().slice(0,40),a=parseFloat(String(v('gs')).replace(',','.')),b=parseFloat(String(v('gt')).replace(',','.')),u=String(v('gu')||'').trim().slice(0,10);
      if(!n){toast('Gib dem Ziel einen Namen');return}
      if(!isFinite(a)||!isFinite(b)||a===b){toast('Start und Ziel müssen verschiedene Zahlen sein');return}
      if(!Array.isArray(S.goals))S.goals=[];
      if(S.goals.length>=6){toast('Höchstens 6 Wunschziele');return}
      S.goals.push({id:uid(),n,u,s:a,t:b,at:dayKey(),log:[]});gForm=false;save();toast('Wunschziel angelegt');break;
    }
    case 'goal-log':{
      const g=(S.goals||[]).find(x=>x.id===id);if(!g)return;
      const v=parseFloat(String((document.getElementById('gv-'+id)||{}).value||'').replace(',','.'));
      if(!isFinite(v)){toast('Trage eine Zahl ein');return}
      const was=goalDone(g),t=dayKey();
      g.log=g.log.filter(x=>x[0]!==t);g.log.push([t,Math.round(v*100)/100]);g.log=g.log.slice(-60);
      if(!was&&goalDone(g)&&!g.rew){g.rew=1;S.gold+=100;grantXP(150);modal({pic:'victory',kind:'vio',title:'Wunschziel erreicht',body:'<p style="font-family:var(--f-d);font-size:22px">'+esc(g.n)+'</p><div class="big">+150 XP</div><p>+100 G. Setz dir das nächste Ziel.</p>',btn:'Weiter'})}
      else toast('Eingetragen');
      save();break;
    }
    case 'goal-del':{
      if(gArm!==id){gArm=id;break}
      S.goals=(S.goals||[]).filter(x=>x.id!==id);gArm=null;save();break;
    }
    case 'tp-off':{
      if(tpArm!=='off'){tpArm='off';break}
      S.tp=null;S.tpHide=true;tpArm=null;tpd=null;tpSetOpen=false;tpOpenEx=null;tpFocus=false;
      S.quests=S.quests.filter(q=>q.type!=='gym');S.ses=null;sesOn=false;sesRender();save();toast('Trainingsplan entfernt');break;
    }
    case 'tp-on':S.tpHide=false;tab='plan';break;
    case 'sh-team':{
      if(!Array.isArray(S.team))S.team=[];
      if(!S.shadows.some(x=>x.id===id))return;
      if((S.exp||[]).some(e=>e.id===id)){toast('Dieser Schatten ist auf Expedition');return}
      if(S.team.includes(id))S.team=S.team.filter(x=>x!==id);
      else if(teamList().length>=TEAM_MAX){toast('Dein Team ist voll. Entlasse zuerst einen Schatten.');return}
      else S.team.push(id);
      save();break;
    }
    case 'bk-save':backupSave();return;
    case 'bk-load':backupApply();break;
    case 'inst':if(instEv){instEv.prompt();instEv=null}break;
    case 'rg-open':rgOpen();return;
    case 'rg-go':rgGo();return;
    case 'rg-next':rgNext();return;
    case 'rg-close':if(rg)clearTimeout(rg.tm);rg=null;rgRender();return;
    case 'wr-ok':S.wr=weekStart();save();break;
    case 'use':{
      const h=S.inv.find(x=>x.name===id);
      if(h){h.n--;if(h.n<=0)S.inv=S.inv.filter(x=>x!==h);save();toast('Eingelöst: '+id)}
      break;
    }
    default:return;
  }
  render();
  doJump();
});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='bkFile'){backupRead(e.target.files[0]);e.target.value=''}});
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('[data-rg=tap]');if(t&&rg){e.preventDefault();rgTap()}});
document.addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.si){sesInput(e.target);return}
  if(e.target.id==='vEx'){vEx=e.target.value;render();return}
  if(e.target.id==='pk-q'&&pk){pk.q=e.target.value;const l=document.getElementById('pk-list');if(l)l.innerHTML=pkRows();return}
  if(form&&e.target.id==='fName'&&!form.statManual){const g=guessStat(e.target.value),sl=document.getElementById('fStat');if(g&&sl)sl.value=g}
  if(!form||(e.target.id!=='fTarget'&&e.target.id!=='fUnit'&&e.target.id!=='fName'))return;
  const p=document.getElementById('fPrev');if(p)p.textContent=prevText(readForm());
});
document.addEventListener('change',e=>{
  if(e.target.id==='avatarIn'){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)setAvatar(f);return}
  if(!form)return;
  const id=e.target.id;
  if(id==='fStat'){form.statManual=true;return}
  if(id==='fUnitSel'){form=readForm();render();return}
  if(id==='fType'||id==='fRank'){
    const old=form,f=readForm();
    if(id==='fType'){f.rank='E'}
    if(f.type==='dungeon'&&old.type!==f.type)f.stat='str';
    form=f;render();
  }
});

if(S.started&&S.sys.st==='none'){S.sys={day:dayKey(),q:genSys(),st:'open'}}
if(S.started){rollover();syncTraining();ensureLive();save()}
if(S.started&&S.seenV!==APP_V&&!navigator.webdriver){
  S.seenV=APP_V;save();
  modal({title:'Neu in '+APP_V,btn:'Los geht\u2019s',body:'<ul style="text-align:left;padding-left:18px;margin:6px 0;font-size:15px;line-height:1.5"><li><b>Klassen</b> haben Boni und eine Spezialfähigkeit im Kampf (Hunter > Status)</li><li><b>Quests vom System</b> als Schalter (Hunter > Konto > Einstellungen)</li><li><b>Verlauf > Training</b> zeigt dein Plus pro Übung</li><li><b>Verborgene Ränge S+ und S∞</b> für lange Serien, nur ab Rang S</li></ul>'});
}
render();
if(!S.started&&!(SUPABASE_URL&&SUPABASE_KEY))showIntro();
initRemote();
})();
</script>
</body>
</html>
