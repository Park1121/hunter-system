<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hunter">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Hunter System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column (phone first). Top: profile card. Bottom: floating tab bar. Quests are picture cards. Dark, cold, restrained; the artwork carries the colour. */
:root{
  --bg:#04060f; --bg2:#0a1030; --panel:rgba(15,19,42,.78); --panel2:rgba(24,30,62,.7);
  --line:rgba(130,160,255,.16); --line2:rgba(130,160,255,.3);
  --glow:#5ad2ff; --fg:#e6ecff; --dim:#8d99c2; --ok:#4fd6a8; --warn:#ffc34a; --bad:#ff5468; --violet:#9b6bff;
  --f-d:'Barlow Condensed','Oswald','Arial Narrow',system-ui,sans-serif; --f-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-b); font-size:15px; line-height:1.45;
  background-image:radial-gradient(700px 420px at 50% -8%,#1a2c7a55,transparent 70%),radial-gradient(520px 380px at 105% 105%,#3a1a7a33,transparent 70%);
  background-attachment:fixed; min-height:100vh;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(104px + env(safe-area-inset-bottom,0px));
  padding-left:max(14px,env(safe-area-inset-left,0px)); padding-right:max(14px,env(safe-area-inset-right,0px));
}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

.win{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 14px;box-shadow:0 8px 30px #0006;min-width:0;backdrop-filter:blur(8px)}
.win.bad{border-color:#ff546866;background:linear-gradient(#2a0c1670,var(--panel))}
.win.vio{border-color:#9b6bff55;background:linear-gradient(#1c1250aa,var(--panel))}
.win.gold{border-color:#ffc34a55;background:linear-gradient(#2c200a77,var(--panel))}

.lbl{font-weight:600;font-size:12.5px;letter-spacing:.04em;color:var(--dim)}
.bad .lbl{color:var(--bad)}
h2{margin:0;font-family:var(--f-d);font-weight:700;font-size:23px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
h3{margin:0;font-family:var(--f-d);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums;font-weight:700}
.dim{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
p{margin:0}

/* avatar */
.avatar{--rk:#8aa0c8;position:relative;flex:none;width:96px;height:96px;border-radius:16px;border:2px solid var(--rk);box-shadow:0 0 18px color-mix(in srgb,var(--rk) 55%,transparent);background:#0b1233;overflow:hidden;display:grid;place-items:center}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.08) saturate(.85)}
.avatar::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#04060fcc);pointer-events:none}
.avatar .ph{font-family:var(--f-d);font-size:42px;font-weight:700;color:var(--rk)}
.avatar .rt{position:absolute;right:5px;bottom:2px;z-index:2;font-family:var(--f-d);font-weight:700;font-size:20px;color:var(--rk);text-shadow:0 0 8px var(--rk)}
.avatar.big{width:132px;height:132px;border-radius:20px}
.avatar.sm{width:48px;height:48px;border-radius:12px}.avatar.sm .rt{font-size:13px}.avatar.sm .ph{font-size:22px}
.r-E{--rk:#8aa0c8}.r-D{--rk:#5ad2ff}.r-C{--rk:#4fd6a8}.r-B{--rk:#ffc34a}.r-A{--rk:#ff5468}.r-S{--rk:#9b6bff}

/* rank looks */
@keyframes rkpulse{0%,100%{filter:drop-shadow(0 0 3px var(--rk))}50%{filter:drop-shadow(0 0 11px var(--rk))}}
@keyframes rkshine{to{background-position:0 0,300% 0}}
.avatar.r-D{outline:1px solid var(--rk);outline-offset:3px}
.avatar.r-C{outline:1px solid var(--rk);outline-offset:3px;box-shadow:0 0 26px var(--rk)}
.avatar.r-B,.avatar.r-A,.avatar.r-S{outline:2px solid var(--rk);outline-offset:4px;box-shadow:0 0 28px var(--rk)}
.avatar.r-A,.avatar.r-S{animation:rkpulse 2.6s ease-in-out infinite}
.avatar.r-S{border:3px solid transparent;background:linear-gradient(#0b1233,#0b1233) padding-box,linear-gradient(110deg,#9b6bff,#ffd36b,#ff5468,#4fd6a8,#9b6bff) border-box;background-size:100% 100%,300% 100%;animation:rkpulse 2.6s ease-in-out infinite,rkshine 6s linear infinite}
.avatar.sm.r-D,.avatar.sm.r-C,.avatar.sm.r-B,.avatar.sm.r-A,.avatar.sm.r-S{outline-offset:2px;box-shadow:0 0 12px var(--rk)}
.avatar.au::before{content:"";position:absolute;inset:0;border:3px solid var(--au);box-shadow:inset 0 0 14px var(--au);z-index:1;pointer-events:none;border-radius:inherit}
.avatar.sm.au::before{border-width:2px}
.badge{--rk:#8aa0c8;grid-row:span 2;width:56px;height:56px;display:grid;place-items:center;border:2px solid var(--rk);background:#0b1233;border-radius:14px;text-align:center;box-shadow:0 0 16px color-mix(in srgb,var(--rk) 55%,transparent)}
.badge b{font-family:var(--f-d);font-size:32px;line-height:1;color:var(--rk);text-shadow:0 0 14px var(--rk)}
.badge small{display:none}
.badge.r-A b,.badge.r-S b{animation:rkpulse 2.6s ease-in-out infinite}
.pname.au{color:var(--au);text-shadow:0 0 12px var(--au)}
.pn.au{color:var(--au)}
.stars{color:#ffd36b;letter-spacing:.08em;text-shadow:0 0 8px #ffd36b88;font-size:.85em}
.rankbox .rkrow{display:flex;gap:16px;align-items:center}
.rkbig{flex:none;width:84px;height:84px;display:grid;place-items:center;font-family:var(--f-d);font-weight:700;font-size:54px;color:var(--rk);border:2px solid var(--rk);box-shadow:0 0 22px var(--rk);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:#0b1233;text-shadow:0 0 14px var(--rk)}
.rkinfo{flex:1;min-width:0}
.pres{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:6px}
.pz{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-family:var(--f-d);font-size:15px;color:var(--dim);opacity:.55}
.pz small{display:block;font-size:12px;font-family:var(--f-b)}
.pz.on{opacity:1;color:#ffd36b;border-color:#ffd36b88;box-shadow:0 0 10px #ffd36b33}
#modal .rankup{font-size:110px;line-height:1;color:var(--rk);text-shadow:0 0 30px var(--rk);animation:rkpulse 2s ease-in-out infinite}
#modal .big.stars{color:#ffd36b;text-shadow:0 0 20px #ffd36b88}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
#modal .pick{justify-content:center}
.pick button{font-family:var(--f-d);letter-spacing:.04em;font-size:16px;padding:6px 12px;background:#0b1233;border:1px solid var(--line2);border-radius:10px;color:var(--fg);cursor:pointer;line-height:1.15}
.pick button.on{border-color:var(--glow);box-shadow:0 0 10px #5ad2ff66;color:#fff;background:#12306b}
.pick button small{display:block;font-size:11.5px;color:var(--dim);font-family:var(--f-b)}
.pick button[disabled]{opacity:.45}
.pick .sw{width:34px;height:34px;padding:0;background:var(--c);border-color:#0006}
.pick .sw.on{outline:2px solid #fff;outline-offset:2px;box-shadow:none}
@media (prefers-reduced-motion:reduce){.avatar,.badge b,#modal .rankup,.mimg.hurt{animation:none!important}}

/* header */
#hdr{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;padding:12px 14px}
#hdr .avatar{grid-row:span 1;width:56px;height:56px;border-radius:14px}
#hdr .avatar .rt{font-size:15px}
#hdr .badge{grid-row:auto}
.hm{min-width:0}
.pname{font-family:var(--f-d);font-size:24px;font-weight:700;letter-spacing:.03em;line-height:1.05;overflow-wrap:anywhere}
.ptitle{color:var(--dim);font-size:13px}
.lvbox{text-align:right;line-height:1}
.lvbox small{display:block;font-size:11.5px;color:var(--dim);font-weight:600}
.lvbox b{font-family:var(--f-d);font-size:36px;color:var(--fg)}
.xpwrap{grid-column:1/-1}
.xl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-bottom:4px;font-weight:600}
.pills{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:#0c1334;border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 8px;font-family:var(--f-d);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px;flex:none}
.pill.g{color:var(--warn)}.pill.s{color:#ff8a4a}.pill.k{color:var(--glow)}
.bar{height:9px;background:#0a1233;border:1px solid var(--line);border-radius:99px;position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#2a5bff,#5ad2ff);box-shadow:0 0 10px #5ad2ff88;transition:width .3s}
.bar.ok>i{background:linear-gradient(90deg,#1fa985,var(--ok));box-shadow:0 0 10px #4fd6a888}
.bar.vio>i{background:linear-gradient(90deg,#6a3bff,var(--violet));box-shadow:0 0 10px #9b6bff88}
.bar.red>i{background:linear-gradient(90deg,#c21d38,var(--bad));box-shadow:0 0 10px #ff546888}
.bar.mp>i{background:linear-gradient(90deg,#2a3cff,#7f8bff)}

#warn{border:1px solid var(--warn);border-radius:12px;background:#3a280a88;color:var(--warn);padding:8px 14px;font-weight:600;font-size:14px;text-align:center}
#warn.hot{border-color:var(--bad);background:#3a0f1888;color:var(--bad)}

/* bottom tab bar */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;width:min(540px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;background:rgba(10,14,34,.9);border:1px solid var(--line2);border-radius:20px;backdrop-filter:blur(14px);box-shadow:0 10px 40px #000b}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:0;border-radius:14px;padding:8px 0 6px;color:var(--dim);font-weight:600;font-size:11.5px;min-height:52px}
#tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-selected=true]{color:#fff;background:linear-gradient(#1a3d96aa,#12286a88);box-shadow:inset 0 0 0 1px #5ad2ff66,0 0 18px #5ad2ff33}
#tabs button[aria-selected=true] svg{stroke:var(--glow)}
#tabs button .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}

main{display:flex;flex-direction:column;gap:12px;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:#0a1030;border:1px solid var(--line);border-radius:14px}
.seg button{background:transparent;border:0;border-radius:10px;padding:8px 4px;color:var(--dim);font-family:var(--f-d);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.seg button[aria-selected=true]{background:#14307a;color:#fff;box-shadow:inset 0 0 0 1px #5ad2ff55}
.sub{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cd{font-family:var(--f-d);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;color:var(--warn);letter-spacing:.04em;line-height:1}

/* quests */
.q{display:flex;flex-direction:column;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.q:first-of-type{margin-top:0}
.qt{display:flex;gap:12px;align-items:center}
.pic{--c:#2a5bff;position:relative;flex:none;overflow:hidden;background:radial-gradient(120% 120% at 30% 20%,color-mix(in srgb,var(--c) 55%,#04060f),#04060f)}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.qt .pic{width:78px;height:78px;border-radius:12px;border:1px solid var(--line2)}
.qm{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.qh{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.qn{font-weight:600;font-size:16px;overflow-wrap:anywhere;min-width:0;line-height:1.2}
.q.done .qn{color:var(--ok)}
.q.done .qn::before{content:"✓ "}
.q.done{opacity:.7}
.q.done .pic img{filter:grayscale(.7) brightness(.8)}
.qp{font-family:var(--f-d);font-variant-numeric:tabular-nums;font-size:16px;color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-d);font-size:14px;font-weight:600;letter-spacing:.03em;padding:1px 8px;border:1px solid var(--line2);border-radius:6px;color:var(--dim);background:#0a1030aa}
.chip.xp{color:var(--glow);border-color:#5ad2ff66}
.chip.g{color:var(--warn);border-color:#ffc34a66}
.chip.rk{color:var(--fg);border-color:var(--violet)}
.chip.sys{color:var(--ok);border-color:#4fd6a866}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* featured quest card */
.q.big{padding:0;overflow:hidden;gap:0;border-color:var(--line2);box-shadow:0 12px 36px #0009}
.q.big .pic{width:100%;aspect-ratio:16/9;border-radius:0;border:0}
.q.big .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#04060f00 35%,#04060fe6 100%),linear-gradient(90deg,#04060f66,transparent 40%)}
.q.big .cap{position:absolute;left:14px;right:14px;bottom:12px;z-index:2;display:flex;flex-direction:column;gap:6px}
.q.big .qn{font-family:var(--f-d);font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1;text-shadow:0 2px 14px #000}
.q.big .qp{color:#cbd6ff;font-size:18px}
.q.big .qb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.q{position:relative}
.tools{position:absolute;top:8px;right:8px;z-index:3;display:flex;gap:5px}
.q:not(.big) .qh{padding-right:70px}
.q.big .tools{top:10px;right:12px}
.q.big .tools .btn{background:#04060fb3;backdrop-filter:blur(4px)}
.q.big .tagrow{padding-right:80px}
.q.big .tagrow{position:absolute;top:10px;left:12px;right:12px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
.q.big .chip{background:#04060fb3;backdrop-filter:blur(4px)}

.btn{background:#14307acc;border:1px solid #5ad2ff99;border-radius:10px;padding:7px 15px;font-family:var(--f-d);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:16px;min-height:40px;line-height:1.1}
.btn:hover{background:#1c3f99;box-shadow:0 0 14px #5ad2ff55}
.btn.ok{border-color:var(--ok);color:#06241b;background:linear-gradient(#5ee3b8,#35c394);box-shadow:0 0 16px #4fd6a844}
.btn.warn{border-color:var(--warn);color:var(--warn);background:#3a280a55}
.btn.bad{border-color:var(--bad);color:#ffb3bd;background:#4a0f1c99}
.btn.vio{border-color:var(--violet);color:#d6c3ff;background:#2a1a5acc}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--dim)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:3px 11px;min-height:32px;font-size:14px}
.btn.ic{width:32px;min-width:0;padding:0;font-size:17px;font-family:var(--f-b)}
.q .acts{gap:6px}
.q .btn{font-size:15px;padding:6px 10px;letter-spacing:.03em}
.q .acts input.amt{width:56px;padding:8px 4px;text-align:center}
input[type=text],input[type=number],input[type=password],select,textarea{background:#080d28;border:1px solid var(--line2);border-radius:10px;padding:8px 11px;min-height:40px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px}
input[type=number].amt{width:76px}
input[type=file]{display:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--dim);min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.grid .wide{grid-column:1/-1}
.empty{color:var(--dim);padding:6px 0}

/* stats + skills */
.stat{display:grid;grid-template-columns:118px 1fr 38px auto;gap:10px;align-items:center;padding:6px 0}
.stat .nm{font-family:var(--f-d);font-weight:700;font-size:17px;white-space:nowrap;letter-spacing:.03em;text-transform:uppercase}
.stat .v{font-size:24px;text-align:right;color:var(--glow)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv div{border:1px solid var(--line);border-radius:12px;padding:8px 11px;background:#0a1030aa}
.kv .num{font-size:24px;display:block}
.skill{display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.skill:first-of-type{border-top:0}
.skill.lock{opacity:.5}
.skill .nm{font-family:var(--f-d);font-weight:700;letter-spacing:.04em;font-size:18px}
.char{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.char .info{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:6px}
.lore{color:var(--dim)}
.radar{display:block;width:100%;max-width:300px;margin:0 auto 6px;height:auto;overflow:visible}
.radar .ring{fill:none;stroke:#8da0ff33;stroke-width:1}
.radar .ax{stroke:#8da0ff22}
.radar .shape{fill:#5ad2ff33;stroke:#5ad2ff;stroke-width:2;stroke-linejoin:round;filter:drop-shadow(0 0 6px #5ad2ff88)}
.radar text{font-family:var(--f-d);font-size:13px;font-weight:700;fill:#aebbe8;letter-spacing:.04em;text-anchor:middle}
.radar .dot{fill:#fff}

/* shop */
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-of-type{border-top:0}
.item .nm{font-weight:600;overflow-wrap:anywhere;min-width:0;flex:1 1 90px}
.shadow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #9b6bff33;font-family:var(--f-d);font-size:18px}
.shadow:first-of-type{border-top:0}
.shadow span:first-child{color:#c1a6ff}

/* battle */
.stage{--bc:#2a5bff;position:relative;height:340px;border-radius:18px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 12px 40px #000a;background:
  radial-gradient(60% 50% at 50% 78%,color-mix(in srgb,var(--bc) 60%,transparent),transparent 70%),
  radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--bc) 35%,#04060f),#04060f 75%)}
.stage::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-8%;height:38%;background:radial-gradient(50% 60% at 50% 100%,#000c,transparent 70%),linear-gradient(transparent,#04060f99);pointer-events:none}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(100% 100% at 50% 50%,transparent 55%,#000a);pointer-events:none}
.stage.red{--bc:#d81f3c}
.stage .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;z-index:0}
.stage::before,.stage::after{z-index:1}
.stage .mimg{position:absolute;left:50%;bottom:44px;height:78%;width:auto;transform:translateX(-50%);filter:drop-shadow(0 0 28px color-mix(in srgb,var(--bc) 70%,transparent)) drop-shadow(0 14px 12px #000b);z-index:2}
.stage .mimg.hurt{animation:hurt .32s ease-out}
.stage .mimg.dead{opacity:.25;filter:grayscale(1) blur(1px)}
@keyframes hurt{0%{transform:translateX(-50%) translateY(0);filter:brightness(2.4) drop-shadow(0 0 28px #fff)}25%{transform:translateX(calc(-50% + 10px))}50%{transform:translateX(calc(-50% - 8px))}100%{transform:translateX(-50%)}}
.stage .top{position:absolute;z-index:3;left:12px;right:12px;top:12px;display:flex;flex-direction:column;gap:5px}

/* history */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}

/* modal + toast */

#toast div{background:#0d1638f2;border:1px solid var(--line2);border-radius:12px;padding:9px 15px;font-weight:600;font-size:14.5px;box-shadow:0 8px 30px #000a;animation:pop .2s ease-out;text-align:center}

}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
const KEY='hunter-system-v2';
/* Online-Arena: Werte aus Supabase eintragen (Project URL und anon public key). Leer lassen = nur lokal + Hunter-Code. */
const SUPABASE_URL='https://jxbzejqhuzwzhautboqj.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4YnplanFodXp3emhhdXRib3FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNzU4MzgsImV4cCI6MjEwNzk1MTgzOH0.saG9VgPYFdZLJDxDMMXvH0GjVoJHyUyTrbEGc4Npl6g';
const STATS=[['str','Stärke'],['vit','Ausdauer'],['agi','Agilität'],['int','Intelligenz'],['dis','Disziplin']];
const HINT={str:'Kraft → Stärke',vit:'Cardio, Laufen → Ausdauer',agi:'Dehnen, Beweglichkeit → Agilität',int:'Lernen → Intelligenz',dis:'Gewohnheit → Disziplin'};
const RANKS=['E','D','C','B','A','S'];
const RANK_AT=[1,10,20,35,50,70];
const TITLES={E:'Schwächster Hunter',D:'Aufsteiger',C:'Erprobter Hunter',B:'Elite-Hunter',A:'Nationaler Hunter',S:'Schattenmonarch'};
const DUNGEON_REWARD={E:[50,25],D:[100,50],C:[200,100],B:[400,200],A:[800,400],S:[1500,800]};
const TIER_PRICE=[40,100,250,500],TIER_NAME=['Klein','Mittel','Groß','Riesig'];
const QUEST_MAX=8,GATE_MAX=3,SHOP_MAX=15;
const PEN_T=[{n:'Burpees',u:'Wdh.',b:20},{n:'Kniebeugen',u:'Wdh.',b:30},{n:'Planke',u:'Sek.',b:60},{n:'Mountain Climbers',u:'Wdh.',b:40},{n:'Liegestütze',u:'Wdh.',b:15},{n:'Hampelmänner',u:'Wdh.',b:50},{n:'Wandsitzen',u:'Sek.',b:60},{n:'Ausfallschritte',u:'Wdh.',b:30},{n:'Sit-ups',u:'Wdh.',b:30},{n:'Dips',u:'Wdh.',b:15},{n:'Treppen sprinten',u:'Stockwerke',b:5},{n:'Seilspringen',u:'Min.',b:5}];
/* Belohnungen kommen vom System, nicht vom Spieler */
function effortMin(target,unit){
  const t=Math.max(0,Number(target)||0),u=String(unit||'').toLowerCase().trim();
  if(!u)return t<=1?5:Math.min(t,30)*0.5;
  if(/^(std|h$|stunde)/.test(u))return t*60;
  if(/^min/.test(u))return t;
  if(/^(sek|sec|s$)/.test(u))return t/60;
  if(/km/.test(u))return t*6;
  if(/stock|etage/.test(u))return t*0.5;
  if(/seite|kapitel/.test(u))return t*3;
  if(/wdh|rep|stück|mal|^x$|satz|sätze/.test(u))return t*0.15;
  return Math.min(t,60)*0.3;
}
function calcXP(target,unit,type,rank){
  if(type==='dungeon')return DUNGEON_REWARD[DUNGEON_REWARD[rank]?rank:'E'][0];
  return Math.round(Math.max(8,Math.min(50,5+1.1*effortMin(target,unit))));
}
function calcGold(xp,type,rank){return type==='dungeon'?DUNGEON_REWARD[DUNGEON_REWARD[rank]?rank:'E'][1]:Math.round(xp/2)}
const dayCap=()=>200+S.level*8;
function capState(){const t=dayKey();if(!S.cap||S.cap.day!==t)S.cap={day:t,xp:0,dg:0};return S.cap}
const maxGate=()=>Math.min(5,rankIdx(S.level)+1);
function shopMinTier(name){
  const n=String(name||'').toLowerCase();
  if(/urlaub|ferien|reise|wochenende|ausflug|tag frei|freier tag|ganzer tag|ganzen tag|krank|schwänz/.test(n))return 3;
  if(/abend|kino|restaurant|essen gehen|party|cheat|konzert|nacht|shopping|neues spiel|kaufen/.test(n))return 2;
  if(/stunde|std|gaming|zocken|serie|film|spiel/.test(n))return 1;
  return 0;
}
function genPenalty(){
  const t=PEN_T[Math.floor(Math.random()*PEN_T.length)];
  const n=Math.max(5,Math.round(t.b*(1+S.level*0.02)/5)*5);
  return n+' '+t.u+' '+t.n;
}
function mkQ(name,target,unit,stat){const xp=calcXP(target,unit,'daily');return {id:uid(),name,target,unit,stat,xp,gold:calcGold(xp),type:'daily',rank:'E',cur:0,done:false}}
function packQuests(id){return (PACKS[id]&&PACKS[id].q||[]).map(a=>mkQ(a[0],a[1],a[2],a[3]))}
const prestigeOf=()=>PRESTIGE.filter(p=>(S.bestStreak||0)>=p.d).length;
const validAura=a=>AURAS.some(x=>x[0]===a)?a:null;
const auAttr=a=>validAura(a)?' style="--au:'+a+'"':'';
const auCls=a=>validAura(a)?' au':'';
const stars=n=>n>0?'<span class="stars" title="Prestige-Siegel">'+'★'.repeat(Math.min(n,PRESTIGE.length))+'</span>':'';
function pickMark(act,val){document.querySelectorAll('[data-act="'+act+'"]').forEach(b=>b.classList.toggle('on',b.dataset.id===val))}
const EMB_C={E:[50,57.5,.4],D:[49.8,46.6,.36],C:[49.8,57.9,.3],B:[49.9,48.1,.32],A:[49.9,46.2,.3],S:[50.2,46.1,.32]};
const EMB_L={E:'#9ec5ff',D:'#6ff3d6',C:'#b4e8ff',B:'#ffd36b',A:'#ff7a7a',S:'#e2bcff'};
function emblem(r,sz,cls){
  r=EMB_C[r]?r:'E';const c=EMB_C[r];
  return '<span class="emb '+(cls||'')+'" style="--sz:'+sz+'px;--cx:'+c[0]+'%;--cy:'+c[1]+'%;--lf:'+c[2]+';--el:'+EMB_L[r]+'"><img alt="" src="img/emblem-'+r+'.webp" onerror="this.parentNode.classList.add(\'nf\');this.remove()"><b>'+r+'</b></span>';
}
function itemKey(it){
  if(!it)return 'sword';
  if(it.kind==='potion'||it.kind==='gold'||it.kind==='key'||it.kind==='chest')return it.kind;
  const n=(it.name||'').toLowerCase();
  if(/dolch/.test(n))return 'dagger';
  if(/axt/.test(n))return 'axe';
  if(/schwert/.test(n))return 'sword';
  if(/leder/.test(n))return 'leather';
  if(/ketten/.test(n))return 'chain';
  if(/platten/.test(n))return 'plate';
  return it.kind==='armor'?'chain':'sword';
}
function itemIco(it,size){
  const k=itemKey(it),cls=(it&&it.r!=null&&k!=='potion'&&k!=='gold'&&k!=='key'&&k!=='chest')?' r-'+RANKS[Math.max(0,Math.min(5,it.r|0))]:'';
  const t=k==='potion'?' pot':k==='gold'?' gold':k==='key'?' key':'';
  return '<span class="ico'+(size?' '+size:'')+cls+t+'"><img alt="" loading="lazy" src="img/item-'+k+'.webp" onerror="this.remove()"></span>';
}
function lootRow(r){
  const c=(ico,cap)=>'<div class="lc">'+ico+'<span>'+cap+'</span></div>';
  let h='<div class="lootrow">'+c(itemIco({kind:'gold'},'big'),'+'+r.g+' G');
  if(r.li)h+=r.li.kind==='potion'?c(itemIco(r.li,'big'),r.li.n+' Trank'):c(itemIco(r.li,'big'),esc(r.li.name));
  return h+'</div>';
}
const SH_T=['knight','assassin','beast'],SH_L={knight:'Schattenritter',assassin:'Schattenassassine',beast:'Schattenbestie'};
function scene(n,cls,pos){return '<div class="scene '+(cls||'')+'"><img alt="" loading="lazy" src="img/ui-'+n+'.webp" style="object-position:'+(pos||'50% 40%')+'" onerror="this.parentNode.remove()"></div>'}
const tierOf=pr=>Math.max(0,Math.min(3,TIER_PRICE.filter(x=>pr>=x).length-1));
function tierIco(pr){return '<span class="ico tier"><img alt="" loading="lazy" src="img/shop-tier'+tierOf(pr)+'.webp" onerror="this.remove()"></span>'}
function rankSection(){
  const r=rankOf(S.level),i=rankIdx(S.level),lo=RANK_AT[i],hi=RANK_AT[i+1],pct=hi?Math.min(100,(S.level-lo)/(hi-lo)*100):100;
  return '<section class="win rankbox"><div class="rkrow">'+emblem(r,132,'big')+'<div class="rkinfo"><div class="lbl">Rang</div><div class="num" style="font-size:22px">'+esc(TITLES[r])+' '+stars(prestigeOf())+'</div>'+
    (hi?'<div class="qp">Nächster Rang '+RANKS[i+1]+' bei LV '+hi+' (noch '+(hi-S.level)+' Level)</div><div class="bar" style="margin-top:6px"><i style="width:'+pct+'%"></i></div>':'<div class="qp">Höchster Rang erreicht.</div>')+'</div></div>'+
    '<div class="lbl" style="margin-top:12px">Prestige-Siegel für deine Serie</div><div class="pres">'+PRESTIGE.map((p,k)=>'<div class="pz'+((S.bestStreak||0)>=p.d?' on':'')+'">'+'★'.repeat(k+1)+' '+p.n+'<small>'+p.d+' Tage am Stück</small></div>').join('')+'</div>'+
    '<div class="qp" style="margin-top:6px">Beste Serie: '+(S.bestStreak||0)+' Tage. Das Siegel steht neben deinem Namen, auch für deine Freunde.</div></section>';
}
function introBody(){
  return '<p>Du wurdest als Spieler ausgewählt.</p><p class="dim">Täglich trainieren, Quests erfüllen, Level aufsteigen, Fähigkeiten freischalten, Schatten rekrutieren. Wer die täglichen Quests nicht schafft, wird bestraft.</p>'+
   '<label class="f" style="text-align:left;margin-top:8px">Dein Name<input type="text" id="introName" maxlength="30" value="" placeholder="Spieler"></label>'+

function lookOf(c){
  try{
    const k=document.createElement('canvas');k.width=k.height=16;const x=k.getContext('2d');x.drawImage(c,0,0,16,16);
    const d=x.getImageData(0,0,16,16).data;let R=0,G=0,B=0,n=0;
    for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];n++}
    R/=n*255;G/=n*255;B/=n*255;
    const mx=Math.max(R,G,B),mn=Math.min(R,G,B),l=(mx+mn)/2,dl=mx-mn,sat=dl===0?0:dl/(1-Math.abs(2*l-1));
    let h=0;if(dl>0){if(mx===R)h=((G-B)/dl+(G<B?6:0));else if(mx===G)h=(B-R)/dl+2;else h=(R-G)/dl+4;h*=60}
    if(l<0.25)return 'Nacht';
    if(l>0.72&&sat<0.35)return 'Licht';
    if(sat<0.14)return 'Stahl';
    if(h<45||h>=345)return 'Flammen';
    if(h<70)return 'Sonne';
    if(h<170)return 'Wald';
    if(h<250)return 'Frost';
    return 'Schatten';
  }catch(e){return null}
}

function authErr(e){
  const m=String((e&&(e.message||e.code))||e||'');
  if(/Invalid login/i.test(m))return 'E-Mail oder Passwort stimmt nicht.';
  if(/already registered|already been registered/i.test(m))return 'Diese E-Mail hat schon ein Konto. Nutze Anmelden.';
  if(/at least 6|weak/i.test(m))return 'Das Passwort ist zu schwach (mindestens 6 Zeichen).';
  if(/not confirmed/i.test(m))return 'Die E-Mail ist noch nicht bestätigt. Prüfe dein Postfach.';
  if(/rate limit|too many|seconds/i.test(m))return 'Zu viele Versuche. Warte kurz und versuche es erneut.';
  if(/invalid/i.test(m)&&/email/i.test(m))return 'Diese E-Mail-Adresse wird nicht akzeptiert.';
  return m.slice(0,160);
}

function grantXP(n){
  const r0=rankOf(S.level);let ups=0;
  S.xp+=n;
  while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;S.free+=3;ups++}
  if(ups){
    const r1=rankOf(S.level);
    const unlocked=SKILLS.filter(k=>k.lv<=S.level&&k.lv>S.level-ups);
    modal({pic:'levelup',title:'Level Up!',body:'<div class="big">LV '+S.level+'</div><p>+'+(3*ups)+' freie Statuspunkte</p>'+

  }
}
function giveKey(why){S.keys++;toast('Schlüssel gefunden'+(why?' ('+why+')':''))}
function recordDay(k){

  if(d.length)S.hist[k]={d:d.filter(q=>q.done).length,t:d.length};
}
function completeQuest(q){
  if(q.done)return;
  q.done=true;q.cur=q.target;
  const c=capState();let gx=q.xp,gg=q.gold;
  if(q.type==='dungeon'){if(c.dg>=1){gx=0;gg=0}else c.dg++}
  else{const room=Math.max(0,dayCap()-c.xp);if(gx>room){gg=Math.round(gg*room/Math.max(1,gx));gx=room}c.xp+=gx}
  if(gx>0){
    S.gold+=gg;S.totalDone++;
    if(q.stat&&S.stats[q.stat]!=null){
      const pts=Math.max(1,Math.min(4,Math.round(gx/15)));
      S.prog[q.stat]=(S.prog[q.stat]||0)+pts;
      while(S.prog[q.stat]>=statNeed(S.stats[q.stat])){S.prog[q.stat]-=statNeed(S.stats[q.stat]);S.stats[q.stat]++;toast('+1 '+statName(q.stat))}
    }
    toast('Quest abgeschlossen: +'+gx+' XP, +'+gg+' G'+(gx<q.xp?' (Tageslimit)':''));
    grantXP(gx);
    const kc=q.type==='dungeon'?1:q.type==='system'?0.4:0.15;
    if(Math.random()<kc)giveKey(q.type==='dungeon'?'Dungeon':'');
    if(S.totalDone%SHADOW_EVERY===0){
      const n=S.shadows.length+1;
      S.shadows.push({id:uid(),name:'Schatten-Soldat #'+n,rank:rankOf(S.level)});
      modal({pic:'shadows',kind:'vio',title:'Extraktion',body:'<img class="shd" alt="" src="img/shadow-'+SH_T[(n-1)%3]+'.webp" onerror="this.remove()"><div class="big" style="color:var(--violet);text-shadow:0 0 20px var(--violet)">Schatten #'+n+'</div><p>Ein neuer Soldat dient dir jetzt, Rang '+rankOf(S.level)+'. Er verstärkt dich im Kampf.</p>',btn:'Aufstehen'});
    }
  }else toast(q.type==='dungeon'?'Heute war schon ein Dungeon dran: keine Belohnung mehr.':'Tageslimit erreicht: Diese Quest bringt heute keine Belohnung mehr.');
  if(q.type==='daily'){
    const d=S.quests.filter(x=>x.type==='daily');
    if(d.length&&d.every(x=>x.done)&&S.lastComplete!==dayKey()){
      const y=dayKey(new Date(Date.now()-864e5));
      S.streak=(S.lastComplete===y)?S.streak+1:1;
      const p0=prestigeOf();S.lastComplete=dayKey();S.bestStreak=Math.max(S.bestStreak,S.streak);if(prestigeOf()>p0){const pz=PRESTIGE[prestigeOf()-1];modal({kind:'vio',title:'Prestige',body:'<div class="big stars">'+'★'.repeat(prestigeOf())+'</div><p>'+pz.n+'-Siegel: '+pz.d+' Tage Serie am Stück</p><p class="dim">Es steht jetzt neben deinem Namen, auch für deine Freunde.</p>',btn:'Stolz tragen'})}
      const bx=Math.min(100,30+S.streak*5),bg=20;
      S.gold+=bg;S.keys++;
      modal({pic:'daily',title:'Tagesquest geschafft',body:'<div class="big">'+S.streak+' 🔥</div><p>Serie: '+S.streak+' Tag'+(S.streak>1?'e':'')+' in Folge</p><p>Bonus: +'+bx+' XP, +'+bg+' G und ein Schlüssel</p>',btn:'Weiter'});
      grantXP(bx);
    }
  }
  if(q.type==='plan'){
    const pl=S.quests.filter(x=>x.type==='plan');
    if(pl.length&&pl.every(x=>x.done)&&S.planBonus!==dayKey()){
      S.planBonus=dayKey();S.gold+=10;
      modal({title:'Trainingsplan geschafft',body:'<div class="big">'+WD[wdToday()]+'</div><p>Alle Übungen von heute sind erledigt.</p><p>Bonus: +25 XP und +10 G</p>',btn:'Weiter'});
      grantXP(25);
    }
  }
}
function addProgress(q,n){
  if(q.done||!(n>0))return;
  q.cur=Math.min(q.target,q.cur+n);
  if(q.cur>=q.target)completeQuest(q);
}
function genSys(){
  const lv=S.level;
  const weakest=STATS.map(s=>s[0]).sort((a,b)=>S.stats[a]-S.stats[b])[0];
  let pool=SYS_T.filter(t=>t.s===weakest);
  if(!pool.length||Math.random()>0.6)pool=SYS_T;
  const t=pool[Math.floor(Math.random()*pool.length)];
  const target=t.b===1?1:Math.round(t.b*(1+lv*0.03));
  return {n:t.n,u:t.u,s:t.s,target,xp:35+Math.round(lv*1.5),gold:20,weak:t.s===weakest};
}

function rollover(){
  const t=dayKey();
  if(S.lastDay===t)return;
  if(S.lastDay){
    const diff=dayNum(t)-dayNum(S.lastDay);
    const dailies=S.quests.filter(q=>q.type==='daily');
    recordDay(S.lastDay);
    for(let i=1;i<Math.min(diff,8);i++){if(dailies.length)S.hist[addDays(S.lastDay,i)]={d:0,t:dailies.length}}
    let failed=0;
    if(dailies.length){
      if(dailies.some(q=>!q.done))failed+=1;
      failed+=Math.min(Math.max(diff-1,0),2);
    }
    if(failed>0){
      const sx=dailies.reduce((a,q)=>a+q.xp,0),sg=dailies.reduce((a,q)=>a+q.gold,0);
      const lx=Math.min(S.xp,Math.round(sx*0.5*failed)),lg=Math.min(S.gold,Math.round(sg*0.25*failed));
      S.xp-=lx;S.gold-=lg;S.streak=0;
      const ptx=[];for(let i=0;i<failed;i++){const tx=genPenalty();ptx.push(tx);S.penalties.push({id:uid(),text:tx})}
      modal({kind:'bad',title:'Strafe',body:'<p>Die täglichen Quests wurden nicht abgeschlossen.</p><p style="color:var(--bad);font-family:var(--f-d);font-size:20px">−'+lx+' XP, −'+lg+' G</p><p>Strafquest'+(failed>1?'s':'')+':<br>'+ptx.map(esc).join('<br>')+'</p><p class="dim">Die Serie ist zurückgesetzt. Solange Strafen offen sind, ist der Shop gesperrt.</p>',btn:'Verstanden'});
    }
    const keys=Object.keys(S.hist).sort();
    while(keys.length>150)delete S.hist[keys.shift()];
  }
  S.quests=S.quests.filter(q=>q.type!=='system'&&q.type!=='plan');
  S.quests.forEach(q=>{if(q.type==='daily'){q.cur=0;q.done=false}});
  syncPlan();
  S.sys={day:t,q:genSys(),st:'open'};
  S.lastDay=t;save();
}

/* ---------- battle ---------- */
function startBattle(door){
  if(S.keys<1||B)return;
  const ri=Math.min(5,rankIdx(S.level)+(door==='red'?1:0));
  const L=S.level,p=pStats();
  const mo=MON[ri][Math.floor(Math.random()*3)],name=mo[0];
  const mhp=Math.round(40+L*8+ri*25);
  B={ri,door,mon:{name,img:mo[1],fx:mo[2],hp:mhp,max:mhp,atk:6+L*1.5+ri*4},p:{hp:p.hp,max:p.hp,mp:p.mp,maxmp:p.mp},
     log:[{t:'Eine '+(door==='red'?'rote ':'')+'Tür öffnet sich. '+name+' (Rang '+RANKS[ri]+') greift an!',c:''}],stun:0,dodge:false,over:null,res:null};
}
function monsterTurn(){
  const m=B.mon,p=pStats();
  if(B.stun>0){B.stun--;B.log.push({t:m.name+' ist betäubt und setzt aus.',c:'good'});return}
  if(B.dodge){B.dodge=false;B.log.push({t:'Du weichst dem Angriff von '+m.name+' aus.',c:'good'});return}
  if(Math.random()<p.dodge){B.log.push({t:'Du weichst '+m.name+' aus.',c:'good'});return}
  const dmg=Math.max(1,Math.round((m.atk-p.def)*rnd(.85,1.15)));
  B.p.hp=Math.max(0,B.p.hp-dmg);
  B.log.push({t:m.name+' trifft dich für '+dmg+'.',c:'took'});
}
function playerHit(mulT,txt){
  const p=pStats();
  let dmg=p.atk*mulT*rnd(.85,1.15),crit=Math.random()<p.crit;
  if(crit)dmg*=1.8;
  dmg=Math.max(1,Math.round(dmg));
  B.mon.hp=Math.max(0,B.mon.hp-dmg);B.hit=true;
  B.log.push({t:txt+' '+dmg+' Schaden'+(crit?' (kritisch!)':'')+'.',c:'hit'});
  if(S.shadows.length){const sd=Math.round(S.shadows.length*1.5);B.mon.hp=Math.max(0,B.mon.hp-sd);B.log.push({t:'Deine Schatten greifen an: '+sd+' Schaden.',c:'hit'})}
}
function battleAct(a){
  if(!B||B.over)return;
  B.hit=false;
  const p=pStats();
  if(a==='atk')playerHit(1,'Du schlägst zu:');
  else if(a==='potion'){
    if(S.potions<1)return;
    S.potions--;const h=Math.round(B.p.max*0.4);B.p.hp=Math.min(B.p.max,B.p.hp+h);
    B.log.push({t:'Trank getrunken: +'+h+' Lebenspunkte.',c:'good'});
  }else if(a.startsWith('skill:')){
    const k=SKILLS.find(x=>x.id===a.slice(6));
    if(!k||S.level<k.lv||B.p.mp<k.mp)return;
    B.p.mp-=k.mp;
    if(k.id==='heavy')playerHit(1.8,k.name+':');
    else if(k.id==='step'){playerHit(1.2,k.name+':');B.dodge=true}
    else if(k.id==='heal'){const h=Math.round(B.p.max*0.3);B.p.hp=Math.min(B.p.max,B.p.hp+h);B.log.push({t:k.name+': +'+h+' Lebenspunkte.',c:'good'})}
    else if(k.id==='blade')playerHit(3,k.name+':');
    else if(k.id==='aura'){playerHit(2,k.name+':');B.stun=1}
  }
  B.p.mp=Math.min(B.p.maxmp,B.p.mp+3);
  if(B.mon.hp<=0){endBattle(true);return}
  monsterTurn();
  if(B.p.hp<=0)endBattle(false);
  if(B.log.length>40)B.log=B.log.slice(-40);
}
function lootItem(ri){
  const roll=Math.random();
  if(roll>0.6)return null;
  if(roll<0.15)return {kind:'potion',n:1+(Math.random()<.3?1:0)};
  const kind=roll<0.4?'weapon':'armor';
  const pre=['Rostiges','Stählernes','Verzaubertes','Meisterhaftes','Legendäres','Schatten-'][ri];
  const base=kind==='weapon'?['Dolch','Schwert','Streitaxt']:['Lederweste','Kettenhemd','Plattenpanzer'];
  const val=Math.round(2+ri*3+S.level*0.25+rnd(0,2));
  return {kind,val,name:pre+(pre.endsWith('-')?'':' ')+base[Math.floor(Math.random()*3)]};
}
function endBattle(win){
  B.over=win?'win':'lose';
  S.keys=Math.max(0,S.keys-1);
  const ri=B.ri,L=S.level;
  if(win){
    S.wins++;
    const xp=20+ri*30+L*2,g=15+ri*20;
    S.gold+=g;
    const it=lootItem(ri);let lt='',li=null;
    if(it){
      if(it.kind==='potion'){S.potions+=it.n;lt='Beute: '+it.n+' Trank';li={kind:'potion',n:it.n}}
      else{
        const how=addToBag({kind:it.kind,val:it.val,name:it.name,r:ri});
        lt='Beute: '+it.name+' (+'+it.val+' '+(it.kind==='weapon'?'Angriff':'Rüstung')+'), '+how;
        li={kind:it.kind,name:it.name,r:ri,val:it.val};
      }
    }
    B.res={win:true,xp,g,lt,li};
    B.log.push({t:B.mon.name+' ist besiegt!',c:'good'});
    save();grantXP(xp);
  }else{
    const lg=Math.round(S.gold*0.1);S.gold-=lg;
    B.res={win:false,lg};
    B.log.push({t:'Du bist gefallen.',c:'took'});
  }
  save();
}

function fighter(c,m){
  const st=c.stats;
  return {name:c.name,max:(50+st.vit*5)*m,hp:(50+st.vit*5)*m,atk:(4+st.str*0.9+c.gw+c.sh*1.5)*m,def:st.vit*0.25+c.ga,dodge:Math.min(.35,st.agi*.004),crit:Math.min(.4,st.dis*.005),agi:st.agi};
}
function cleanCard(c){
  const st={};STATS.forEach(([k])=>{st[k]=clampN(c.stats&&c.stats[k],1,999,10)});
  return {name:String(c.name||'Hunter').slice(0,30),level:clampN(c.level,1,999,1),rank:RANKS.includes(c.rank)?c.rank:'E',stats:st,cons:clampN(c.cons,0,100,50),days:clampN(c.days,0,14,0),
    gw:clampN(c.gw,0,99,0),ga:clampN(c.ga,0,99,0),sh:clampN(c.sh,0,999,0),thumb:typeof c.thumb==='string'&&c.thumb.startsWith('data:image/')&&c.thumb.length<20000?c.thumb:null,cls:String(c.cls||'').slice(0,40),au:null,pr:clampN(c.pr,0,PRESTIGE.length,0),fc:String(c.fc||'').replace(/[^A-Za-z0-9]/g,'').slice(0,8),fl:Array.isArray(c.fl)?c.fl.slice(0,100).map(x=>String(x).slice(0,40)):[]};
}
function cleanDuel(o){
  if(!o)return null;
  return {fn:String(o.fromName||'Hunter').slice(0,30),fw:!!o.fromWin,rounds:clampN(o.rounds,1,99,1),t:clampN(o.t,0,9e15,0)};
}
function markSeen(){
  const m=Math.max(S.duelSeen||0,...duelsIn.map(d=>d.t));
  if(m!==(S.duelSeen||0)){S.duelSeen=m;save()}
}
function hash32(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ck(c){return JSON.stringify([c.name,c.level,c.rank,STATS.map(([k])=>c.stats[k]),c.cons,c.gw,c.ga,c.sh])}
/* deterministic and symmetric: both sides get the same result from the same two cards */
function simulate(c1,c2){
  const sw=ck(c1)>ck(c2),x=sw?c2:c1,y=sw?c1:c2;
  const rng=mulberry32(hash32(ck(x)+'|'+ck(y)));
  const A=fighter(x,mult(x.cons)),Bf=fighter(y,mult(y.cons));
  let rounds=0;
  while(A.hp>0&&Bf.hp>0&&rounds<60){
    rounds++;
    const order=(A.agi+rng()*10>=Bf.agi+rng()*10)?[[A,Bf],[Bf,A]]:[[Bf,A],[A,Bf]];
    for(const [a,d] of order){
      if(a.hp<=0||d.hp<=0)continue;
      if(rng()<d.dodge)continue;
      let v=Math.max(1,(a.atk-d.def)*(.85+rng()*.3));if(rng()<a.crit)v*=1.8;
      d.hp=Math.max(0,d.hp-v);
    }
  }
  const firstWins=A.hp>Bf.hp||(A.hp===Bf.hp&&rng()<.5);
  const win=sw?!firstWins:firstWins;
  const h1=sw?Bf:A,h2=sw?A:Bf;
  return {win,rounds,hp1:Math.round(h1.hp/h1.max*100),hp2:Math.round(h2.hp/h2.max*100),m1:mult(c1.cons),m2:mult(c2.cons)};
}
function encodeCode(c){
  const o={n:c.name,l:c.level,r:c.rank,s:STATS.map(([k])=>c.stats[k]),c:c.cons,d:c.days,w:c.gw,a:c.ga,h:c.sh};
  return 'HUNTER1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function decodeCode(t){
  try{
    t=String(t).trim();if(!t.startsWith('HUNTER1:'))return null;
    const o=JSON.parse(decodeURIComponent(escape(atob(t.slice(8)))));
    const st={};STATS.forEach(([k],i)=>{st[k]=o.s[i]});
    return cleanCard({name:o.n,level:o.l,rank:o.r,stats:st,cons:o.c,days:o.d,gw:o.w,ga:o.a,sh:o.h});
  }catch(e){return null}
}
async function doDuel(other,peerId){
  const me=myCard(),r=simulate(me,other),today=dayKey();
  if(S.arena.day!==today){S.arena.day=today;S.arena.n=0;S.arena.dk=[]}
  S.arena.dk=S.arena.dk||[];
  const key=String(hash32(ck(other)));
  let rw='';
  if(!S.arena.dk.includes(key)){
    S.arena.dk.push(key);
    if(r.win){S.arena.w++;if(S.arena.n<3){S.arena.n++;S.gold+=15;rw='+15 G und +20 XP (Duell-Belohnung '+S.arena.n+'/3 heute)'}else rw='Heute keine Belohnung mehr (max. 3 Siege).'}
    else S.arena.l++;
  }else rw='Gleicher Gegner, gleicher Tag: nicht erneut gezählt. Das Ergebnis bleibt gleich, bis sich Werte ändern.';
  save();
  let note='';
  if(peerId&&online){
    try{
      const did=myId+'_'+peerId+'_'+today;
      const r2=await sb.from('duels').upsert({id:did,from_id:myId,to_id:peerId,data:{fromName:me.name,toName:other.name,fromWin:r.win,rounds:r.rounds,t:Date.now()},updated_at:new Date().toISOString()});
      if(r2.error)throw r2.error;
      note='Dein Freund sieht das Ergebnis in seiner Arena, sobald er die App öffnet.';
    }catch(e){note='An den Freund senden hat nicht geklappt. Schick ihm stattdessen deinen Hunter-Code.'}
  }else if(!peerId)note='Dein Freund sieht dasselbe Ergebnis, wenn er deinen Hunter-Code bei sich einfügt.';
  modal({kind:r.win?'':'bad',title:r.win?'Sieg':'Niederlage',body:'<p style="font-family:var(--f-d);font-size:20px">'+esc(me.name)+' gegen '+esc(other.name)+'</p>'+
    '<p class="dim">'+r.rounds+' Runden. Übrige Lebenspunkte: du '+r.hp1+' %, Gegner '+r.hp2+' %.</p>'+
    '<p class="dim">Konstanz-Bonus: du x'+r.m1.toFixed(2)+' ('+me.cons+' %), Gegner x'+r.m2.toFixed(2)+' ('+other.cons+' %). Wer in den letzten 14 Tagen dranbleibt, kämpft stärker, egal wie lange er schon dabei ist.</p>'+
    (rw?'<p style="color:var(--ok)">'+esc(rw)+'</p>':'')+(note?'<p class="dim">'+esc(note)+'</p>':'')});
  if(r.win&&rw.startsWith('+15'))grantXP(20);
  render();
}

function radar(){
  const vals=STATS.map(([k])=>S.stats[k]),mx=Math.max(30,...vals)*1.1,cx=150,cy=118,R=88;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/5;return [cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v]};
  const poly=f=>STATS.map((_,i)=>pt(i,f).map(x=>x.toFixed(1)).join(',')).join(' ');
  let g=[.34,.67,1].map(f=>'<polygon class="ring" points="'+poly(f)+'"/>').join('');
  g+=STATS.map((_,i)=>{const p=pt(i,1);return '<line class="ax" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>'}).join('');
  const shape=STATS.map(([k],i)=>pt(i,S.stats[k]/mx).map(x=>x.toFixed(1)).join(',')).join(' ');
  const lab=STATS.map(([k,l],i)=>{const p=pt(i,1.3);return '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'">'+l+' '+S.stats[k]+'</text>'}).join('');
  return '<svg class="radar" viewBox="0 0 300 236" role="img" aria-label="Werte-Diagramm">'+g+'<polygon class="shape" points="'+shape+'"/>'+lab+'</svg>';
}

function viewVerlauf(){

  const live=(()=>{const d=S.quests.filter(q=>q.type==='daily');return d.length?{d:d.filter(q=>q.done).length,t:d.length}:null})();
  let cells='';
  for(let i=0;i<84;i++){
    const k=addDays(start,i);
    if(dayNum(k)>dayNum(today)){cells+='<i class="fu"></i>';continue}
    const h=k===today?live:S.hist[k];
    let cl='';
    if(h&&h.t>0){const r=h.d/h.t;cl=r>=1?'c3':r>=0.67?'c2':r>0?'c1':'c0'}
    cells+='<i class="'+cl+(k===today?' today':'')+'" title="'+k+(h?': '+h.d+' von '+h.t:'')+'"></i>';

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a!=='del')armed=null;
  if(a!=='reset')penArmed=false;
  if(a!=='sell')sellArmed=null;
  if(a!=='fit-tpl'&&a!=='fit-clear')fitArmed=null;
  const q=S.quests.find(x=>x.id===id);
  switch(a){
    case 'modal-ok':nextModal();render();return;
    case 'start':{
      const v=(document.getElementById('introName')||{}).value||'';
      const f=(document.getElementById('introPhoto')||{}).files;
      const file=f&&f[0];
      S.name=v.trim()||'Spieler';applyIntro();S.started=true;S.lastDay=dayKey();S.sys={day:S.lastDay,q:genSys(),st:'open'};save();nextModal();render();
      if(file)setAvatar(file);
      return;
    }
    case 'i-cls':introSel.cls=introSel.cls===id?'':id;pickMark('i-cls',introSel.cls);return;
    case 'i-pack':introSel.pack=id;pickMark('i-pack',id);return;
    case 'setcls':if(clsOk(id,S.level)){S.cls=id;save()}break;
    case 'tab':tab=id;form=null;if(id==='arena'){arenaSince=S.duelSeen||0;markSeen()}break;
    case 'add':{const i=document.getElementById('amt-'+id);if(q)addProgress(q,Number(i&&i.value));save();break}
    case 'done':if(q){completeQuest(q);save()}break;
    case 'del':
      if(armed===id){S.quests=S.quests.filter(x=>x.id!==id);armed=null;save()}else armed=id;break;
    case 'newq':form=newForm(id);break;
    case 'edit':if(q)form={id:q.id,name:q.name,type:q.type,rank:q.rank||'E',target:q.target,unit:q.unit||'',stat:q.stat||'dis',xp:q.xp,gold:q.gold};break;
    case 'fcancel':form=null;break;
    case 'fsave':{
      const f=readForm();
      if(!f.name.trim()){toast('Gib der Quest einen Namen');return}
      const t=Math.min(1000,Math.max(1,f.target||1));
      if(f.type==='dungeon'&&RANKS.indexOf(f.rank)>maxGate())f.rank=RANKS[maxGate()];
      if(!f.id){
        if(f.type==='daily'&&S.quests.filter(y=>y.type==='daily').length>=QUEST_MAX){toast('Höchstens '+QUEST_MAX+' tägliche Quests');return}
        if(f.type==='dungeon'&&S.quests.filter(y=>y.type==='dungeon'&&!y.done).length>=GATE_MAX){toast('Höchstens '+GATE_MAX+' offene Dungeons');return}
      }
      const xp=calcXP(t,f.unit,f.type,f.rank),gd=calcGold(xp,f.type,f.rank);
      if(f.id){
        const x=S.quests.find(y=>y.id===f.id);
        if(x){const typeChanged=x.type!==f.type;Object.assign(x,{name:f.name.trim(),type:f.type,rank:f.rank,target:t,unit:f.unit.trim(),stat:f.stat,xp,gold:gd});if(typeChanged||x.cur>=t){x.cur=0;x.done=false}x.cur=Math.min(x.cur,t)}
      }else S.quests.push({id:uid(),name:f.name.trim(),type:f.type,rank:f.rank,target:t,unit:f.unit.trim(),stat:f.stat,xp,gold:gd,cur:0,done:false});
      form=null;save();toast('Quest gespeichert');break;
    }
    case 'sys-accept':{
      const s=S.sys.q;if(!s||S.sys.st!=='open')break;
      S.quests.push({id:uid(),name:s.n,target:s.target,unit:s.u,stat:s.s,xp:s.xp,gold:s.gold,type:'system',rank:'E',cur:0,done:false});
      S.sys.st='accepted';save();break;
    }
    case 'sys-decline':S.sys.st='declined';save();break;
    case 'plan-toggle':planOpen=!planOpen;break;
    case 'plan-ask':askPlan();return;
    case 'plan-apply':{
      if(!planRes)break;
      let n=0;
      planRes.qs.forEach((p,i)=>{const c=document.getElementById('pl-'+i);if(c&&c.checked&&S.quests.filter(x=>x.type==='daily').length<QUEST_MAX){const px=calcXP(p.target,p.unit,'daily');S.quests.push({id:uid(),name:p.name,target:p.target,unit:p.unit,stat:p.stat,xp:px,gold:calcGold(px),type:'daily',rank:'E',cur:0,done:false});n++}});
      planRes=null;planOpen=false;save();toast(n+' Quest'+(n===1?'':'s')+' übernommen');break;
    }
    case 'door':startBattle(id);break;
    case 'battle':battleAct(id);save();break;
    case 'battle-end':B=null;break;
    case 'duel':{const pe=peers.find(x=>x.id===id);if(pe)doDuel(cleanCard(pe),id);return}
    case 'auth-login':authAct('login');return;
    case 'auth-signup':authAct('signup');return;
    case 'auth-guest':authAct('guest');return;
    case 'auth-local':authAct('local');return;
    case 'acc-upgrade':upgradeAccount();return;
    case 'acc-out':signOutNow();return;
    case 'addfriend':{addFriendByCode((document.getElementById('friendIn')||{}).value||'',false);return}
    case 'delfriend':S.friends=S.friends.filter(f=>f.id!==id);save();break;
    case 'toggleall':showAll=!showAll;break;
    case 'invite':{
      const link=location.origin+location.pathname+'?add='+myFc();
      const tmp=document.createElement('textarea');tmp.value=link;tmp.style.position='fixed';tmp.style.opacity='0';document.body.appendChild(tmp);
      const done=()=>{tmp.remove();toast('Einladungs-Link kopiert')};
      try{navigator.clipboard.writeText(link).then(done,()=>{tmp.select();try{document.execCommand('copy')}catch(x){}done()})}catch(x){tmp.select();try{document.execCommand('copy')}catch(y){}done()}
      return;
    }
    case 'duelcode':{
      const c=decodeCode((document.getElementById('friendCode')||{}).value||'');
      if(!c){toast('Der Code ist ungültig');return}
      doDuel(c,null);return;
    }
    case 'copycode':{
      const el=document.getElementById('myCode');if(!el)return;
      const fb=()=>{el.focus();el.select();toast('Markiert, jetzt kopieren')};
      try{navigator.clipboard.writeText(el.value).then(()=>toast('Code kopiert'),fb)}catch(x){fb()}
      return;
    }
    case 'photo':document.getElementById('avatarIn').click();return;
    case 'profile':genProfile(null);return;
    case 'pen':S.penalties=S.penalties.filter(p=>p.id!==id);save();toast('Strafe abgeleistet');break;
    case 'fit-toggle':fitOpen=!fitOpen;if(fitOpen)fitDay=wdToday();break;
    case 'fit-day':fitDay=Math.max(0,Math.min(6,Number(id)||0));break;
    case 'fit-del':{const arr=S.plan.d[fitDay];const i=arr.findIndex(x=>x.id===id);if(i>=0){arr.splice(i,1);if(fitDay===wdToday())syncPlan();save()}break}
    case 'fit-add':{
      const arr=S.plan.d[fitDay];
      if(arr.length>=PLAN_DAY_MAX){toast('Höchstens '+PLAN_DAY_MAX+' Übungen pro Tag');return}
      const tar=Math.min(1000,Math.max(1,Math.round((Number(document.getElementById('fxTar').value)||1)*10)/10));
      let it;
      if(fitSel>=0&&EX[fitSel])it={id:uid(),name:EX[fitSel][0],target:tar,unit:EX[fitSel][1],stat:EX[fitSel][2]};
      else{
        const nm=(document.getElementById('fxName').value||'').trim().slice(0,40);
        if(!nm){toast('Gib der Übung einen Namen');return}
        const un=document.getElementById('fxUnit').value,st=document.getElementById('fxStat').value;
        it={id:uid(),name:nm,target:tar,unit:PLAN_UNITS.includes(un)?un:'Min.',stat:STATS.some(x=>x[0]===st)?st:'dis'};
      }
      arr.push(it);if(fitDay===wdToday())syncPlan();save();toast('Zum Plan hinzugefügt');break;
    }
    case 'fit-tpl':{
      const T=PLAN_TPL[id];if(!T)break;
      if(S.plan.d.some(a=>a.length)&&fitArmed!==id){fitArmed=id;break}
      S.plan=emptyPlan();Object.keys(T.d).forEach(k=>{S.plan.d[Number(k)]=T.d[k].map(a=>({id:uid(),name:a[0],target:a[1],unit:a[2],stat:a[3]}))});
      fitArmed=null;syncPlan();save();toast('Vorlage übernommen: '+T.n);break;
    }
    case 'fit-clear':{
      if(fitArmed!=='clear'){fitArmed='clear';break}
      S.plan=emptyPlan();fitArmed=null;syncPlan();save();toast('Plan geleert');break;
    }
    case 'equip':{const i=S.bag.findIndex(x=>x.id===id);if(i>=0){const it=S.bag[i],cur=S.gear[it.kind];S.bag.splice(i,1);if(cur)S.bag.push(cur);S.gear[it.kind]=it;save();toast('Ausgerüstet: '+it.name)}break}
    case 'unequip':{const cur=S.gear[id];if(cur&&S.bag.length<BAG_MAX){S.bag.push(cur);S.gear[id]=null;save()}else if(cur)toast('Rucksack ist voll');break}
    case 'sell':{const i=S.bag.findIndex(x=>x.id===id);if(i<0)break;if(sellArmed===id){const it=S.bag.splice(i,1)[0];S.gold+=sellPrice(it);sellArmed=null;save();toast('Verkauft: '+it.name+' (+'+sellPrice(it)+' G)')}else sellArmed=id;break}
    case 'sellweak':{let g=0,n=0;S.bag=S.bag.filter(it=>{const cur=S.gear[it.kind];if(cur&&it.val<=cur.val){g+=sellPrice(it);n++;return false}return true});if(n){S.gold+=g;save();toast(n+' Teile verkauft (+'+g+' G)')}else toast('Nichts Schwächeres im Rucksack');break}
    case 'stat':if(S.free>0&&S.stats[id]!=null){S.free--;S.stats[id]++;save()}break;
    case 'settings':{
      S.name=(document.getElementById('setName').value.trim()||'Spieler');
      save();toast('Gespeichert');break;
    }
    case 'reset':
      if(penArmed){S=defaults();S.started=true;S.lastDay=dayKey();S.sys={day:S.lastDay,q:genSys(),st:'open'};penArmed=false;tab='quests';B=null;save();toast('Neu gestartet')}else penArmed=true;break;
    case 'buy':{
      const it=S.shop.find(x=>x.id===id);
      if(it&&S.gold>=it.price&&!S.penalties.length){S.gold-=it.price;const h=S.inv.find(x=>x.name===it.name);if(h)h.n++;else S.inv.push({name:it.name,n:1});save();toast('Gekauft: '+it.name)}
      break;
    }
    case 'delshop':S.shop=S.shop.filter(x=>x.id!==id);save();break;
    case 'addshop':{
      const n=document.getElementById('shName').value.trim();
      if(!n){toast('Gib der Belohnung einen Namen');return}
      if(S.shop.length>=SHOP_MAX){toast('Höchstens '+SHOP_MAX+' Belohnungen');return}
      const want=Math.max(0,Math.min(3,Number(document.getElementById('shTier').value)||0)),tier=Math.max(want,shopMinTier(n));
      S.shop.push({id:uid(),name:n.slice(0,60),price:TIER_PRICE[tier]});save();
      toast(tier>want?'Das System stuft das höher ein: '+TIER_PRICE[tier]+' G':'Hinzugefügt: '+TIER_PRICE[tier]+' G');break;
    }
    case 'use':{
      const h=S.inv.find(x=>x.name===id);
      if(h){h.n--;if(h.n<=0)S.inv=S.inv.filter(x=>x!==h);save();toast('Eingelöst: '+id)}
      break;
    }
    default:return;
  }
  render();
});
document.addEventListener('input',e=>{
  if(e.target.id==='fxTar'||e.target.id==='fxUnit'){fitPrev();return}
  if(!form||(e.target.id!=='fTarget'&&e.target.id!=='fUnit'))return;
  const p=document.getElementById('fPrev');if(p)p.textContent=prevText(readForm());
});
document.addEventListener('change',e=>{
  if(e.target.id==='avatarIn'){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)setAvatar(f);return}
  if(e.target.id==='fxEx'){fitSel=Number(e.target.value);render();return}
  if(!form)return;
  const id=e.target.id;
  if(id==='fType'||id==='fRank'){
    const old=form,f=readForm();
    if(id==='fType'){f.rank='E'}
    if(f.type==='dungeon'&&old.type!==f.type)f.stat='str';
    form=f;render();
  }
});

if(S.started&&S.sys.st==='none'){S.sys={day:dayKey(),q:genSys(),st:'open'}}
if(S.started){rollover();syncPlan()}
render();
if(!S.started&&!(SUPABASE_URL&&SUPABASE_KEY))showIntro();
initRemote();
})();
</script>
</body>
</html>
